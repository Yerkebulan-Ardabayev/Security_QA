нии достаточно объяснить сами понятия и типовые причины, а не давать пошаговый рецепт для конкретной системы.<\\/p>","sources":["https://attack.mitre.org/tactics/TA0004/","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":228,"num":229,"category":"Пентест и offensive-основы","text":"Что такое горизонтальное перемещение (lateral movement)?","answer":"<p>Горизонтальное перемещение это переход злоумышленника с одного скомпрометированного узла на другие внутри сети, чтобы приблизиться к цели (данные, контроллер домена). После первичного доступа атакующий редко сразу оказывается там, где нужно, поэтому перемещается, используя добытые учётные данные и легитимные механизмы удалённого управления.<\\/p><p>Именно поэтому в защите так важна сегментация сети и наименьшие привилегии: если каждый узел изолирован и учётная запись имеет доступ только к необходимому, перемещение резко затрудняется. В ATT&CK это тактика Lateral Movement, и её техники (удалённые сервисы, передача хеша и подобные) полезны как чек-лист для настройки обнаружения.<\\/p><p>Для blue team перемещение это хорошая точка обнаружения: необычные входы служебных учёток на нетипичные хосты, всплеск использования административных протоколов между рабочими станциями, вход одной учётной записи на множество машин за короткое время.<\\/p>","sources":["https://attack.mitre.org/tactics/TA0008/","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":229,"num":230,"category":"Пентест и offensive-основы","text":"Как устроено тестирование безопасности веб-приложений и что такое OWASP WSTG?","answer":"<p>OWASP Web Security Testing Guide (WSTG) это стандартная методика проверки веб-приложений: структурированный перечень проверок по категориям (управление конфигурацией, аутентификация, управление сессиями, авторизация, валидация ввода, бизнес-логика и другие). Она нужна, чтобы тестирование было полным и повторяемым, а не набором случайных попыток.<\\/p><p>На практике работа идёт через перехватывающий прокси (Burp Suite, OWASP ZAP), который позволяет видеть и изменять запросы между браузером и приложением. Так проверяют, доверяет ли приложение данным от клиента, правильно ли разграничивает доступ, корректно ли управляет сессиями.<\\/p><p>Категории WSTG удобно сопоставлять с OWASP Top 10: Top 10 говорит, какие классы проблем самые частые, а WSTG как их методично проверить. Для собеседования на AppSec знание этой связки ценится.<\\/p>\\n<pre><code>docker run -t ghcr.io/zaproxy/zaproxy \\\\\\n  zap-baseline.py -t https://juice-shop.local   # пассивный скан учебного стенда<\\/code><\\/pre>\\n<p>Проверку ведут по OWASP Web Security Testing Guide на разрешённом стенде. Пассивный скан ZAP находит очевидное, а ручная проверка логики идёт через перехватывающий прокси. Учебные цели вроде Juice Shop для этого и созданы.<\\/p>","sources":["https://owasp.org/www-project-web-security-testing-guide/","https://owasp.org/www-project-top-ten/"]},{"id":230,"num":231,"category":"Пентест и offensive-основы","text":"Что такое перехватывающий прокси и зачем он нужен?","answer":"<p>Перехватывающий прокси (Burp Suite, OWASP ZAP) встаёт между браузером и приложением и показывает все HTTP-запросы и ответы, позволяя их читать и изменять до отправки. Это основной инструмент тестирования веб-приложений, потому что главный источник проблем это чрезмерное доверие приложения к данным, приходящим от клиента.<\\/p><p>С его помощью проверяют, что будет, если поменять идентификатор в запросе (проверка авторизации и IDOR), убрать или подменить параметр, отправить неожиданный ввод. Также он автоматизирует рутину: повтор запросов, перебор значений, базовое сканирование.<\\/p><p>Вывод для разработчика прямой и важный на собеседовании: любая проверка, сделанная только на стороне браузера, не является защитой, потому что клиент полностью под контролем пользователя. Все проверки безопасности и авторизации должны дублироваться на сервере.<\\/p>","sources":["https://www.zaproxy.org/docs/","https://owasp.org/www-project-web-security-testing-guide/"]},{"id":231,"num":232,"category":"Пентест и offensive-основы","text":"Что такое Active Directory и почему это частая цель на пентесте?","answer":"<p>Active Directory (AD) это служба каталогов Microsoft, которая централизованно управляет пользователями, компьютерами и правами в корпоративной сети Windows. Она частая цель, потому что компрометация домена обычно означает контроль почти над всей инфраструктурой, а исторически накопленные настройки во многих организациях содержат опасные ошибки конфигурации.<\\/p><p>Типичные слабые места это избыточные права учётных записей, устаревшие протоколы аутентификации, служебные учётки со слабыми паролями и чрезмерными правами, неаккуратно настроенное делегирование. Атакующий последовательно собирает права и перемещается к учётной записи администратора домена. Для анализа отношений в AD пентестеры используют инструменты вроде BloodHound, которые показывают пути эскалации графом.<\\/p><p>С точки зрения защиты помогает многоуровневая модель администрирования (tiering), регулярный аудит прав, отдельные защищённые учётки для администраторов и мониторинг подозрительной активности аутентификации. Microsoft публикует рекомендации по безопасности AD.<\\/p>","sources":["https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/security-best-practices/best-practices-for-securing-active-directory","https://attack.mitre.org/tactics/TA0008/"]},{"id":232,"num":233,"category":"Пентест и offensive-основы","text":"Что такое OWASP Juice Shop, HackTheBox и TryHackMe и зачем они нужны?","answer":"<p>Это легальные учебные площадки для отработки навыков наступательной безопасности, где вы работаете с намеренно уязвимыми системами, специально подготовленными для обучения, а не с чужими. OWASP Juice Shop это намеренно уязвимое веб-приложение для практики по OWASP Top 10. HackTheBox и TryHackMe это платформы с учебными машинами и заданиями от новичка до эксперта.<\\/p><p>Их ценность в том, что они дают безопасную и законную среду. Тренироваться на реальных чужих системах без разрешения нельзя, а здесь весь стенд создан для того, чтобы его исследовали. Это правильный ответ и на собеседовании: практический опыт нужно набирать на разрешённых полигонах или в собственной лаборатории.<\\/p><p>Для подготовки к сертификациям (например, практическим экзаменам с реальными машинами) такие площадки это основной способ наработать методику и скорость.<\\/p>","sources":["https://owasp.org/www-project-juice-shop/","https://owasp.org/www-project-web-security-testing-guide/"]},{"id":233,"num":234,"category":"Пентест и offensive-основы","text":"Какие сертификации по наступательной безопасности вы знаете и чем они различаются?","answer":"<p>Сертификации делятся на теоретические и практические. Практические ценятся выше, потому что требуют реально решить задания на стенде. OSCP (Offensive Security Certified Professional) это известный практический экзамен: несколько машин за ограниченное время плюс отчёт, проверяет методику и упорство. PNPT это практический экзамен с упором на Active Directory и обязательным отчётом и защитой результатов. CEH (Certified Ethical Hacker) более теоретический и широкий по охвату.<\\/p><p>Есть и специализированные: по веб-приложениям (например, Burp Suite Certified Practitioner), по red team, по облаку. Выбор зависит от цели: для роли пентестера практические сертификаты вроде OSCP или PNPT говорят работодателю больше, чем теоретические.<\\/p><p>Общее у всех практических экзаменов это требование отчёта. Умение внятно описать находку, риск и рекомендацию так же важно, как техническая часть, и на собеседовании это стоит подчёркивать.<\\/p>","sources":["https://www.offsec.com/courses/pen-200/","https://certifications.tcm-sec.com/pnpt/"]},{"id":234,"num":235,"category":"Пентест и offensive-основы","text":"Что обязательно должно быть в отчёте по пентесту?","answer":"<p>Отчёт это то, за что заказчик платит, а не список побед. Его делают для двух читателей. Резюме для руководства на языке бизнеса: общий уровень защищённости, самые важные риски, что это значит для организации, без технического жаргона. Техническая часть для инженеров: каждая находка с описанием, шагами воспроизведения, доказательством, оценкой риска (обычно по CVSS плюс контекст) и конкретной рекомендацией.<\\/p><p>Хорошая рекомендация отвечает на вопрос, что именно сделать, а не просто называет проблему. Находки приоритезируются, чтобы команда понимала, за что браться первым. Полезно отделять критичные проблемы, которые надо чинить немедленно, от улучшений на перспективу.<\\/p><p>Отдельно фиксирую рамки и ограничения: что тестировалось, что нет, что помешало проверить. Это честно показывает границы уверенности и защищает от ложного вывода, будто непроверенное безопасно. NIST SP 800-115 описывает содержание такого отчёта.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://owasp.org/www-project-web-security-testing-guide/"]},{"id":235,"num":236,"category":"Пентест и offensive-основы","text":"Что такое bug bounty и чем оно отличается от пентеста?","answer":"<p>Bug bounty это программа, в которой организация приглашает независимых исследователей искать уязвимости и платит за подтверждённые находки. Отличия от пентеста существенные. Пентест ограничен по времени и охвату, выполняется по договору за фиксированную оплату и даёт полный отчёт с покрытием. Bug bounty идёт постоянно, оплата за результат, охват задают правила программы, а мотивация исследователей смещает внимание к тому, что приносит вознаграждение.<\\/p><p>Они дополняют друг друга, а не заменяют. Пентест даёт системную проверку и уверенность в покрытии к конкретной дате (например, для комплаенса), bug bounty даёт непрерывный поток находок от множества людей с разным взглядом.<\\/p><p>Ключевое в обоих случаях это авторизация. Программа bug bounty публикует правила и рамки, и работать можно строго внутри них. Именно эти рамки отделяют законное исследование от несанкционированного доступа.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://owasp.org/www-project-web-security-testing-guide/"]},{"id":236,"num":237,"category":"Пентест и offensive-основы","text":"Что такое ответственное раскрытие уязвимостей (responsible disclosure)?","answer":"<p>Ответственное (координированное) раскрытие это порядок, при котором нашедший уязвимость сначала сообщает о ней владельцу системы и даёт разумное время на исправление, и только потом, по согласованию, раскрывает детали публично. Цель в том, чтобы пользователи получили исправление раньше, чем деталями воспользуются злоумышленники.<\\/p><p>Для этого организации публикуют политику раскрытия и контакт для приёма сообщений, часто в стандартном файле security.txt на сайте. Это снижает риск, что исследователь не найдёт, кому сообщить, и раскроет проблему публично из-за молчания.<\\/p><p>Противоположность это full disclosure, немедленная публикация без предупреждения, которая подвергает пользователей риску. На собеседовании правильный акцент такой: нашёл проблему, сообщи по официальному каналу и действуй в рамках закона и политики организации, а не публикуй и не эксплуатируй.<\\/p>","sources":["https://www.rfc-editor.org/rfc/rfc9116","https://cheatsheetseries.owasp.org/cheatsheets/Vulnerability_Disclosure_Cheat_Sheet.html"]},{"id":237,"num":238,"category":"Пентест и offensive-основы","text":"Как пентестер остаётся в правовом поле?","answer":"<p>Граница между пентестом и правонарушением это авторизация. Легально тестировать можно только собственные системы либо чужие при наличии явного письменного разрешения владельца с чётко очерченными рамками. Устного согласия недостаточно, а найденная в интернете система без разрешения не является законной целью, даже если она уязвима.<\\/p><p>Практические правила такие. Всегда иметь подписанный документ о рамках и правилах до начала работ. Не выходить за согласованные границы, включая инфраструктуру третьих сторон и облачных провайдеров, у которых есть свои правила тестирования. При обнаружении реальной утечки или чужого взлома останавливаться и сообщать. Найденные данные обрабатывать по договорённости и не разглашать.<\\/p><p>Для обучения использовать собственную лабораторию или разрешённые полигоны. Это и есть корректный ответ на собеседовании: сначала разрешение и рамки, потом инструменты. Именно ответственность и понимание правовых границ отличают специалиста от нарушителя.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":238,"num":239,"category":"Пентест и offensive-основы","text":"Как превратить scope в план пентеста и не потерять покрытие?","answer":"<p>Я начинаю не с инструментов, а с инвентаризации объектов и функций в согласованном scope. Для веб-приложения это домены, роли, страницы, API, точки входа, интеграции и важные бизнес-процессы. Затем сопоставляю им категории OWASP WSTG и риск-сценарии заказчика. Так получается матрица покрытия, где видно, что проверено, каким способом и с каким результатом.<\\/p><p>Приоритет задаю по сочетанию ценности актива, доступности извне, уровня привилегий и возможного ущерба. Критичные операции, например смена реквизитов или назначение роли администратора, получают больше внимания, чем статические страницы. Автоматический сканер использую как один источник сигналов, но авторизацию, бизнес-логику и цепочки действий проверяю вручную.<\\/p><p>Во время работы фиксирую ограничения и фактическое покрытие. Если часть функции недоступна из-за отсутствия тестовой роли или интеграции, это не зелёный результат, а явно указанное ограничение. Такой подход делает выводы воспроизводимыми и не создаёт ложного ощущения полной проверки.<\\/p>","sources":["https://wstg.owasp.org/latest/3-The_OWASP_Testing_Framework/0-The_Web_Security_Testing_Framework/","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":239,"num":240,"category":"Пентест и offensive-основы","text":"Как отличить реальную уязвимость от ложного срабатывания сканера?","answer":"<p>Срабатывание сканера это гипотеза, а не готовая находка. Я сначала проверяю, относится ли результат к текущей версии и конфигурации системы, затем воспроизвожу условие вручную безопасным способом и ищу наблюдаемое нарушение свойства безопасности. Это может быть доступ к чужому объекту, выполнение запрещённой операции или раскрытие данных.<\\/p><p>Доказательство должно быть минимальным и повторяемым. Я сохраняю исходный и изменённый запросы, ответы, роль пользователя, время и ожидаемое поведение, но не собираю лишние реальные данные и не усиливаю воздействие без необходимости. Если эксплуатация опасна, подтверждаю предпосылки и согласую следующий шаг с контактным лицом.<\\/p><p>В отчёт попадает только подтверждённая находка либо отдельно помеченное наблюдение с ограниченной уверенностью. Версия компонента без доказанного уязвимого пути сама по себе ещё не подтверждает эксплуатацию, а отсутствие срабатывания сканера не доказывает безопасность.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/00-Introduction_and_Objectives/"]},{"id":240,"num":241,"category":"Пентест и offensive-основы","text":"Как проверять авторизацию и чем BOLA отличается от BFLA?","answer":"<p>Авторизацию проверяю матрицей субъект, объект, действие. Нужны как минимум две тестовые учётные записи одного уровня и роли с разными привилегиями. Для каждой операции сравниваю, может ли пользователь читать или менять чужой объект и может ли обычная роль вызвать административную функцию. Проверка интерфейса недостаточна, решение должно выполняться на сервере для каждого запроса.<\\/p><p>BOLA, или Broken Object Level Authorization, возникает, когда приложение принимает идентификатор объекта, но не проверяет право текущего пользователя на конкретный объект. BFLA, или Broken Function Level Authorization, означает доступ к функции не своей роли, например к административной операции. Первая проблема про чужой объект, вторая про запрещённое действие.<\\/p><p>В доказательстве показываю две пары запросов и ответов с тестовыми данными, ожидаемое правило и фактическое нарушение. Массовый перебор идентификаторов не нужен, если один безопасный пример уже подтверждает системную ошибку контроля доступа.<\\/p>\\n<pre><code># BOLA, обычный пользователь запрашивает чужой объект по id\\ncurl -H \\"Authorization: Bearer $USER_A\\" https://api.lab/orders/1002\\n# BFLA, обычный пользователь вызывает административную функцию\\ncurl -X DELETE -H \\"Authorization: Bearer $USER_A\\" https://api.lab/admin/users/5<\\/code><\\/pre>\\n<p>BOLA это доступ к чужому объекту, когда сервер не проверяет владельца по идентификатору. BFLA это доступ к функции не своего уровня, например администраторской. Проверяют, подставляя чужой id и вызывая привилегированные методы своим токеном.<\\/p>","sources":["https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa1-broken-object-level-authorization.md","https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0xa5-broken-function-level-authorization.md"]},{"id":241,"num":242,"category":"Пентест и offensive-основы","text":"Что проверять в аутентификации и управлении сессиями?","answer":"<p>В аутентификации я проверяю не только форму входа. Смотрю регистрацию, восстановление доступа, многофакторную аутентификацию, смену пароля, блокировки и отсутствие утечек о существовании учётной записи. Важно понять, нельзя ли обойти один этап через альтернативный маршрут или устаревший API.<\\/p><p>Для сессии проверяю, меняется ли идентификатор после входа и повышения привилегий, завершается ли сессия после выхода и смены пароля, действуют ли разумные сроки жизни, защищены ли cookie атрибутами Secure, HttpOnly и подходящим SameSite. Отдельно проверяю параллельные сессии и отзыв токенов в соответствии с требованиями приложения.<\\/p><p>Результат оцениваю в контексте. Несколько параллельных сессий не всегда дефект, если это разрешено моделью угроз. Дефект появляется, когда фактическое поведение противоречит требованиям или позволяет захватить и сохранить доступ.<\\/p>","sources":["https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/04-Authentication/","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/06-Session_Management/"]},{"id":242,"num":243,"category":"Пентест и offensive-основы","text":"Как подходить к тестированию API?","answer":"<p>Сначала собираю инвентарь API из документации, трафика приложения, схем OpenAPI и конфигурации шлюза. Для каждого метода фиксирую входные данные, тип аутентификации, роли, объекты, изменение состояния и внешние интеграции. Отдельно ищу старые версии, тестовые маршруты и недокументированные точки, потому что неполный инвентарь сам является риском.<\\/p><p>Дальше прохожу основные классы OWASP API Security Top 10. Проверяю доступ к объектам и функциям, свойства объектов при чтении и записи, ограничения ресурсов, чувствительные бизнес-потоки, SSRF, конфигурацию и доверие к сторонним API. Автоматизация помогает повторять запросы, но вывод о бизнес-риске требует понимания назначения метода.<\\/p><p>Работаю только с тестовыми учётными записями и согласованными лимитами. Проверку ограничения ресурсов нельзя превращать в отказ в обслуживании. Достаточно безопасно показать отсутствие ожидаемого контроля и согласовать более нагрузочную проверку отдельно.<\\/p>\\n<pre><code>curl -i -H \\"Authorization: Bearer $TOKEN\\" https://api.lab/v1/users   # коды, заголовки, лимиты<\\/code><\\/pre>\\n<p>У API проверяют аутентификацию каждого метода, авторизацию на уровне объектов и функций, ограничение частоты и утечки в ответах и заголовках. <code>curl -i<\\/code> показывает код и заголовки ответа для этих проверок.<\\/p>","sources":["https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0x11-t10.md","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/12-API_Testing/"]},{"id":243,"num":244,"category":"Пентест и offensive-основы","text":"Почему уязвимости бизнес-логики плохо находятся автоматическими сканерами?","answer":"<p>Сканер хорошо ищет повторяемые технические признаки, но обычно не знает, как бизнес-процесс должен работать. Он не понимает, что скидку разрешено применить один раз, платёж должен предшествовать выдаче товара, а согласующий не должен утверждать собственную заявку. Поэтому технически корректные запросы могут складываться в недопустимую последовательность.<\\/p><p>Я строю модель процесса, отмечаю состояния, роли, ограничения и переходы, затем проверяю пропуск, повтор, изменение порядка и параллельное выполнение шагов. Особое внимание уделяю значениям, которые приходят от клиента, и границам между системами. Сервер должен проверять не только формат, но и допустимость операции в текущем состоянии.<\\/p><p>Хорошая находка описывает нарушенное бизнес-правило и измеримый результат, а не просто необычный ответ сервера. Рекомендация обычно связана с серверной проверкой состояния, идемпотентностью, транзакционностью или централизованным контролем правила.<\\/p>","sources":["https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/10-Business_Logic/01-Business_Logic_Data_Validation/","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/10-Business_Logic/"]},{"id":244,"num":245,"category":"Пентест и offensive-основы","text":"Как проверять загрузку файлов без опасного воздействия?","answer":"<p>Сначала выясняю ожидаемые типы, размер, место хранения и дальнейшую обработку файла. Затем на разрешённом стенде проверяю, полагается ли сервер только на расширение и заголовок Content-Type, меняет ли имя файла, ограничивает ли размер, хранит ли загрузку вне исполняемого каталога и выдаёт ли её с безопасным типом содержимого.<\\/p><p>Для подтверждения использую безвредные тестовые файлы и маркеры. Цель не в запуске произвольного кода, а в доказательстве, что контроль можно обойти или файл доступен не той роли. Отдельно проверяю архивы, повторные имена, метаданные и асинхронные обработчики, если они входят в scope.<\\/p><p>Исправление требует нескольких слоёв. Нужны список разрешённых форматов, проверка фактической структуры, новое серверное имя, ограничения размера, безопасное хранение, контроль доступа и, где уместно, антивирусная или CDR-обработка. Одна проверка расширения не закрывает риск.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/10-Business_Logic/09-Upload_of_Malicious_Files/"]},{"id":245,"num":246,"category":"Пентест и offensive-основы","text":"Как оценивать SQL injection, XSS и SSRF на собеседовании?","answer":"<p>Я различаю их по границе доверия и месту воздействия. SQL injection возникает, когда непроверенные данные меняют структуру запроса к базе. XSS приводит к выполнению недоверенного содержимого в контексте браузера другого пользователя. SSRF заставляет сервер отправить запрос к адресу, выбранному или частично контролируемому пользователем.<\\/p><p>Проверку начинаю с поиска точек ввода и понимания того, куда данные попадают. Затем использую минимальные безопасные признаки изменения поведения, без извлечения лишних данных, выполнения команд или обращения к несогласованным внутренним системам. Для SSRF особенно важны правила взаимодействия с облачными метаданными и внешними сервисами, их заранее фиксируют в rules of engagement.<\\/p><p>Защита тоже различается. Для SQL нужны параметризованные запросы, для XSS контекстное кодирование и безопасные шаблоны, для SSRF строгий контроль направлений и сетевые ограничения. Общая рекомендация проверить ввод полезна, но не заменяет защиту в конкретной точке использования данных.<\\/p>","sources":["https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/07-Injection/05-SQL_Injection/","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/11-Client-side/","https://wstg.owasp.org/latest/4-Web_Application_Security_Testing/07-Injection/19-Server-Side_Request_Forgery/"]},{"id":246,"num":247,"category":"Пентест и offensive-основы","text":"Какие доказательства собирать для находки и как не утечь чувствительными данными?","answer":"<p>Для воспроизводимости сохраняю идентификатор находки, затронутый объект, тестовую роль, предварительные условия, время, минимальную последовательность действий, запрос и ответ, ожидаемое и фактическое поведение. Скриншот удобен для чтения, но текстовые запросы и ответы точнее и позволяют инженеру повторить проверку.<\\/p><p>Доказательство должно быть минимальным. Я использую тестовые записи, редактирую токены и персональные данные, не прикладываю секреты целиком и не копирую массив данных, если один объект уже подтверждает проблему. Рабочие материалы храню и передаю только согласованным способом, а сроки удаления фиксирую в правилах проведения.<\\/p><p>Если находка может вызвать повреждение, простой или доступ к данным третьих лиц, я останавливаю проверку на безопасной точке и связываюсь с указанным контактным лицом. Полнота доказательства не оправдывает выход за scope или увеличение ущерба.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://wstg.owasp.org/latest/5-Reporting/"]},{"id":247,"num":248,"category":"Пентест и offensive-основы","text":"Как назначать критичность находке и почему одного базового балла CVSS недостаточно?","answer":"<p>Базовая группа CVSS-B описывает внутренние технические характеристики уязвимости, но не весь риск для конкретной организации. Одинаковая проблема имеет разный приоритет на изолированном тестовом сервисе и на интернет-доступной системе с платёжными данными. Поэтому я не приравниваю базовый балл к бизнес-риску.<\\/p><p>В CVSS v4.0 есть также Threat-метрики для зрелости эксплуатации и Environmental-метрики, которыми можно уточнить требования к конфиденциальности, целостности и доступности, а также изменить метрики с учётом среды и компенсирующих мер. Отдельно учитываю ценность актива, масштаб возможного ущерба, роль системы в критичном процессе и цепочки с другими находками. Эти основания фиксирую явно.<\\/p><p>В отчёте указываю вектор и использованные группы метрик, затем объясняю бизнес-приоритет и срочность действия. Если данных о влиянии не хватает, задаю владельцу конкретный вопрос и не придумываю ущерб. Это полезнее, чем автоматически объявлять любую находку с высоким CVSS-B критической.<\\/p>","sources":["https://www.first.org/cvss/v4.0/specification-document","https://www.first.org/cvss/v4.0/user-guide"]},{"id":248,"num":249,"category":"Пентест и offensive-основы","text":"Что делать, если во время пентеста обнаружен активный инцидент или реальные чужие данные?","answer":"<p>Я прекращаю действия, которые могут изменить состояние или расширить доступ, сохраняю минимально необходимое доказательство и немедленно использую канал эскалации из rules of engagement. Самостоятельно расследовать инцидент за пределами задания нельзя, даже если технически это возможно.<\\/p><p>Важно отделить следы теста от возможной активности злоумышленника. Я фиксирую точное время, исходный адрес тестовой системы, выполненное действие и наблюдение. Это помогает команде реагирования не принять работу пентестера за атаку и сохранить пригодность журналов.<\\/p><p>Дальнейшие действия определяет заказчик. Он может остановить тест, изолировать систему, привлечь DFIR или письменно расширить задачу. Данные третьих лиц не копируются в отчёт без необходимости, а доступ к ним не используется для дополнительного исследования.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":249,"num":250,"category":"Пентест и offensive-основы","text":"Как проводить ретест и когда находку можно считать закрытой?","answer":"<p>Ретест проверяет не наличие коммита или обещания, а фактическое устранение уязвимости в нужной среде. Я повторяю первоначальный сценарий на той же точке входа и роли, затем проверяю соседние маршруты и варианты, потому что локальная заплатка может оставить ту же первопричину в другом методе или API.<\\/p><p>Находка закрыта, когда исходное нарушение больше не воспроизводится, нормальный бизнес-сценарий работает, а изменение не создало очевидный обход. Если риск только снижен компенсирующей мерой, статус должен отражать это честно. Принятие остаточного риска является решением владельца риска, а не пентестера.<\\/p><p>В результате ретеста фиксирую дату, версию или среду, проверенные действия и новый статус. Если часть проверки недоступна, ставлю не закрыто, а не проверено с причиной. Это сохраняет различие между исправлением и отсутствием доказательств.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://wstg.owasp.org/latest/5-Reporting/"]},{"id":250,"num":251,"category":"Сценарии и разбор ситуаций","text":"Сотрудник сообщил, что открыл вложение из письма и ввёл пароль на подозрительной странице. Ваши действия?","answer":"<p>Сначала благодарю сотрудника, потому что поведение, при котором о таком сообщают сразу, важнее любой техники. Если за сообщение наказывают, следующий раз о нём просто промолчат, и мы узнаем всё из инцидента через месяц.<\\/p><p>Дальше два параллельных направления. По учётной записи: сброс пароля, отзыв активных сессий и токенов, проверка методов многофакторной аутентификации (не добавил ли злоумышленник свой), проверка правил пересылки почты и выданных согласий приложениям, потому что это закрепление переживает смену пароля. По устройству: проверка запущенных процессов и сетевых соединений на хосте, изоляция через EDR при любых сомнениях, анализ самого вложения в изолированной среде.<\\/p><p>Затем расширяю периметр поиска. Беру адреса и хэши из письма и проверяю по всей организации, кому ещё оно пришло, кто открывал, кто заходил на ту же страницу. Блокирую отправителя и домен, добавляю индикаторы в правила. Завершаю разбором: как письмо прошло фильтры, какое правило добавить и что рассказать всем сотрудникам без обвинений в адрес конкретного человека.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://learn.microsoft.com/en-us/security/operations/incident-response-playbooks"]},{"id":251,"num":252,"category":"Сценарии и разбор ситуаций","text":"В облачном аккаунте появились дорогие инстансы и вызовы API из чужой страны. Что делаете?","answer":"<p>Это классический признак компрометации учётных данных, обычно ключа доступа, утёкшего в репозиторий или в образ. Приоритет действий такой: сначала прекратить доступ, потом разобраться.<\\/p><p>Отзываю или деактивирую подозрительные ключи и учётные записи, отзываю активные сессии ролей, при необходимости применяю ограничивающую политику на уровне организации. Только после этого останавливаю или изолирую созданные ресурсы, предварительно сняв снимки дисков, если нужна экспертиза. Важно не удалять всё сразу: удалённый инстанс это потерянные доказательства.<\\/p><p>Дальше разбираю журнал плоскости управления (в AWS это CloudTrail) и отвечаю на вопросы, какие именно учётные данные использовались, когда впервые, откуда, что ещё ими сделано. Часто вместе с майнингом создаются скрытые механизмы закрепления: новые пользователи, ключи, роли с доверием к чужому аккаунту, правила пересылки журналов. Их нужно найти и снять, иначе повторится. В конце ищу источник утечки ключа и перевожу этот сценарий на короткоживущие учётные данные вместо статических ключей.<\\/p>","sources":["https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html","https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/automate-incident-response-and-forensics.html","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":252,"num":253,"category":"Сценарии и разбор ситуаций","text":"На продакшн-сервере обнаружен майнер криптовалюты. Что это значит и что вы сделаете?","answer":"<p>Майнер это не сама проблема, а её следствие. Главный вывод: кто-то смог выполнить свой код на нашем сервере. Тот же путь входа мог использоваться и для более тихих действий, поэтому расследование нельзя сворачивать после того, как нагрузка на процессор вернулась в норму.<\\/p><p>Порядок действий. Изолирую сервер по сети, сохраняя его работающим, снимаю память и делаю снимок диска. Фиксирую, от какого пользователя работает процесс, какой у него родитель, куда идут соединения, когда появились файлы. Дальше ищу путь входа: уязвимое приложение на этом сервере, открытый наружу интерфейс администрирования, слабые учётные данные, скомпрометированный образ или зависимость.<\\/p><p>Восстановление делаю переразвёртыванием из доверенного образа, а не чисткой вручную, потому что доказать отсутствие закрепления на живой системе дороже, чем пересоздать её. Обязательно проверяю соседние узлы теми же индикаторами, потому что майнеры часто разворачивают массово. Закрываю причину и добавляю правило обнаружения на будущее.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://attack.mitre.org/techniques/T1496/"]},{"id":253,"num":254,"category":"Сценарии и разбор ситуаций","text":"В пятницу вечером вышла критическая уязвимость в популярной библиотеке. Ваши действия?","answer":"<p>Первый вопрос не «как патчить», а «есть ли это у нас и где». Поэтому отвечаю по порядку: инвентаризация, оценка достижимости, временные меры, обновление, проверка компрометации.<\\/p><p>Инвентаризация быстрее всего делается по SBOM и данным сканера зависимостей, дополнительно поиском по репозиториям и образам в реестре. Дальше оцениваю реальную достижимость: уязвим ли наш сценарий использования, доступен ли компонент снаружи, есть ли публичный рабочий эксплойт и признаки массовой эксплуатации (здесь помогает каталог CISA KEV). Внешний сервис с рабочим эксплойтом это работа на сегодня, внутренняя утилита без сетевого доступа может подождать до понедельника.<\\/p><p>Если обновиться сразу нельзя, применяю временные меры: правило на WAF, отключение уязвимой функции, ограничение исходящего трафика. Параллельно ретроспективно проверяю журналы на признаки эксплуатации до момента, когда мы узнали об уязвимости, потому что между публикацией и нашим патчем всегда есть окно. В конце фиксирую, сколько времени заняла инвентаризация, потому что именно она обычно и есть узкое место.<\\/p>","sources":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://www.cisa.gov/sbom"]},{"id":254,"num":255,"category":"Сценарии и разбор ситуаций","text":"Сканер выдал две тысячи уязвимостей. С чего начнёте?","answer":"<p>Список из двух тысяч строк не является планом работ, и попытка чинить всё подряд закончится тем, что не будет сделано ничего. Нужна приоритизация по риску, а не по формальной оценке CVSS.<\\/p><p>Сначала убираю шум: дедупликация (одна уязвимость в базовом образе даёт сотни строк по всем контейнерам), отсев неприменимого и ложных срабатываний. Затем приоритизирую по трём факторам. Достижимость: доступен ли компонент из интернета и используется ли уязвимый код вообще. Эксплуатируемость: есть ли публичный эксплойт и признаки активного использования в реальных атаках. Ценность актива: что стоит за этой системой.<\\/p><p>Практически это превращается в короткий список из десятков позиций, за который команда реально может взяться. Дальше договариваюсь о правилах игры на будущее: сроки устранения по уровням критичности, ответственные, процесс исключений с обоснованием и сроком. Отдельно смотрю, где одно действие закрывает много строк, например обновление базового образа, это лучшее вложение времени.<\\/p>","sources":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://www.first.org/cvss/","https://csrc.nist.gov/pubs/sp/800/40/r4/final"]},{"id":255,"num":256,"category":"Сценарии и разбор ситуаций","text":"Разработчики просят отключить блокирующую проверку в пайплайне, потому что горит релиз. Ваш ответ?","answer":"<p>Жёсткое «нет» здесь работает плохо: если безопасность воспринимается как препятствие, её начнут обходить, и мы перестанем видеть происходящее. Поэтому отвечаю по существу находки, а не по принципу.<\\/p><p>Сначала смотрю, что именно блокирует. Если это ложное срабатывание или проблема, недостижимая в этом сценарии, то правильное действие это не отключение проверки целиком, а исключение конкретной находки с обоснованием и пересмотр правила. Если находка настоящая и критичная, объясняю риск на языке последствий, а не терминов, и предлагаю варианты: быстрое обходное решение, выкат с ограничением доступа, откат изменения.<\\/p><p>Если бизнес всё же принимает риск, оформляю это как осознанное исключение: кто принял, на какой срок, что компенсирует, когда пересмотр. Исключение с датой и владельцем это нормальная практика, а вот молчаливое отключение проверки нет. Затем разбираю, почему проверка сработала так поздно: обычно ответ в том, что её надо было двигать левее, ближе к разработчику.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/218/final","https://owasp.org/www-project-devsecops-guideline/"]},{"id":256,"num":257,"category":"Сценарии и разбор ситуаций","text":"Обнаружено объектное хранилище с персональными данными клиентов, открытое в интернет. Что делаете?","answer":"<p>Первым делом закрываю доступ, но перед этим фиксирую состояние: кто владелец, когда права стали публичными, что именно лежит внутри. Если сразу всё закрыть и ничего не зафиксировать, мы не сможем ответить на главный вопрос дальше.<\\/p><p>А главный вопрос такой: скачивал ли кто-то эти данные. Ответ дают журналы доступа к хранилищу и журнал плоскости управления. Если журналирование доступа не было включено, честный вывод звучит так: подтвердить или опровергнуть утечку мы не можем, и действовать надо исходя из худшего сценария.<\\/p><p>Параллельно запускается юридический трек, потому что речь о персональных данных. По закону РК оператор обязан уведомить уполномоченный орган об утечке, и сроки здесь короткие, поэтому юристы и руководство подключаются сразу, а не после окончания технического разбора. Завершаю причиной: почему хранилище оказалось публичным, есть ли такие же ещё, и ставлю автоматическую проверку на публичный доступ, чтобы повторение ловилось само.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":257,"num":258,"category":"Сценарии и разбор ситуаций","text":"Подтвердилась утечка персональных данных клиентов в Казахстане. Какой у вас порядок действий?","answer":"<p>Здесь технический и юридический треки идут параллельно, и юридический нельзя откладывать до конца расследования, потому что он привязан к срокам.<\\/p><p>Технически действую по обычной схеме реагирования: сдерживание, установление объёма (какие именно данные, чьи, сколько субъектов, за какой период), устранение причины, восстановление, разбор. Ключевой результат для юристов это именно объём и состав данных, а не красивое описание техники атаки.<\\/p><p>Юридически: закон РК о персональных данных обязывает собственника или оператора уведомить уполномоченный орган о произошедшей утечке, срок короткий, поэтому цепочка эскалации к руководству и юристам должна сработать сразу. Решение об уведомлении самих субъектов, содержание сообщений и общение с регулятором ведут юристы и руководство, я обеспечиваю им факты. Ответственность за нарушения в этой сфере предусмотрена административным законодательством, и это ещё одна причина не импровизировать в одиночку.<\\/p><p>Отдельно фиксирую всё в журнале инцидента с временными метками: кто что узнал и когда, какие решения приняты. Это понадобится и регулятору, и внутреннему разбору.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://adilet.zan.kz/rus/docs/K1400000235","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":258,"num":259,"category":"Сценарии и разбор ситуаций","text":"Бизнес просит открыть доступ к серверу по RDP прямо из интернета для подрядчика. Как отвечаете?","answer":"<p>Начинаю не с отказа, а с вопроса, какую задачу нужно решить. Подрядчику обычно нужен не RDP наружу, а доступ к конкретной системе в конкретные часы. Дальше предлагаю варианты, которые решают ту же задачу с меньшим риском: доступ через VPN с многофакторной аутентификацией, брокер доступа или бастион с записью сессий, временные учётные данные на срок работ.<\\/p><p>Риск объясняю конкретно, а не общими словами: открытый наружу RDP это один из самых частых начальных векторов атак с шифрованием данных, его находят автоматическим сканированием в течение часов, и защищает его только пароль. Это разговор про вероятность и последствия, понятный бизнесу.<\\/p><p>Если по каким-то причинам иначе никак и решение принимает бизнес, оформляю временное исключение с компенсирующими мерами: ограничение по адресам подрядчика, многофакторная аутентификация, отдельная учётная запись с минимальными правами, усиленный мониторинг входов, срок действия и дата пересмотра. Осознанное исключение с компенсацией и сроком это рабочая практика, бессрочная дыра нет.<\\/p>","sources":["https://attack.mitre.org/techniques/T1133/","https://csrc.nist.gov/pubs/sp/800/46/r2/final"]},{"id":259,"num":260,"category":"Сценарии и разбор ситуаций","text":"Есть подозрение, что сотрудник выгружает данные компании. Как будете действовать?","answer":"<p>Это тот случай, где технику нельзя отделять от процедуры. Первое действие не техническое: подключаю юристов, кадровую службу и руководство, потому что речь о трудовых отношениях, персональных данных самого сотрудника и возможных правовых последствиях. Самодеятельность здесь может сделать собранные доказательства бесполезными и создать риск для компании.<\\/p><p>Технически собираю факты аккуратно и без предупреждения фигуранта: доступ к системам, объёмы и время выгрузок, работа со съёмными носителями, отправка во внешние почтовые ящики и облачные хранилища, печать документов. Сохраняю доказательства по правилам форензики, с хэшами и журналом действий, потому что материалы могут понадобиться в разбирательстве.<\\/p><p>Важно держать презумпцию добросовестности: часто за аномалией стоит обычная рабочая задача или неудобный процесс, из-за которого человек носит данные привычным ему способом. Вывод делаю только на совокупности фактов. И отдельно смотрю системную причину: почему у человека вообще был доступ к такому объёму данных и почему выгрузка не была видна раньше.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://attack.mitre.org/tactics/TA0010/"]},{"id":260,"num":261,"category":"Сценарии и разбор ситуаций","text":"Вас взяли первым специалистом по безопасности в компанию, где её не было. Что сделаете в первые три месяца?","answer":"<p>Первый месяц слушаю и считаю. Что у нас есть (активы, системы, данные, подрядчики), что для бизнеса критично, где уже больно, кто за что отвечает. Без инвентаризации любая программа безопасности это угадывание. Параллельно знакомлюсь с командами и выясняю, какие процессы уже есть, чтобы встраиваться в них, а не строить параллельные.<\\/p><p>Второй месяц закрываю базовую гигиену, которая даёт наибольший эффект при минимальном бюджете: многофакторная аутентификация везде, где возможно, инвентаризация и закрытие лишнего периметра, управление обновлениями, резервные копии с проверкой восстановления, минимальные права администраторов, централизованный сбор журналов. Это скучно и именно это предотвращает большинство инцидентов.<\\/p><p>Третий месяц строю процессы: порядок реагирования на инциденты с контактами и ролями, управление уязвимостями со сроками, базовые политики, обучение сотрудников. И сразу договариваюсь о метриках, чтобы через полгода можно было показать руководству не ощущения, а динамику. Хорошая отправная точка для приоритизации это CIS Controls, там меры уже упорядочены по группам внедрения.<\\/p>","sources":["https://www.cisecurity.org/controls","https://www.nist.gov/cyberframework"]},{"id":261,"num":262,"category":"Сценарии и разбор ситуаций","text":"Подрядчик требует доступ к продакшну со своего личного ноутбука. Что вы предложите?","answer":"<p>Проблема здесь не в человеке, а в том, что мы не управляем устройством и не знаем его состояние. Поэтому предлагаю решения, которые снимают необходимость доверять чужому ноутбуку.<\\/p><p>Рабочие варианты по возрастанию удобства для нас: доступ через виртуальное рабочее место или бастион, где сама сессия идёт на нашей инфраструктуре и записывается, а с ноутбука передаётся только изображение; выдача корпоративного устройства на время работ; доступ только к конкретному приложению через брокер, без сетевого доступа к продакшну целиком.<\\/p><p>В любом варианте фиксирую обязательное: именная учётная запись (не общая), минимальные права под задачу, многофакторная аутентификация, срок действия доступа с автоматическим истечением, журналирование и соглашение о конфиденциальности. Общая учётная запись на подрядчика это то, от чего отказываюсь всегда: без именного доступа мы не сможем разобрать ни один инцидент.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/46/r2/final","https://csrc.nist.gov/pubs/sp/800/161/r1/final"]},{"id":262,"num":263,"category":"Сценарии и разбор ситуаций","text":"Внешний исследователь написал, что нашёл уязвимость на вашем сайте. Что вы сделаете?","answer":"<p>Самая частая ошибка это игнорировать письмо или отвечать угрозами. Обе реакции приводят к тому, что детали становятся публичными без исправления. Поэтому отвечаю быстро и по-человечески: благодарю, подтверждаю получение, прошу детали и шаги воспроизведения, называю ориентировочный срок ответа.<\\/p><p>Дальше воспроизвожу и оцениваю: реальна ли проблема, каков её эффект, нет ли признаков, что ею уже пользовались. Параллельно проверяю журналы на предмет эксплуатации. Исправляю по обычному процессу, но со сроком, соответствующим риску, и сообщаю исследователю о результате. Договариваюсь о координированном раскрытии, когда можно публиковать детали.<\\/p><p>Системный вывод из такой ситуации: если у компании нет опубликованной политики раскрытия уязвимостей и контакта для сообщений (например, файла security.txt), её стоит завести. Это дешёвая мера, которая превращает случайные письма в управляемый процесс и снижает риск публикации без предупреждения.<\\/p>","sources":["https://www.rfc-editor.org/rfc/rfc9116","https://cheatsheetseries.owasp.org/cheatsheets/Vulnerability_Disclosure_Cheat_Sheet.html"]},{"id":263,"num":264,"category":"Сценарии и разбор ситуаций","text":"После инцидента выяснилось, что резервные копии не восстанавливаются. Какие выводы и действия?","answer":"<p>Ситуация типичная: копии делались, отчёты были зелёными, но восстановление никто не проверял. Вывод простой и его стоит произносить вслух, резервная копия не существует, пока из неё не восстановились.<\\/p><p>Немедленные действия: найти любые пригодные данные (более старые копии, реплики, выгрузки), оценить реальную потерю данных и сообщить бизнесу честные цифры, потому что от них зависят решения по коммуникации с клиентами. Дальше восстанавливать по приоритету систем, а не по удобству.<\\/p><p>Системные действия после: регулярная проверка восстановления по расписанию с фиксацией времени, сверка фактического времени восстановления с заявленными RTO и RPO, хранение копий так, чтобы их не мог удалить тот, кто скомпрометировал рабочую среду (отдельные учётные данные, неизменяемое хранилище, офлайн-копия). Это прямая защита от сценариев с шифрованием данных, где первым делом уничтожают именно резервные копии.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final","https://www.cisa.gov/stopransomware"]},{"id":264,"num":265,"category":"Сценарии и разбор ситуаций","text":"Вы один на смене ночью, и одновременно пришло несколько алертов. Как расставите приоритеты?","answer":"<p>Приоритизирую по двум осям: насколько близко событие к реальному ущербу и насколько ценен затронутый актив. Признаки активного продвижения атаки (выполнение кода на сервере, массовая аутентификация служебной учётной записью, признаки шифрования или массового удаления, подозрительная активность на контроллере домена) идут вперёд разведки и единичных подозрительных срабатываний.<\\/p><p>Дальше действую по принципу: сначала быстрое сдерживание того, что может причинить необратимый вред, потом разбор остального. Сетевая изоляция хоста и отзыв сессий учётной записи это обратимые действия, которые дёшево применить и дорого не применить вовремя.<\\/p><p>Обязательная часть ответа: не геройствовать в одиночку. Если картина складывается в серьёзный инцидент, я эскалирую по заранее описанной процедуре, даже если на часах три ночи. Для этого процедура и существует, а контакты и критерии эскалации должны быть под рукой заранее. Все свои действия и время фиксирую по ходу, потом восстановить это по памяти не получится.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://attack.mitre.org/"]},{"id":265,"num":266,"category":"Soft skills и вопросы о себе","text":"Расскажите о себе и почему вы переходите из DevOps в безопасность.","answer":"<p>Здесь важна не биография, а линия, которая приводит к этой вакансии. Я строю ответ так: кто я сейчас, что уже делал близкого к безопасности, почему это следующий логичный шаг, и что я принесу команде в первый же месяц. Занимает это полторы минуты, дальше пусть спрашивают.<\\/p><p>Мой переход я объясняю не разочарованием в DevOps, а тем, что безопасность это продолжение той же работы. В DevOps я отвечал за то, чтобы система была устойчивой и предсказуемой: инфраструктура как код, пайплайны, мониторинг, разграничение доступов, разбор инцидентов. В DevSecOps те же инструменты применяются к другому классу отказов, вызванных не ошибкой, а чьим-то умыслом.<\\/p><p>Сильная сторона такого перехода в том, что я понимаю, как устроена доставка ПО изнутри, и умею говорить с разработчиками на их языке. Это как раз то, чего часто не хватает специалистам по безопасности, пришедшим из аудита. Главное не оправдываться за отсутствие формального опыта в ИБ, а показать, какие задачи безопасности я уже фактически решал, просто они назывались иначе.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/181/r1/final","https://niccs.cisa.gov/workforce-development/nice-framework"]},{"id":266,"num":267,"category":"Soft skills и вопросы о себе","text":"Как объяснить необходимость мер безопасности руководству, которое не хочет тратить деньги?","answer":"<p>Разговор через страх и технические термины не работает. Работает разговор на языке бизнес-риска: что конкретно может произойти, насколько это вероятно, во что обойдётся, сколько стоит снизить и какой остаточный риск остаётся.<\\/p><p>Практически я делаю так. Привязываю риск к конкретному процессу компании, а не к абстрактной угрозе: не «у нас нет многофакторной аутентификации», а «учётная запись бухгалтера с доступом к платежам защищена только паролем, и вот сценарий, как это заканчивается». Даю два-три варианта решения с разной стоимостью, а не один. Показываю, что уже сделано бесплатно, чтобы было видно, что бюджет просят не вместо работы.<\\/p><p>И главное, решение о принятии риска остаётся за бизнесом. Моя задача дать полную картину и зафиксировать решение письменно, включая осознанное принятие риска. Это снимает конфликт «безопасность против бизнеса»: я не запрещаю, а показываю цену вариантов. Такой подход соответствует и логике риск-менеджмента в NIST CSF, где решения принимает руководство, а не инженер.<\\/p>","sources":["https://www.nist.gov/cyberframework","https://csrc.nist.gov/pubs/sp/800/30/r1/final"]},{"id":267,"num":268,"category":"Soft skills и вопросы о себе","text":"Разработчик не согласен с вашим замечанием по безопасности. Как поступите?","answer":"<p>Сначала выясняю, в чём именно несогласие, потому что причины разные. Он может считать находку ложной, может знать контекст, которого не знаю я, а может просто не хотеть переделывать работу. Первые две причины это полезная информация, и довольно часто прав оказывается он.<\\/p><p>Если спор о факте, перевожу его в проверку: показываю воспроизведение или конкретный сценарий эксплуатации. Демонстрация снимает спор быстрее любых аргументов. Если я ошибся, говорю об этом прямо, это не потеря авторитета, а его укрепление.<\\/p><p>Если находка настоящая, а несогласие про приоритет и сроки, обсуждаю не «правильно или нет», а цену: что произойдёт, если оставить, и какие есть варианты подешевле. Решение по срокам принимает владелец продукта, я обеспечиваю ясность риска. Тон принципиально важен: моя цель безопасный продукт, а не выигранный спор. Специалист, которого обходят стороной, перестаёт узнавать о проблемах вовремя.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/218/final","https://owasp.org/www-project-samm/"]},{"id":268,"num":269,"category":"Soft skills и вопросы о себе","text":"Расскажите о самой сложной технической задаче, которую вы решали.","answer":"<p>Отвечаю по простой структуре: ситуация, задача, мои действия, результат. Без неё такие рассказы расплываются, и интервьюер не понимает, что именно сделал я, а что команда. Полезно говорить о работе в тех же терминах, в которых её описывает NICE Framework (NIST SP 800-181r1), то есть через задачи, знания и навыки, потому что именно по ним работодатель сопоставляет кандидата с ролью.<\\/p><p>Выбираю историю, где были реальные ограничения и неочевидное решение, а не просто много работы. Обязательно называю свою роль честно: если я был одним из трёх участников, так и говорю, приписывание чужого результата вскрывается уточняющими вопросами мгновенно.<\\/p><p>В результат стараюсь включать измеримое: сократили время развёртывания, убрали класс повторяющихся инцидентов, закрыли доступ, который был открыт годами. И добавляю рефлексию: что бы сделал иначе сейчас. Это показывает способность учиться, которая ценится выше идеального исполнения. Для профиля DevSecOps хорошо заходят истории про внедрение проверок в пайплайн, наведение порядка в доступах или разбор инцидента, потому что они показывают и технику, и работу с людьми.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/181/r1/final","https://niccs.cisa.gov/workforce-development/nice-framework"]},{"id":269,"num":270,"category":"Soft skills и вопросы о себе","text":"Расскажите о своей серьёзной ошибке и что вы из неё вынесли.","answer":"<p>Это вопрос про зрелость, а не про ошибку. Ответ «у меня не было серьёзных ошибок» читается как отсутствие опыта или отсутствие рефлексии. Отказ отвечать тоже плохой знак.<\\/p><p>Беру настоящий случай со своей ответственностью, описываю без перекладывания вины, говорю, как обнаружил, что сделал сразу, как сообщил, и что изменил в процессе, чтобы это не повторилось. Хорошая ошибка для рассказа это та, из которой родилось системное улучшение: проверка в пайплайне, чек-лист, автоматическая проверка конфигурации.<\\/p><p>Чего избегаю, так это фальшивых ошибок вроде «слишком перфекционист» и историй, где вина размазана на других. И не выбираю случай, который показывает пренебрежение правилами, например обход процедуры доступа. В безопасности особенно важно показать, что о своих ошибках я сообщаю сам и быстро, потому что культура, в которой об инцидентах молчат, опаснее самих инцидентов.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://www.nist.gov/cyberframework"]},{"id":270,"num":271,"category":"Soft skills и вопросы о себе","text":"Как вы следите за изменениями в безопасности?","answer":"<p>Отвечаю конкретно, потому что общие слова «читаю статьи» ничего не говорят. Называю источники и объясняю, зачем каждый. Первоисточники по уязвимостям и активной эксплуатации: бюллетени вендоров, каталог CISA KEV, рассылки о критических уязвимостях в используемых нами продуктах. Методологическая база: OWASP, NIST, MITRE ATT&CK, они меняются медленнее, но задают рамку.<\\/p><p>Практика отдельно от чтения: учебные полигоны, собственная лаборатория, разбор публичных отчётов о расследованиях. Чтение без практики даёт узнавание терминов, а не навык.<\\/p><p>И добавляю, как это превращается в работу: из новости про активно эксплуатируемую уязвимость должна рождаться проверка «есть ли это у нас», из описания техники в ATT&CK правило обнаружения или проверка, что оно уже есть. Такой ответ показывает, что я слежу за изменениями не из любопытства, а чтобы вовремя реагировать.<\\/p>","sources":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://attack.mitre.org/","https://owasp.org/"]},{"id":271,"num":272,"category":"Soft skills и вопросы о себе","text":"Что делать, если вы чего-то не знаете на собеседовании?","answer":"<p>Прямо сказать, что не знаю, и показать, как бы это выяснил. В безопасности догадки опаснее незнания: специалист, который уверенно придумывает ответ, в работе точно так же уверенно придумает вывод по инциденту.<\\/p><p>Это не поза скромности, а рабочая норма. В оценке рисков NIST SP 800-30r1 отдельным шагом требует зафиксировать допущения и ограничения, то есть прямо назвать, чего мы не знаем, потому что иначе решение принимается на непроверенных основаниях. На собеседовании ценят то же самое поведение. Рабочая формула такая: честно обозначить границу знаний, назвать смежное, что знаю, и описать способ разобраться. Например, «с этим продуктом я не работал, но задача относится к управлению доступом, принцип я понимаю так, а детали проверил бы в документации вендора и на тестовом стенде».<\\/p><p>Полезно и уточняющее встречное вопрошание: часто вопрос звучит абстрактно, а за ним стоит конкретный случай из практики компании. Уточнение показывает, что я не бросаюсь отвечать, не поняв задачу. Это ровно то поведение, которое нужно в реальной работе с инцидентами.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/30/r1/final","https://csrc.nist.gov/pubs/sp/800/181/r1/final"]},{"id":272,"num":273,"category":"Soft skills и вопросы о себе","text":"Как ваш опыт работы с банками и требованиями регуляторов помогает в безопасности?","answer":"<p>Этот опыт даёт то, чего обычно не хватает инженерам: понимание, что безопасность существует не только как техническая задача, но и как обязательство перед регулятором и клиентом. Я видел, как выглядят требования со стороны заказчика из финансового сектора, что такое согласование изменений, аудиторский след и доказательство выполнения меры.<\\/p><p>Практическая польза в трёх вещах. Первое, я умею оформлять доказательства: не «мы настроили», а «вот конфигурация, вот журнал, вот процедура». Второе, понимаю разницу между реальной защищённостью и формальным соответствием и не путаю их. Третье, умею работать в контуре с ограничениями, где нельзя просто взять облачный сервис, и решение надо строить внутри закрытого периметра.<\\/p><p>Для Казахстана добавляется знание местной рамки: закон о персональных данных с требованиями к хранению и уведомлению об утечках, закон о кибербезопасности и обязанности владельцев критически важных объектов. Компании, работающей с данными казахстанских клиентов, это нужно так же, как ISO 27001.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":273,"num":274,"category":"Soft skills и вопросы о себе","text":"Кем вы видите себя через три года и куда хотите расти?","answer":"<p>Отвечаю конкретно и правдиво, потому что размытое «расти профессионально» звучит как отсутствие плана, а слишком амбициозное «руководителем отдела через год» настораживает.<\\/p><p>Хороший ответ связывает мой рост с пользой для работодателя. Например: закрепиться как инженер по безопасности с сильной стороной в защите процессов разработки и облачной инфраструктуры, довести до уровня, когда безопасность в пайплайне работает без ручного участия, и постепенно брать на себя больше ответственности за архитектурные решения.<\\/p><p>Полезно назвать и направление развития вширь: практическая сертификация, углубление в облачную безопасность или в реагирование. Это показывает, что план есть и он реалистичный. Чего избегаю, так это ответа, из которого следует, что эта работа для меня временная ступенька: работодатель считает стоимость найма и хочет понимать, что вкладывается не на полгода.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/181/r1/final","https://niccs.cisa.gov/workforce-development/nice-framework"]},{"id":274,"num":275,"category":"Soft skills и вопросы о себе","text":"Какие вопросы вы зададите работодателю в конце собеседования?","answer":"<p>Отсутствие вопросов читается как отсутствие интереса, поэтому готовлю их заранее. Спрашиваю о том, что действительно определит мою работу, а не о том, что есть на сайте компании.<\\/p><p>Про роль: какие задачи в первые три месяца, как выглядит типичная неделя, почему позиция открыта. Про зрелость процессов: есть ли процесс реагирования на инциденты и проверялся ли он, как устроено управление уязвимостями и сроки устранения, есть ли инвентаризация активов, какие проверки уже встроены в пайплайн. Ответы на эти вопросы сразу показывают, придётся ли мне строить с нуля или развивать существующее.<\\/p><p>Про людей и полномочия: кому подчиняется безопасность, как принимаются решения при конфликте со сроками релиза, есть ли поддержка руководства. Это важнее технологического стека: специалист без полномочий и без поддержки не сможет ничего изменить, какой бы хорошей ни была техника. И один вопрос про развитие: есть ли бюджет на обучение и сертификации.<\\/p>","sources":["https://niccs.cisa.gov/workforce-development/nice-framework","https://www.nist.gov/cyberframework"]},{"id":275,"num":276,"category":"Безопасность ИИ и LLM","text":"Что такое OWASP Top 10 для приложений с большими языковыми моделями?","answer":"<p>Это отдельный список самых значимых рисков для приложений, построенных на больших языковых моделях (LLM), который ведёт проект OWASP GenAI Security. Он нужен потому, что классический OWASP Top 10 покрывает веб-приложения и не описывает риски, возникающие из-за самой природы модели.<\\/p><p>Действующая редакция 2026 года опубликована 4 августа 2026 и изменила порядок пунктов по сравнению с редакцией 2025 года. LLM01 инъекция в промпт. LLM02 раскрытие чувствительной информации. LLM03 избыточная агентность. LLM04 цепочка поставок. LLM05 отравление данных и модели. LLM06 неограниченное потребление. LLM07 дезинформация. LLM08 раскрытие скрытого контекста (Hidden Context Exposure). LLM09 слабости векторов и эмбеддингов. LLM10 ненадлежащая обработка вывода.<\\/p><p>Обратите внимание на две вещи. Порядок поменялся почти целиком, поэтому ответ с нумерацией прошлой редакции сразу выдаёт неактуальные знания. И пункт про утечку системного промпта из редакции 2025 года стал шире, теперь это раскрытие скрытого контекста вообще. Практическая польза списка в том, что он даёт общий язык с разработчиками и служит чек-листом при ревью архитектуры ИИ-функции. Называть номера наизусть не нужно, важно объяснять суть.<\\/p>","sources":["https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10"]},{"id":276,"num":277,"category":"Безопасность ИИ и LLM","text":"Что такое инъекция в промпт и чем прямая отличается от косвенной?","answer":"<p>Инъекция в промпт (LLM01:2026) это ситуация, когда входные данные меняют поведение модели так, как не задумывал разработчик. Причина фундаментальная: для модели инструкции разработчика и текст, пришедший извне, это один и тот же поток слов, у неё нет технической границы между кодом и данными, как в обычных программах.<\\/p><p>Прямая инъекция это когда сам пользователь пишет в чат текст, заставляющий модель игнорировать заданные правила. Косвенная опаснее: вредоносная инструкция лежит в данных, которые модель прочитает по ходу работы, например на веб-странице, в письме, в документе или в результате поиска. Пользователь при этом ничего плохого не делал, он просто попросил обобщить страницу.<\\/p><p>Опасность возрастает вместе с правами модели. Если ассистент умеет только отвечать текстом, худший исход это неверный ответ. Если он умеет отправлять письма, ходить в базу или вызывать инструменты, то чужая инструкция превращается в действие от имени пользователя. Поэтому инъекцию в промпт всегда рассматривают в связке с агентностью модели.<\\/p>","sources":["https://atlas.mitre.org/","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM01_PromptInjection.md"]},{"id":277,"num":278,"category":"Безопасность ИИ и LLM","text":"Как снизить риск инъекции в промпт?","answer":"<p>Начну с честного тезиса, который ценится на собеседовании: полностью надёжного решения на уровне самой модели сегодня нет. Фильтры и системные инструкции повышают стоимость атаки, но не дают гарантии, поэтому архитектура должна оставаться безопасной даже при успешной инъекции.<\\/p><p>Отсюда и меры. Ограничивать права: модель и её инструменты получают минимально необходимый доступ, отдельные учётные данные, никакого доступа к чужим данным. Разделять доверие: текст, пришедший из внешних источников, явно помечается как недоверенные данные и не должен трактоваться как инструкция. Ставить подтверждение человеком на действия с последствиями (отправка, платёж, удаление, изменение прав).<\\/p><p>Дальше обычные практики: проверка и экранирование вывода перед использованием, ограничение доступных инструментов и доменов для исходящих запросов, журналирование запросов и действий модели, тестирование на устойчивость (red teaming) до выката. И архитектурный принцип, который снимает большинство сценариев: не давать модели права, которые нельзя доверить недоверенному пользователю.<\\/p>","sources":["https://www.nist.gov/itl/ai-risk-management-framework","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM01_PromptInjection.md"]},{"id":278,"num":279,"category":"Безопасность ИИ и LLM","text":"Что такое избыточная агентность модели и почему это опасно?","answer":"<p>Избыточная агентность (LLM03:2026) это когда приложению на базе модели дали слишком много самостоятельности: лишние инструменты, лишние права или возможность выполнять действия без подтверждения. Риск в том, что вывод модели недетерминирован, и ошибочное или спровоцированное решение сразу превращается в реальное действие.<\\/p><p>Избыточность бывает трёх видов. Лишняя функциональность: инструменту дали метод удаления, хотя нужен только чтение. Лишние права: агент ходит в базу под учётной записью администратора. Лишняя автономия: действие выполняется без подтверждения человеком.<\\/p><p>Лечится архитектурно. Инструментам оставляют только нужные операции, доступ выдают от имени конечного пользователя с его правами, а не общей привилегированной учётной записью, необратимые действия закрывают подтверждением. Полезно добавить ограничения по объёму (сколько писем можно отправить, на какую сумму провести операцию) и полную запись того, что агент сделал, чтобы инцидент можно было разобрать.<\\/p>","sources":["https://www.nist.gov/itl/ai-risk-management-framework","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM03_ExcessiveAgency.md"]},{"id":279,"num":280,"category":"Безопасность ИИ и LLM","text":"Чем опасна ненадлежащая обработка вывода модели?","answer":"<p>Ненадлежащая обработка вывода (LLM10:2026, Improper Output Handling) это когда ответ модели передают дальше в систему без проверки. Здесь работает простое правило: вывод модели это недоверенные данные, ровно как ввод пользователя, потому что на него влияет и пользователь, и содержимое прочитанных моделью источников.<\\/p><p>Типичные последствия знакомы по классическому AppSec. Ответ подставили в HTML без экранирования, получили межсайтовый скриптинг. Сгенерированный запрос отправили в базу без параметризации, получили инъекцию. Сгенерированную команду передали в оболочку, получили выполнение команд. Ответ отдали другому сервису как готовую инструкцию, получили подделку запроса на стороне сервера.<\\/p><p>Защита та же, что и всегда: контекстное экранирование при выводе, параметризованные запросы, отказ от передачи строк в оболочку, проверка структуры ответа по схеме, если ожидается JSON. Ценность этого пункта в том, что он возвращает команду к обычной гигиене разработки, просто источником недоверенных данных теперь стала своя же модель.<\\/p>","sources":["https://owasp.org/www-project-top-ten/","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM10_ImproperOutputHandling.md"]},{"id":280,"num":281,"category":"Безопасность ИИ и LLM","text":"Как через LLM утекают чувствительные данные и как это предотвратить?","answer":"<p>Раскрытие чувствительной информации (LLM02:2026) происходит по нескольким путям. Данные попали в обучающую выборку или в дообучение и затем воспроизводятся в ответах другим пользователям. Данные подтянулись в контекст из общего хранилища, к которому у конкретного пользователя не должно быть доступа. Сотрудники сами отправили коммерческую тайну во внешний сервис. Наконец, ответ модели может раскрыть внутренние детали системы.<\\/p><p>Меры делятся на организационные и технические. Организационно нужна ясная политика, какие данные вообще можно отправлять в какой сервис, и обучение сотрудников, потому что основной канал утечки это добровольная вставка текста в чат. Технически: очистка и обезличивание данных до обучения, проверка исходящих данных, договорные условия с поставщиком о неиспользовании данных для обучения.<\\/p><p>Отдельно важна авторизация в сценарии поиска по корпоративным документам. Права пользователя должны применяться на этапе выборки документов, а не постфактум к ответу. Если в контекст попал документ, который пользователю не положен, утечка уже произошла, никакая фильтрация ответа это не исправит.<\\/p>","sources":["https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM02_SensitiveInformationDisclosure.md"]},{"id":281,"num":282,"category":"Безопасность ИИ и LLM","text":"Что такое отравление данных и модели?","answer":"<p>Отравление данных и модели (LLM05:2026) это преднамеренное искажение данных на этапе предобучения, дообучения или подготовки эмбеддингов, чтобы изменить поведение модели. Результатом может быть систематическая предвзятость, ухудшение качества или скрытый триггер, при котором на определённую фразу модель ведёт себя заданным злоумышленником образом.<\\/p><p>Реалистичные векторы связаны с источниками данных. Открытые наборы данных и веб-выгрузки могут быть заранее подпорчены, обратная связь от пользователей может накручиваться, а при дообучении на корпоративных данных вредное содержимое может попасть из внутренних систем.<\\/p><p>Меры близки к защите цепочки поставок: контроль происхождения данных, проверка целостности наборов, версионирование, ограничение автоматического дообучения на пользовательском вводе, оценка модели на контрольных выборках до выката и после. Полезно вести аналог SBOM для модели, то есть описание, на чём она обучалась и какие компоненты в ней используются.<\\/p>","sources":["https://atlas.mitre.org/","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM05_DataModelPoisoning.md"]},{"id":282,"num":283,"category":"Безопасность ИИ и LLM","text":"Какие риски несёт цепочка поставок в машинном обучении?","answer":"<p>Цепочка поставок (LLM04:2026) в ИИ шире обычной: помимо библиотек и образов в неё входят предобученные модели и их веса, наборы данных, адаптеры дообучения, расширения и плагины, а также внешние поставщики моделей через API.<\\/p><p>Конкретные риски. Загруженная из открытого хаба модель может быть подменена или содержать вредоносный код в формате сериализации, если формат допускает исполнение при загрузке. Зависимость может быть подменена типосквоттингом. Внешний поставщик модели это ещё и риск доступности и конфиденциальности: его сбой останавливает нашу функцию, а его условия определяют судьбу наших данных.<\\/p><p>Меры те же, что в обычном DevSecOps, перенесённые на модели: брать артефакты только из доверенных источников, проверять подписи и контрольные суммы, фиксировать версии, использовать безопасные форматы хранения весов, сканировать зависимости, вести перечень используемых моделей с указанием происхождения и лицензии, оценивать поставщика как любую третью сторону.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/161/r1/final","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM04_SupplyChain.md"]},{"id":283,"num":284,"category":"Безопасность ИИ и LLM","text":"Что такое раскрытие скрытого контекста и почему на системный промпт нельзя полагаться как на защиту?","answer":"<p>В редакции 2026 года этот пункт называется LLM08 Hidden Context Exposure, раскрытие скрытого контекста, и он шире прежней «утечки системного промпта». Скрытый контекст это всё, что приложение само кладёт в окно модели и не показывает пользователю: системный промпт, инструкции разработчика, подтянутые тексты политик и правил, описания и схемы доступных модели инструментов.<\\/p><p>Риск в том, что этот контекст можно извлечь, вывести по ответам или реконструировать. Опасным он становится не сам по себе, а когда внутри лежат секреты, логика принятия решений, условия отказа, описания прав и ролей. Зная правила фильтрации, их проще обойти, а зная схемы инструментов, проще нащупать избыточную агентность.<\\/p><p>Практический вывод официальная редакция формулирует прямо: исходить надо из того, что скрытый контекст обнаружим, и не считать его содержимое секретом. Значит, учётные данные, строки подключения и токены в него не кладут, и на его скрытность не опираются как на границу доверия при разграничении доступа, проверке прав или фильтрации содержимого. Если правило важно, оно реализуется в коде приложения, а не словами в инструкции модели.<\\/p>","sources":["https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM08_HiddenContextExposure.md","https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/"]},{"id":284,"num":285,"category":"Безопасность ИИ и LLM","text":"Какие риски возникают у векторных баз и сценария поиска по документам (RAG)?","answer":"<p>Сценарий с дополненной выборкой (RAG) подтягивает фрагменты документов в контекст модели, а хранятся они в виде векторов. Слабости векторов и эмбеддингов (LLM09:2026) связаны именно с этим слоем.<\\/p><p>Основные проблемы такие. Разграничение доступа: если векторная база общая, а права пользователей не учитываются при выборке, пользователь получит фрагменты чужих документов. Косвенная инъекция: во внутренний документ можно заранее поместить инструкцию, которая сработает, когда его подтянут в контекст. Утечка через сам вектор: по эмбеддингу в ряде случаев можно частично восстановить исходный текст, поэтому векторное представление надо защищать как сами данные. Загрязнение базы: любой, кто может добавить документ, влияет на будущие ответы.<\\/p><p>Меры: фильтрация по правам на этапе выборки, а не после, изоляция пространств по клиентам или подразделениям, контроль источников при загрузке документов, пометка подтянутого текста как недоверенных данных, журналирование того, какие документы попали в контекст ответа.<\\/p>","sources":["https://atlas.mitre.org/","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM09_VectorAndEmbeddingWeaknesses.md"]},{"id":285,"num":286,"category":"Безопасность ИИ и LLM","text":"Что такое неограниченное потребление и чем оно грозит бизнесу?","answer":"<p>Неограниченное потребление (LLM06:2026) это отсутствие ограничений на объём работы, которую можно заставить выполнить модель. У этого две стороны. Классический отказ в обслуживании, когда тяжёлые запросы исчерпывают ресурсы. И специфичный для ИИ сценарий, когда оплата идёт за обработанные токены, поэтому поток запросов превращается в неконтролируемый счёт от поставщика.<\\/p><p>Сюда же относят и извлечение модели, когда массовыми запросами воспроизводят её поведение или крадут вложенные в неё данные и настройки.<\\/p><p>Меры простые и инженерные: ограничение частоты запросов и квоты на пользователя, лимит длины ввода и вывода, таймауты, ограничение глубины и числа шагов для агентов (иначе агент может зациклиться), бюджетные пороги с оповещением и автоматической остановкой, мониторинг расхода. Бюджетный порог с оповещением это первое, что я бы поставил при выкате любой публичной ИИ-функции.<\\/p>","sources":["https://www.nist.gov/itl/ai-risk-management-framework","https://github.com/GenAI-Security-Project/GenAI-LLM-Top10/blob/main/2026/final/LLM06_UnboundedConsumption.md"]},{"id":286,"num":287,"category":"Безопасность ИИ и LLM","text":"Что такое NIST AI RMF и MITRE ATLAS?","answer":"<p>NIST AI Risk Management Framework (AI RMF 1.0) это добровольная рамка управления рисками систем искусственного интеллекта, построенная вокруг четырёх функций: Govern (управление и ответственность), Map (понять контекст и риски), Measure (измерить), Manage (обработать). К ней выпущен профиль для генеративного ИИ (NIST AI 600-1), который перечисляет характерные для этой технологии риски и меры. По смыслу это аналог того, чем для кибербезопасности является NIST CSF.<\\/p><p>MITRE ATLAS это база знаний о тактиках и техниках атак на системы машинного обучения, устроенная как ATT&CK, с реальными случаями. Она полезна для моделирования угроз и для проверки, видим ли мы такие атаки в своих журналах.<\\/p><p>Разделение ролей такое: AI RMF отвечает на вопрос, как управлять рисками ИИ на уровне организации, OWASP Top 10 для LLM на вопрос, что чаще всего ломается в приложении, ATLAS на вопрос, как именно действует атакующий. На собеседовании хорошо звучит именно такое разграничение.<\\/p>","sources":["https://www.nist.gov/itl/ai-risk-management-framework","https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf","https://atlas.mitre.org/"]},{"id":287,"num":288,"category":"Безопасность ИИ и LLM","text":"Как вы будете безопасно внедрять ИИ-ассистента в компании?","answer":"<p>Начинаю с инвентаризации и политики, потому что к моменту разговора сотрудники обычно уже пользуются публичными сервисами. Значит, первый шаг это дать разрешённый инструмент и понятные правила, какие данные в него можно отдавать, иначе запрет просто уведёт использование в тень.<\\/p><p>Дальше классифицирую сценарии по риску. Ассистент, который только отвечает текстом сотруднику, это низкий риск. Поиск по внутренним документам это уже вопрос разграничения доступа. Агент, который выполняет действия в системах, это высокий риск и отдельное моделирование угроз.<\\/p><p>Технические требования на выкат такие: права модели и её инструментов минимальны и выданы от имени пользователя, внешние данные помечены как недоверенные, вывод проверяется перед использованием, необратимые действия подтверждает человек, есть лимиты и бюджетные пороги, всё логируется, а перед выкатом проведено тестирование на устойчивость к инъекциям. Отдельно фиксирую правовую сторону: персональные данные в такие сервисы отправляются только с учётом требований законодательства, для казахстанских клиентов это закон о персональных данных.<\\/p>","sources":["https://genai.owasp.org/llm-top-10/","https://www.nist.gov/itl/ai-risk-management-framework","https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":288,"num":289,"category":"Кибербезопасность в Казахстане","text":"Как после переименования закона 418-V изменилась терминология кибербезопасности в РК?","answer":"<p>Закон Республики Казахстан от 24 ноября 2015 года № 418-V теперь называется «О кибербезопасности», заголовок изложен в новой редакции законом от 09.01.2026 № 256-VIII (вводится в действие по истечении шести месяцев после первого официального опубликования). Вместе с названием изменился и словарь, и это важно, потому что в документах и на собеседовании старые термины сразу выдают неактуальные знания.<\\/p><p>Ключевое понятие теперь цифровой объект, а не информационная система. Соответственно, кибербезопасность определена как состояние защищённости цифровых объектов от нарушения их конфиденциальности, целостности или доступности. Инцидент кибербезопасности это событие или совокупность событий, негативно влияющих на кибербезопасность цифрового объекта, а реагирование это действия по его минимизации или у
