 чувствительных файлов вроде <code>/etc/shadow<\\/code>, неожиданные исходящие соединения, изменение сетевой конфигурации, запуск контейнера с привилегиями.<\\/p>\\n<p>Смысл в том, что поведение контейнера обычно очень предсказуемо: веб-сервер не запускает <code>bash<\\/code> и не ставит пакеты. Отклонение от этого профиля это сильный сигнал. На практике события Falco отправляются в SIEM, а для части правил настраивается автоматическая реакция, например изоляция пода сетевой политикой. Главная работа, как и с любым детектором, в настройке исключений под свои нагрузки.<\\/p>","sources":["https://falco.org/docs/","https://falco.org/docs/concepts/rules/"]},{"id":115,"num":116,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое CIS Kubernetes Benchmark и kube-bench?","answer":"<p>CIS Benchmarks это наборы рекомендаций по безопасной настройке, которые Center for Internet Security разрабатывает консенсусом сообщества для операционных систем, облаков, баз данных и в том числе для Kubernetes. Kubernetes Benchmark покрывает настройки управляющего слоя (флаги API server, controller manager, scheduler), etcd, узлов и kubelet, а также политики: RBAC, секреты, сетевые политики, безопасность подов.<\\/p>\\n<p>kube-bench это открытый инструмент Aqua Security, который автоматически проверяет узлы кластера на соответствие CIS Kubernetes Benchmark и выдаёт отчёт с результатами PASS, FAIL и WARN и рекомендациями по исправлению. Обычно его запускают как Job в кластере.<\\/p>\\n<p>Нюанс с управляемыми кластерами: к управляющему слою EKS, GKE или AKS у клиента нет доступа, поэтому для них есть отдельные бенчмарки, например CIS Amazon EKS Benchmark, где проверки управляющего слоя отнесены к ответственности провайдера. Бенчмарк это хорошая базовая линия, но он проверяет конфигурацию, а не то, какие нагрузки и права вы реально раздали.<\\/p>","sources":["https://www.cisecurity.org/benchmark/kubernetes","https://github.com/aquasecurity/kube-bench"]},{"id":116,"num":117,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что входит в OWASP Kubernetes Top 10?","answer":"<p>Актуальная редакция 2025 года. K01 Insecure Workload Configurations, небезопасные настройки подов: root, привилегии, отсутствие ограничений. K02 Overly Permissive Authorization Configurations, избыточные права RBAC. K03 Secrets Management Failures, ошибки в хранении и доставке секретов. K04 Lack Of Cluster Level Policy Enforcement, отсутствие политик на уровне кластера. K05 Missing Network Segmentation Controls, отсутствие сетевой сегментации.<\\/p>\\n<p>K06 Overly Exposed Kubernetes Components, открытые наружу компоненты кластера вроде API server, kubelet, дашбордов. K07 Misconfigured And Vulnerable Cluster Components, неправильно настроенные и уязвимые компоненты. K08 Cluster To Cloud Lateral Movement, перемещение из кластера в облачную учётную запись, например через метаданные инстанса. K09 Broken Authentication Mechanisms. K10 Inadequate Logging And Monitoring.<\\/p>\\n<p>По сравнению с редакцией 2022 года появился отдельный пункт про перемещение из кластера в облако, а риски цепочки поставок из отдельного пункта ушли. На собеседовании удобно показать, как каждый пункт закрывается: Pod Security Standards, минимальный RBAC, внешнее хранилище секретов, Kyverno или Gatekeeper, NetworkPolicy, приватный API, обновления, workload identity с IMDSv2, OIDC для людей, журнал аудита.<\\/p>","sources":["https://owasp.org/www-project-kubernetes-top-ten/","https://github.com/OWASP/www-project-kubernetes-top-ten"]},{"id":117,"num":118,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как под получает доступ к облачным сервисам безопасно?","answer":"<p>Плохой вариант это ключи доступа облака в Kubernetes Secret: долгоживущие, их нужно ротировать, они могут утечь. Второй плохой вариант это роль узла: все поды на узле получают права роли EC2 через метаданные инстанса, и любой скомпрометированный под получает права, нужные совсем другим приложениям.<\\/p>\\n<p>Правильный вариант это workload identity, когда облачная роль привязывается к конкретному ServiceAccount. В AWS это IRSA (IAM Roles for Service Accounts), где под обменивает projected-токен ServiceAccount на временные учётные данные роли через OIDC, и EKS Pod Identity, более новый механизм с агентом на узле. В GKE это Workload Identity Federation, в AKS Microsoft Entra Workload ID.<\\/p>\\n<p>Вместе с этим нужно закрыть подам доступ к метаданным инстанса, чтобы они не могли взять роль узла: IMDSv2 с ограничением числа переходов (hop limit) равным 1 или сетевая политика, запрещающая <code>169.254.169.254<\\/code>. Иначе компрометация любого пода превращается в перемещение из кластера в облако, это пункт K08 в OWASP Kubernetes Top 10:2025.<\\/p>","sources":["https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html","https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html","https://docs.aws.amazon.com/eks/latest/best-practices/identity-and-access-management.html"]},{"id":118,"num":119,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что даёт service mesh с точки зрения безопасности?","answer":"<p>Service mesh вроде Istio или Linkerd ставит прокси рядом с каждым сервисом (sidecar или общий прокси на узле) и берёт на себя межсервисное взаимодействие. С точки зрения безопасности главное здесь это автоматический взаимный TLS (mTLS): весь трафик между сервисами шифруется, и каждая сторона проверяет сертификат другой. Сертификаты выдаются и ротируются автоматически, приложения ничего для этого не делают.<\\/p>\\n<p>mTLS даёт каждому сервису криптографическую личность, привязанную к его ServiceAccount. Поверх неё можно писать политики авторизации на уровне L7: сервис <code>orders<\\/code> может вызывать <code>POST /payments<\\/code> у сервиса <code>payments<\\/code>, а остальные нет. Это точнее, чем NetworkPolicy, которая работает с IP-адресами и портами.<\\/p>\\n<p>Минусы в сложности эксплуатации и накладных расходах, плюс сама mesh становится критичным компонентом, который нужно защищать и обновлять. Важно включить строгий режим mTLS, а не разрешающий, иначе незашифрованный трафик продолжит приниматься. NetworkPolicy при этом не отменяется, это разные слои.<\\/p>","sources":["https://istio.io/latest/docs/concepts/security/","https://linkerd.io/2/features/automatic-mtls/"]},{"id":119,"num":120,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что остаётся на вашей ответственности в управляемом Kubernetes (EKS, GKE, AKS)?","answer":"<p>Провайдер отвечает за управляющий слой: доступность и патчи API server, etcd, controller manager и scheduler, шифрование и бэкапы etcd. Всё остальное по модели разделённой ответственности остаётся на клиенте, и AWS в руководстве по безопасности EKS это явно расписывает.<\\/p>\\n<p>На клиенте: доступ к API (приватный эндпоинт или белый список адресов, аутентификация людей через SSO), RBAC и сопоставление облачных ролей с правами в кластере, безопасность узлов (обновление AMI и версий Kubernetes, если это не управляемые провайдером узлы), настройки подов и Pod Security Admission, сетевые политики, шифрование Secrets через KMS, образы и их сканирование, workload identity, включение и сбор журналов аудита управляющего слоя.<\\/p>\\n<p>Отдельно обновления версий Kubernetes: провайдер поддерживает каждую версию ограниченное время, и откладывать обновления надолго нельзя. Типичная ошибка это ощущение, что «кластер управляемый, значит безопасный», хотя самые частые проблемы (открытый API, cluster-admin для всех, поды от root) полностью на стороне клиента.<\\/p>","sources":["https://docs.aws.amazon.com/eks/latest/best-practices/security.html","https://docs.aws.amazon.com/eks/latest/userguide/security.html"]},{"id":120,"num":121,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое матрица MITRE ATT&CK для контейнеров?","answer":"<p>MITRE ATT&amp;CK это база знаний о тактиках и техниках атакующих, построенная на наблюдениях реальных атак. Кроме матрицы для корпоративных систем, у неё есть срез для контейнерных платформ, где собраны техники, применимые к Docker и Kubernetes.<\\/p>\\n<p>Примеры техник из этого среза: развёртывание своего контейнера (Deploy Container), выполнение команд через административный интерфейс контейнеров (Container Administration Command, то есть <code>kubectl exec<\\/code> и <code>docker exec<\\/code>), побег на хост (Escape to Host), использование внешних удалённых сервисов вроде открытого API Docker, поиск контейнеров и ресурсов (Container and Resource Discovery), кража токенов доступа, майнинг за счёт ресурсов жертвы (Resource Hijacking).<\\/p>\\n<p>Зачем это на практике: как чек-лист для покрытия обнаружения. По каждой технике можно ответить, есть ли у нас источник данных и правило, которое её заметит, например журнал аудита Kubernetes для <code>exec<\\/code> или Falco для побега. Пустые клетки показывают, куда вкладываться. Похожую матрицу угроз для Kubernetes также публиковала Microsoft.<\\/p>","sources":["https://attack.mitre.org/matrices/enterprise/containers/","https://attack.mitre.org/techniques/T1610/","https://attack.mitre.org/techniques/T1609/"]},{"id":121,"num":122,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как бы вы провели аудит безопасности существующего кластера Kubernetes?","answer":"<p>Я бы шёл снаружи внутрь. Сначала доступность: откуда доступен API server, открыты ли наружу kubelet, дашборды, etcd, NodePort-сервисы, есть ли анонимный доступ. Затем идентичность и права: кто и как аутентифицируется, кому привязан <code>cluster-admin<\\/code>, какие роли содержат подстановочные знаки, доступ к Secrets, <code>create pods<\\/code>, <code>escalate<\\/code>, <code>bind<\\/code>, <code>impersonate<\\/code>. Для конкретных субъектов удобно <code>kubectl auth can-i --list<\\/code>.<\\/p>\\n<p>Дальше конфигурация: kube-bench по CIS Benchmark для узлов, включено ли шифрование Secrets, есть ли журнал аудита и куда он уходит. Нагрузки: какие поды привилегированные, с hostPath, hostNetwork, от root, без лимитов, какие метки Pod Security Admission стоят на пространствах имён, монтируются ли токены ServiceAccount без нужды. Сеть: есть ли NetworkPolicy и поддерживает ли их сетевой плагин, закрыт ли доступ подов к метаданным облака.<\\/p>\\n<p>И цепочка поставок: откуда берутся образы, сканируются ли они, есть ли проверка подписей при допуске. Результат оформляю как список находок с оценкой риска и конкретными исправлениями, упорядоченный так, чтобы сначала закрыть то, что даёт путь к полному контролю над кластером или облаком.<\\/p>","sources":["https://kubernetes.io/docs/concepts/security/security-checklist/","https://github.com/aquasecurity/kube-bench","https://owasp.org/www-project-kubernetes-top-ten/"]},{"id":122,"num":123,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Под в кластере скомпрометирован. Что вы будете делать?","answer":"<p>Первое это сохранить улики и ограничить ущерб, не уничтожая под сразу. Если удалить под, пропадут файловая система контейнера, процессы и память, а это основные источники для расследования. Поэтому сначала изолирую: NetworkPolicy, запрещающая весь трафик для этого пода, снятие меток, чтобы он выпал из Service и Deployment создал замену, при необходимости cordon узла, чтобы на него не планировались новые поды.<\\/p>\\n<p>Затем сбор данных: описание пода и события, журналы контейнера, снимок файловой системы контейнера (например через <code>kubectl debug<\\/code> или средствами рантайма на узле), список процессов и соединений. Параллельно журнал аудита Kubernetes: что делал ServiceAccount этого пода, какие Secrets читал, что создавал. И журналы облака, если у пода была облачная роль.<\\/p>\\n<p>Дальше оценка радиуса: к каким секретам и сервисам был доступ, отзыв и ротация всех учётных данных, которые под мог прочитать (токен ServiceAccount, секреты, облачные роли), проверка, не создано ли что-то для закрепления: новые поды, CronJob, привязки RBAC, вебхуки. После расследования устранение причины (уязвимость в образе, небезопасная настройка), пересборка и разбор инцидента. Порядок действий тот же, что в реагировании на любой инцидент, его рекомендации собраны в NIST SP 800-61r3.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://docs.aws.amazon.com/eks/latest/best-practices/incident-response-and-forensics.html","https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/"]},{"id":123,"num":124,"category":"Blue team и SOC","text":"Чем занимается SOC и как в нём распределены роли?","answer":"<p>SOC (Security Operations Center) это команда и процессы, которые непрерывно отслеживают события безопасности, обнаруживают атаки, разбирают их и организуют реагирование. Основные инструменты это SIEM, EDR, сетевые сенсоры и система тикетов или SOAR.<\\/p>\\n<p>Классическое деление по линиям. Первая линия (L1) разбирает поток алертов: отсекает ложные срабатывания, собирает первичный контекст, по регламенту закрывает или эскалирует. Вторая линия (L2) проводит более глубокий анализ эскалированных случаев, определяет масштаб, запускает сдерживание. Третья линия (L3) это опытные аналитики и специалисты по реагированию и форензике, которые ведут сложные инциденты, занимаются threat hunting и разрабатывают правила обнаружения.<\\/p>\\n<p>Рядом обычно работают инженеры обнаружения (detection engineering), которые пишут и настраивают правила, команда threat intelligence и инженеры платформы, поддерживающие SIEM и сбор журналов. В современных SOC граница между линиями размывается за счёт автоматизации: рутинную часть L1 всё больше берут на себя плейбуки SOAR.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://www.mitre.org/sites/default/files/2022-04/11-strategies-of-a-world-class-cybersecurity-operations-center.pdf"]},{"id":124,"num":125,"category":"Blue team и SOC","text":"Что такое SIEM и как он работает?","answer":"<p>SIEM (Security Information and Event Management) собирает журналы и события из множества источников, приводит их к общему формату, хранит, даёт по ним поиск и запускает правила обнаружения. Примеры: Splunk, Microsoft Sentinel, Elastic Security, Wazuh, IBM QRadar.<\\/p>\\n<p>Конвейер выглядит так. Сбор: агенты на хостах, syslog, API облаков и SaaS. Разбор и нормализация: из сырой строки выделяются поля (время, пользователь, хост, IP, действие, результат) и приводятся к единой схеме, чтобы одно правило работало по журналам разных продуктов. Обогащение: геолокация IP, данные об активе и его владельце, репутация из threat intelligence. Затем хранение, корреляция и алерты.<\\/p>\\n<p>Главные проблемы на практике не в продукте, а в данных: не собираются нужные источники, поля разобраны неправильно, часы на серверах расходятся, объём и стоимость хранения растут. Поэтому внедрение SIEM я бы начинал не с правил, а с вопроса, какие угрозы мы хотим видеть и какие журналы для этого нужны, и с проверки качества разбора.<\\/p>","sources":["https://csrc.nist.gov/glossary/term/security_information_and_event_management_tool","https://csrc.nist.gov/pubs/sp/800/92/final"]},{"id":125,"num":126,"category":"Blue team и SOC","text":"Что такое корреляция событий? Приведите пример правила.","answer":"<p>Корреляция это связывание нескольких событий, каждое из которых по отдельности может быть нормальным, в один сигнал, который указывает на атаку. События связываются по общему полю (пользователь, хост, IP), по времени и по последовательности.<\\/p>\\n<p>Пример: успешный подбор пароля. Условие: для одной учётной записи не меньше десяти неудачных входов (событие Windows 4625) за пять минут, после которых следует успешный вход (4624) с того же адреса. По отдельности неудачные входы бывают у всех, успешный вход тоже норма, а вместе они дают сигнал высокой важности.<\\/p>\\n<p>Другие типичные корреляции: вход из двух далёких стран за время, за которое туда невозможно доехать; создание учётной записи, добавление её в привилегированную группу и вход под ней в течение часа; срабатывание EDR на хосте и сразу после этого подключение с этого хоста к контроллеру домена. Хорошее правило коррелирует события из разных источников и описывает поведение, а не конкретный адрес или хеш, который атакующий легко сменит.<\\/p>\\n<pre><code># Sigma, много неуспешных входов на одну учётку за короткое окно\\ndetection:\\n  selection: { EventID: 4625 }\\n  timeframe: 5m\\n  condition: selection | count() by TargetUserName > 10<\\/code><\\/pre>\\n<p>Корреляция связывает отдельные события в одно наблюдение. Правило на языке Sigma переносимо между SIEM, здесь оно срабатывает на серию событий 4625 по одной учётной записи внутри пяти минут.<\\/p>","sources":["https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624"]},{"id":126,"num":127,"category":"Blue team и SOC","text":"Какие источники журналов наиболее важны для SOC?","answer":"<p>Идентичность: контроллеры домена Active Directory, облачный провайдер идентификации (Entra ID, Okta), VPN. Большинство атак рано или поздно проходит через учётные записи, и журналы входов нужны почти для каждого расследования.<\\/p>\\n<p>Конечные точки: EDR, журналы безопасности Windows с включённым аудитом создания процессов, Sysmon, журналы PowerShell, auditd на Linux. Здесь видно выполнение кода, закрепление и кражу учётных данных. Сеть: межсетевые экраны, прокси, DNS-запросы, NetFlow, сетевые сенсоры вроде Zeek и Suricata. Здесь видны связь с сервером управления и вывод данных.<\\/p>\\n<p>Облако и приложения: CloudTrail и аналоги, журналы аудита Kubernetes, журналы почты, журналы критичных бизнес-приложений. NIST SP 800-92 подробно разбирает управление журналами. Важная деталь, про которую часто забывают: синхронизация времени на всех источниках, иначе восстановить последовательность событий будет невозможно. И отдельный мониторинг того, что источник вообще присылает журналы, потому что тишина от источника тоже может быть признаком атаки.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/92/final","https://www.cisa.gov/resources-tools/resources/best-practices-event-logging-and-threat-detection"]},{"id":127,"num":128,"category":"Blue team и SOC","text":"Какие события Windows вы бы отслеживали в первую очередь?","answer":"<p>Входы: 4624 успешный вход, 4625 неудачный вход, 4672 назначение специальных привилегий при входе (фактически вход администратора), 4648 вход с явным указанием учётных данных. Процессы: 4688 создание процесса, желательно с включённой записью командной строки, иначе событие мало что даёт.<\\/p>\\n<p>Учётные записи и группы: 4720 создание пользователя, 4728, 4732 и 4756 добавление в глобальную, локальную и универсальную группу безопасности, 4740 блокировка учётной записи. Kerberos на контроллерах домена: 4768 запрос TGT и 4769 запрос сервисного билета, они нужны для обнаружения атак на Kerberos.<\\/p>\\n<p>Признаки закрепления и заметания следов: 7045 установка новой службы (журнал System), 4698 создание запланированной задачи, 1102 очистка журнала безопасности. Отдельно журнал PowerShell с событием 4104 (Script Block Logging), где видно содержимое выполняемых скриптов. Многие из этих событий не пишутся по умолчанию, и первым делом нужно проверить политику аудита.<\\/p>\\n<pre><code>Get-WinEvent -FilterHashtable @{LogName='Security'; Id=4624,4625,4672} -MaxEvents 50<\\/code><\\/pre>\\n<p>4624 это успешный вход, 4625 неуспешный, 4672 выдача привилегий администратора. <code>-FilterHashtable<\\/code> фильтрует на стороне журнала и работает быстрее, чем выборка с <code>Where-Object<\\/code>.<\\/p>","sources":["https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4688","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-1102","https://learn.microsoft.com/en-us/windows-server/identity/ad-ds/plan/appendix-l--events-to-monitor"]},{"id":128,"num":129,"category":"Blue team и SOC","text":"Какие бывают типы входа в Windows и зачем их знать?","answer":"<p>Тип входа (Logon Type) указывается в событии 4624 и говорит, как именно пользователь вошёл. Тип 2 Interactive: вход за консолью компьютера. Тип 3 Network: доступ к ресурсу по сети, например к общей папке. Тип 10 RemoteInteractive: удалённый вход через RDP (службы терминалов). Есть и другие, например тип 4 для пакетных заданий, 5 для служб, 9 NewCredentials при <code>runas /netonly<\\/code>.<\\/p>\\n<p>Для аналитика это важно, потому что один и тот же пользователь с разными типами входа означает совершенно разную активность. Бухгалтер с входом типа 2 на своём ноутбуке это норма. Та же учётка с входом типа 3 на десять серверов за минуту похожа на горизонтальное перемещение. Вход типа 10 на контроллер домена от обычного пользователя это повод для немедленной проверки.<\\/p>\\n<p>Тип 3 в связке с NTLM-аутентификацией и административными общими ресурсами часто сопровождает атаки pass-the-hash и удалённое выполнение через PsExec. Поэтому в правилах корреляции тип входа почти всегда используется как одно из условий.<\\/p>","sources":["https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624"]},{"id":129,"num":130,"category":"Blue team и SOC","text":"Что такое Sysmon и какие его события самые полезные?","answer":"<p>Sysmon (System Monitor) это бесплатный компонент Sysinternals от Microsoft, который устанавливается как служба и драйвер и пишет подробные события об активности системы в отдельный журнал Windows. Он даёт намного больше деталей, чем стандартный аудит, и управляется конфигурационным файлом с фильтрами.<\\/p>\\n<p>Самые полезные события. Event ID 1 создание процесса: полная командная строка, хеши файла, родительский процесс. Event ID 3 сетевое подключение: какой процесс куда подключился. Event ID 8 CreateRemoteThread: создание потока в другом процессе, типично для внедрения кода. Event ID 10 ProcessAccess: один процесс открывает другой, классический признак чтения памяти LSASS для кражи учётных данных. Event ID 11 создание файла. Event ID 22 DNS-запрос с указанием процесса, который его сделал.<\\/p>\\n<p>Без конфигурации Sysmon либо пишет слишком много, либо слишком мало. Обычно берут готовую поддерживаемую сообществом конфигурацию как основу и настраивают исключения под свою среду, иначе объём журналов быстро становится проблемой для SIEM.<\\/p>\\n<pre><code>Get-WinEvent -LogName 'Microsoft-Windows-Sysmon/Operational' |\\n  Where-Object Id -eq 1     # Id 1, создание процесса с командной строкой и хешем<\\/code><\\/pre>\\n<p>Событие Sysmon с Id 1 фиксирует запуск процесса с полной командной строкой, родителем и хешем файла. Id 3 это сетевые соединения, Id 11 создание файлов, эти три дают основную видимость на хосте.<\\/p>","sources":["https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon"]},{"id":130,"num":131,"category":"Blue team и SOC","text":"Как логировать PowerShell и почему это важно?","answer":"<p>PowerShell есть на каждой Windows-машине, он мощный и умеет выполнять код прямо из памяти, поэтому атакующие активно им пользуются. Без логирования от такой активности почти ничего не остаётся.<\\/p>\\n<p>Есть три механизма. Module Logging записывает выполнение команд модулей. Script Block Logging (событие 4104 в журнале Microsoft-Windows-PowerShell/Operational) записывает содержимое выполняемых блоков скрипта, причём уже после раскрытия обфускации, то есть видно реальный код, даже если он пришёл закодированным в Base64. Transcription пишет полный текстовый протокол сессии в файлы. Включаются групповой политикой.<\\/p>\\n<p>На что обращать внимание в журналах: <code>-EncodedCommand<\\/code> и длинные строки Base64, загрузка кода из сети (<code>DownloadString<\\/code>, <code>Invoke-WebRequest<\\/code> с последующим <code>IEX<\\/code>), обход политики выполнения, попытки отключить защиту или журналирование. Отдельно стоит отслеживать запуск PowerShell версии 2, в которой этих механизмов логирования нет, поэтому её иногда используют для их обхода. Лучше её вообще удалить.<\\/p>","sources":["https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows","https://attack.mitre.org/techniques/T1059/001/"]},{"id":131,"num":132,"category":"Blue team и SOC","text":"Какие журналы Linux важны для безопасности?","answer":"<p>Журналы аутентификации: <code>/var/log/auth.log<\\/code> в Debian и Ubuntu или <code>/var/log/secure<\\/code> в RHEL, а на системах с systemd те же данные в journald. Здесь входы по SSH, успешные и неудачные, использование <code>sudo<\\/code>, изменения пользователей. Команда <code>last<\\/code> показывает историю входов из <code>wtmp<\\/code>, <code>lastb<\\/code> неудачные попытки.<\\/p>\\n<p>Для подробного аудита используется подсистема auditd. Правила аудита позволяют записывать выполнение программ через системный вызов <code>execve<\\/code>, изменения важных файлов (<code>/etc/passwd<\\/code>, <code>/etc/shadow<\\/code>, <code>/etc/sudoers<\\/code>, ключи SSH), загрузку модулей ядра. Журналы разбирают утилитами <code>ausearch<\\/code> и <code>aureport<\\/code>.<\\/p>\\n<p>Кроме этого: журналы веб-серверов и приложений, cron, журналы пакетного менеджера (что ставили и когда), журналы ядра. Важно отправлять журналы на центральный сервер сразу, потому что атакующий с правами root первым делом чистит локальные журналы и историю команд. Для хостов, где нужен уровень EDR, есть также Sysmon for Linux и решения на eBPF.<\\/p>","sources":["https://man7.org/linux/man-pages/man8/auditd.8.html","https://man7.org/linux/man-pages/man7/audit.rules.7.html","https://man7.org/linux/man-pages/man1/journalctl.1.html"]},{"id":132,"num":133,"category":"Blue team и SOC","text":"Что такое MITRE ATT&CK и какие в нём тактики?","answer":"<p>MITRE ATT&amp;CK это открытая база знаний о тактиках, техниках и процедурах атакующих, собранная по наблюдениям реальных атак. Тактика это цель атакующего на данном шаге (зачем), техника это способ её достичь (как), подтехника уточняет способ, а процедура это конкретная реализация у конкретной группы или вредоноса.<\\/p>\\n<p>В текущей корпоративной матрице 15 тактик: Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Stealth, Defense Impairment, Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration, Impact. Стоит обратить внимание, что во многих учебных материалах их 14 и есть тактика Defense Evasion. Сейчас на сайте MITRE тактика TA0005 называется Stealth, а отдельно появилась Defense Impairment (TA0112), про нарушение работы средств защиты и видимости.<\\/p>\\n<p>Для каждой техники в ATT&amp;CK описаны известные группы и вредоносы, которые её используют, источники данных для обнаружения и меры противодействия. Поэтому ATT&amp;CK стал общим языком: отчёт об угрозе, правило обнаружения и находка пентеста могут ссылаться на один и тот же идентификатор техники.<\\/p>","sources":["https://attack.mitre.org/tactics/enterprise/","https://attack.mitre.org/tactics/TA0005/","https://attack.mitre.org/tactics/TA0112/"]},{"id":133,"num":134,"category":"Blue team и SOC","text":"Как SOC использует MITRE ATT&CK на практике?","answer":"<p>Главное применение это оценка покрытия обнаружения. Каждое правило в SIEM и EDR связывается с техниками ATT&amp;CK, которые оно обнаруживает, и получается карта: какие техники мы видим, какие частично, какие нет. Для визуализации удобен ATT&amp;CK Navigator. Пустые места на карте, особенно по техникам, которые используют группы, актуальные для нашей отрасли, становятся приоритетами для новых правил.<\\/p>\\n<p>Второе применение это общий язык. Алерт помечается техникой, и аналитик сразу понимает, на каком этапе атаки мы находимся и что искать дальше. Отчёты threat intelligence тоже описывают группы через техники, и их можно напрямую сопоставить со своим покрытием.<\\/p>\\n<p>Третье это проверка обнаружения: эмуляция техник (например тесты Atomic Red Team) и учения красной и синей команды с разбором по техникам. Важная оговорка: закрашенная клетка в Navigator не значит, что технику мы поймаем в любом её варианте. Покрытие нужно проверять реальными тестами, а не только разметкой правил.<\\/p>","sources":["https://attack.mitre.org/resources/","https://mitre-attack.github.io/attack-navigator/","https://github.com/redcanaryco/atomic-red-team"]},{"id":134,"num":135,"category":"Blue team и SOC","text":"Чем Cyber Kill Chain отличается от MITRE ATT&CK?","answer":"<p>Cyber Kill Chain от Lockheed Martin описывает атаку как последовательность из семи этапов: разведка (Reconnaissance), подготовка оружия (Weaponization), доставка (Delivery), эксплуатация (Exploitation), установка (Installation), управление (Command and Control), действия по цели (Actions on Objectives). Идея в том, что если прервать атаку на любом этапе, она не достигнет цели, поэтому защиту нужно строить на каждом этапе.<\\/p>\\n<p>Kill Chain хорош для объяснения атаки руководству и для общего взгляда на защиту. Но он высокоуровневый и сильно ориентирован на начальное проникновение: основная часть модели про то, как атакующий попадает внутрь, а всё, что он делает потом (повышение привилегий, горизонтальное перемещение, кража учётных данных), укладывается в один-два этапа.<\\/p>\\n<p>ATT&amp;CK детальнее и не задаёт жёсткой последовательности: тактики могут повторяться в любом порядке, а под каждой тактикой десятки конкретных техник. Поэтому для разработки правил обнаружения и оценки покрытия используют ATT&amp;CK, а Kill Chain удобен как верхнеуровневая рамка.<\\/p>","sources":["https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html","https://attack.mitre.org/resources/faq/"]},{"id":135,"num":136,"category":"Blue team и SOC","text":"Что такое пирамида боли (Pyramid of Pain)?","answer":"<p>Пирамида боли это модель Дэвида Бьянко, которая показывает, насколько сильно разные типы индикаторов мешают атакующему, если защитники их обнаруживают и блокируют. Снизу вверх: хеши файлов, IP-адреса, доменные имена, сетевые и хостовые артефакты, инструменты и на вершине TTP (тактики, техники и процедуры).<\\/p>\\n<p>Смысл в том, что нижние уровни атакующий меняет почти бесплатно. Хеш меняется перекомпиляцией или одним байтом, IP-адрес новым сервером за несколько минут. Блокировка таких индикаторов даёт кратковременный эффект. Чем выше уровень, тем дороже атакующему приспособиться: сменить инструмент это уже работа, а сменить сам способ действий, например перестать красть учётные данные из памяти LSASS, очень сложно.<\\/p>\\n<p>Практический вывод для SOC: индикаторы из threat intelligence полезны, но основные правила обнаружения стоит строить на поведении и техниках. Правило «процесс, не являющийся системным, открывает память LSASS с правами чтения» переживёт смену инструмента, а правило на хеш mimikatz нет.<\\/p>","sources":["https://www.sans.org/tools/the-pyramid-of-pain/"]},{"id":136,"num":137,"category":"Blue team и SOC","text":"Чем индикаторы компрометации (IoC) отличаются от индикаторов атаки и TTP?","answer":"<p>IoC (Indicator of Compromise) это артефакт, который указывает, что компрометация уже произошла: хеш вредоносного файла, IP-адрес или домен сервера управления, имя файла, ключ реестра, URL. Их удобно распространять между организациями и быстро проверять по журналам, но они реактивные и легко меняются атакующим.<\\/p>\\n<p>Индикаторы атаки (IoA) и TTP описывают поведение, намерение атакующего независимо от конкретных инструментов. Например, «офисное приложение запускает PowerShell, который скачивает и выполняет код из интернета» или «учётная запись обращается к общим ресурсам на десятках хостов подряд». Такие правила сложнее писать и в них больше ложных срабатываний, но они ловят и новые, ещё неизвестные вредоносы.<\\/p>\\n<p>На практике нужно и то и другое. IoC из threat intelligence прогоняют по журналам ретроспективно, чтобы понять, не было ли уже такой активности у нас, и ставят на блокировку. Поведенческие правила обеспечивают основное обнаружение. Это прямое следствие пирамиды боли.<\\/p>","sources":["https://csrc.nist.gov/glossary/term/indicator","https://www.sans.org/tools/the-pyramid-of-pain/"]},{"id":137,"num":138,"category":"Blue team и SOC","text":"Что такое Sigma и зачем она нужна?","answer":"<p>Sigma это открытый формат описания правил обнаружения по журналам, независимый от конкретного SIEM. Правило пишется в YAML: метаданные (название, автор, статус, уровень важности, ссылки на техники ATT&amp;CK), источник журналов (<code>logsource<\\/code>, например категория <code>process_creation<\\/code> и продукт <code>windows<\\/code>), условия отбора (<code>detection<\\/code>) и известные ложные срабатывания.<\\/p>\\n<p>Затем правило конвертируется в язык запросов нужной платформы: Splunk SPL, KQL для Sentinel, запросы Elastic и другие. Для этого есть инструмент pySigma и утилита sigma-cli. Так одно и то же правило можно использовать в разных SIEM, а сообщество делится тысячами готовых правил в репозитории SigmaHQ.<\\/p>\\n<p>Для SOC это даёт переносимость (смена SIEM не означает переписывание всех правил) и основу для подхода detection-as-code: правила хранятся в git, проходят ревью и тесты, автоматически разворачиваются. Готовые правила из репозитория всё равно нужно адаптировать под свою среду и поля, иначе будет много шума.<\\/p>","sources":["https://sigmahq.io/docs/basics/rules.html","https://github.com/SigmaHQ/sigma"]},{"id":138,"num":139,"category":"Blue team и SOC","text":"Что такое YARA и где её применяют?","answer":"<p>YARA это инструмент и язык правил для поиска и классификации вредоносных файлов по шаблонам. Правило состоит из набора строк (текстовых, шестнадцатеричных с масками, регулярных выражений) и условия, которое их комбинирует, например «в файле встречаются как минимум три из этих пяти строк и он начинается с заголовка исполняемого файла Windows». Модули позволяют проверять структуру форматов, например секции и импорты PE-файлов.<\\/p>\\n<p>Где используется: аналитики вредоносного ПО описывают семейство вредоносов правилом и затем находят все его образцы; команды реагирования сканируют файловые системы и образы памяти скомпрометированных хостов; YARA-правила встроены во многие EDR, песочницы и почтовые шлюзы; ими обмениваются в отчётах threat intelligence.<\\/p>\\n<p>Если Sigma про события в журналах, то YARA про содержимое файлов и памяти. Хорошее правило опирается на то, что сложно изменить без переписывания вредоноса (уникальные строки, особенности кода), а не на то, что меняется при каждой сборке.<\\/p>\\n<pre><code>yara -r rules.yar /path/to/scan   # -r рекурсивно по каталогу<\\/code><\\/pre>\\n<p>YARA ищет файлы по правилам из строк и условий. Одно правило описывает характерные строки образца, а флаг <code>-r<\\/code> прогоняет их рекурсивно по каталогу при поиске того же семейства.<\\/p>","sources":["https://virustotal.github.io/yara/","https://yara.readthedocs.io/en/stable/writingrules.html"]},{"id":139,"num":140,"category":"Blue team и SOC","text":"Что такое detection engineering и detection-as-code?","answer":"<p>Detection engineering это инженерная дисциплина создания и сопровождения правил обнаружения. Правило рассматривается как продукт: у него есть требование (какую технику и в каком виде мы хотим ловить), реализация, тесты, документация (что делать аналитику при срабатывании), метрики качества и жизненный цикл.<\\/p>\\n<p>Detection-as-code переносит в это практики разработки. Правила хранятся в git, например в формате Sigma. Изменения проходят через пул-реквест и ревью. В CI правило проверяется синтаксически и прогоняется на тестовых данных: на примере атаки оно должно сработать, на примере нормальной активности нет. Затем правило автоматически разворачивается в SIEM. Для получения тестовых данных атаки удобно использовать эмуляцию, например Atomic Red Team.<\\/p>\\n<p>Выигрыш в том, что видна история изменений, правило нельзя незаметно сломать или отключить, покрытие измеримо, а качество правил растёт. Для меня как для человека из DevOps это очень естественный подход: тот же пайплайн, только вместо приложения правила обнаружения.<\\/p>","sources":["https://github.com/SigmaHQ/sigma","https://github.com/redcanaryco/atomic-red-team","https://www.splunk.com/en_us/blog/security/ci-cd-detection-engineering-splunk-security-content-part-1.html"]},{"id":140,"num":141,"category":"Blue team и SOC","text":"Как вы боретесь с ложными срабатываниями и усталостью от алертов?","answer":"<p>Усталость от алертов опасна тем, что аналитики начинают закрывать алерты не глядя, и настоящую атаку пропускают среди сотен ложных. Поэтому шум это не неудобство, а риск.<\\/p>\\n<p>Первое это измерять: для каждого правила считать, сколько срабатываний оказались настоящими, сколько времени уходит на разбор. Правила с почти нулевой долей подтверждённых срабатываний либо настраиваются, либо переводятся из алертов в данные для hunting, либо выключаются. Второе это точечные исключения с обоснованием и сроком пересмотра: конкретный сервисный процесс на конкретном хосте, а не «исключить весь сервер».<\\/p>\\n<p>Третье это обогащение и агрегация: алерт сразу приходит с контекстом (владелец актива, его критичность, история пользователя), а связанные срабатывания объединяются в один инцидент. Четвёртое это автоматизация рутинных проверок в SOAR: проверить репутацию, спросить пользователя, подтвердил ли он действие. И наконец приоритизация по риску: одно и то же правило на контроллере домена и на тестовой машине должно давать разную важность.<\\/p>","sources":["https://www.cisa.gov/resources-tools/resources/best-practices-event-logging-and-threat-detection","https://sigmahq.io/docs/basics/rules.html"]},{"id":141,"num":142,"category":"Blue team и SOC","text":"Как вы разбираете алерт? Опишите последовательность.","answer":"<p>Первое это понять, что именно сработало и почему: какое правило, на каком хосте и пользователе, какие исходные события. Посмотреть само событие, а не только название алерта, потому что название часто вводит в заблуждение.<\\/p>\\n<p>Второе это контекст. Что это за хост и пользователь, насколько они критичны, нормально ли для них такое поведение (история за последние недели), был ли похожий алерт раньше и чем он закончился. Проверить индикаторы: репутацию IP, домена, хеша. Посмотреть, что происходило на хосте до и после: родительский процесс, дочерние процессы, сетевые подключения, входы.<\\/p>\\n<p>Третье это решение: ложное срабатывание, подтверждённая безвредная активность (например тест администратора) или инцидент. Если инцидент, то определить масштаб (есть ли такая же активность на других хостах), важность, и эскалировать по регламенту, при необходимости сразу начать сдерживание. Всё, что сделано и найдено, записывается в тикет, чтобы следующий аналитик не повторял работу, а по ложным срабатываниям давалась обратная связь авторам правил.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":142,"num":143,"category":"Blue team и SOC","text":"Что такое EDR и чем он отличается от антивируса и XDR?","answer":"<p>Классический антивирус в основном проверяет файлы по сигнатурам и эвристикам и блокирует известный вредоносный код. EDR (Endpoint Detection and Response) непрерывно записывает телеметрию с конечной точки: процессы, командные строки, сетевые подключения, изменения файлов и реестра, загрузку модулей. По этой телеметрии работают поведенческие правила, а аналитик может смотреть дерево процессов и историю событий хоста за прошлые дни.<\\/p>\\n<p>Вторая половина названия это реагирование: изолировать хост от сети, оставив связь только с консолью EDR, завершить процесс, удалить файл, собрать артефакты для расследования, запустить скрипт. Это ключевой инструмент сдерживания при инциденте.<\\/p>\\n<p>XDR (Extended Detection and Response) расширяет этот подход на другие источники: почту, идентичность, облако, сеть, и коррелирует их в одной платформе, обычно одного вендора. На практике граница между XDR и SIEM с хорошей корреляцией размыта. Важно помнить, что атакующие целенаправленно пытаются отключить EDR, поэтому пропажа телеметрии с хоста сама по себе должна быть алертом.<\\/p>","sources":["https://csrc.nist.gov/glossary/term/endpoint_detection_and_response","https://attack.mitre.org/techniques/T1685/"]},{"id":143,"num":144,"category":"Blue team и SOC","text":"Как используют сетевые сенсоры вроде Zeek и Suricata?","answer":"<p>Suricata это IDS и IPS: она проверяет трафик по сигнатурам и выдаёт алерты о совпадениях, например известные эксплойты, трафик вредоносов, сканирование. Также умеет записывать метаданные протоколов и извлекать файлы.<\\/p>\\n<p>Zeek работает иначе: это не система сигнатур, а анализатор трафика, который превращает его в структурированные журналы по протоколам. <code>conn.log<\\/code> со всеми соединениями, <code>dns.log<\\/code> с запросами и ответами, <code>http.log<\\/code>, <code>ssl.log<\\/code> с параметрами TLS и сертификатами, <code>files.log<\\/code> с хешами переданных файлов. Эти журналы идут в SIEM и становятся отличным материалом для расследований и threat hunting.<\\/p>\\n<p>Сетевая телеметрия ценна тем, что её трудно подделать со скомпрометированного хоста и она охватывает устройства, на которые нельзя поставить агента. Ограничение в шифровании: содержимое TLS-трафика без расшифровки не видно, но метаданные (кому, сколько, как часто, отпечаток TLS-клиента, сертификат) часто позволяют найти связь с сервером управления или вывод данных.<\\/p>","sources":["https://docs.zeek.org/en/master/about.html","https://docs.zeek.org/en/master/logs/index.html","https://docs.suricata.io/en/latest/what-is-suricata.html"]},{"id":144,"num":145,"category":"Blue team и SOC","text":"Что такое UEBA?","answer":"<p>UEBA (User and Entity Behavior Analytics) это аналитика поведения пользователей и сущностей (хостов, сервисных учётных записей, приложений). Система строит профиль нормального поведения для каждой сущности и её группы коллег, а затем оценивает отклонения: вход в необычное время или из необычного места, доступ к ресурсам, к которым человек раньше не обращался, резкий рост объёма скачанных данных.<\\/p>\\n<p>Сильная сторона UEBA в обнаружении того, что плохо описывается статическими правилами: инсайдеры, скомпрометированные учётные записи, которыми атакующий пользуется легитимными средствами, медленные атаки. Отклонения обычно суммируются в оценку риска пользователя, и аналитик получает алерт, когда риск превышает порог.<\\/p>\\n<p>Минусы: период обучения, много шума в средах с нестабильным поведением (реорганизации, сезонные нагрузки) и сложность объяснения, почему сработало. Поэтому UEBA хорошо работает как дополнительный слой приоритизации и источник для hunting, а не как замена правилам на конкретные техники.<\\/p>","sources":["https://learn.microsoft.com/en-us/azure/sentinel/identify-threats-with-entity-behavior-analytics","https://attack.mitre.org/techniques/T1078/"]},{"id":145,"num":146,"category":"Blue team и SOC","text":"Что такое SOAR и как устроен плейбук?","answer":"<p>SOAR (Security Orchestration, Automation and Response) это платформа, которая автоматизирует повторяющиеся действия SOC и связывает инструменты между собой через их API: SIEM, EDR, почту, межсетевые экраны, каталог пользователей, систему тикетов, threat intelligence.<\\/p>\\n<p>Плейбук это описанный сценарий обработки определённого типа алерта. Пример для подозрительного письма: получить письмо из алерта, извлечь ссылки, вложения и адрес отправителя, проверить их репутацию и отправить вложение в песочницу, найти всех получателей такого же письма. Если вердикт вредоносный: удалить письма из всех ящиков, заблокировать отправителя и домен, проверить, кто перешёл по ссылке, и для них сбросить сессии. Каждый шаг записывается в тикет.<\\/p>\\n<p>Важно разделять обогащение и реагирование. Сбор контекста можно автоматизировать полностью. Разрушительные действия, например изоляцию сервера или блокировку учётки руководителя, лучше делать с подтверждением человека, по крайней мере пока плейбук не отработал на практике. Хорошо автоматизировать то, что делается часто и одинаково, иначе поддержка плейбуков съест выигрыш.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://www.cisa.gov/resources-tools/resources/federal-government-cybersecurity-incident-and-vulnerability-response-playbooks"]},{"id":146,"num":147,"category":"Blue team и SOC","text":"Что такое threat hunting и как его проводить?","answer":"<p>Threat hunting это проактивный поиск атакующих, которые уже находятся в среде и не вызвали срабатывания существующих правил. Исходное допущение: защита несовершенна, и что-то могло пройти незамеченным.<\\/p>\\n<p>Работа обычно строится от гипотезы. Источники гипотез: техники ATT&amp;CK, по которым у нас нет правил, свежие отчёты threat intelligence о группах, атакующих нашу отрасль, изменения в среде. Пример гипотезы: «атакующий закрепляется через запланированные задачи, запускающие скрипты из пользовательских каталогов». Дальше аналитик формулирует, какие данные это покажут, строит запросы, ищет редкие и аномальные значения (метод наименьшей частоты хорошо работает на больших парках) и разбирает найденное.<\\/p>\\n<p>Результат охоты полезен при любом исходе. Если найдена атака, начинается реагирование. Если нет, остаются новое правило обнаружения, найденные пробелы в данных (например нужный журнал не собирается) и лучшее понимание нормы в своей среде. Без хорошей телеметрии hunting невозможен, поэтому он опирается на EDR, Sysmon и сетевые журналы.<\\/p>","sources":["https://attack.mitre.org/resources/","https://www.cisa.gov/resources-tools/resources/best-practices-event-logging-and-threat-detection"]},{"id":147,"num":148,"category":"Blue team и SOC","text":"Что такое threat intelligence, какие у неё уровни и форматы обмена?","answer":"<p>Threat intelligence это проанализированная информация об угрозах, которая помогает принимать решения. Сырой список IP-адресов ещё не разведка, разведкой он становится, когда понятно, к какой угрозе относится, насколько достоверен и что с ним делать.<\\/p>\\n<p>Обычно выделяют три уровня. Стратегический: какие группы и мотивы угрожают нашей отрасли и региону, для руководства и планирования. Операционный: как действуют конкретные группы, их кампании и TTP, для планирования обнаружения и hunting. Тактический: конкретные индикаторы (хеши, домены, адреса) для блокировки и поиска по журналам.<\\/p>\\n<p>Для обмена используют стандарты OASIS: STIX описывает объекты разведки (индикаторы, вредоносы, группы, связи между ними), TAXII это протокол передачи STIX между системами. Открытая платформа MISP популярна для обмена внутри сообществ. Правила распространения задаёт Traffic Light Protocol от FIRST, в версии 2.0 четыре метки: TLP:RED, TLP:AMBER (есть вариант TLP:AMBER+STRICT, только внутри организации), TLP:GREEN и TLP:CLEAR.<\\/p>","sources":["https://oasis-open.github.io/cti-documentation/","https://www.first.org/tlp/","https://www.misp-project.org/"]},{"id":148,"num":149,"category":"Blue team и SOC","text":"Как вы анализируете подозрительное письмо?","answer":"<p>Начинаю с заголовков. Смотрю реальный адрес отправителя в <code>From<\\/code> и <code>Return-Path<\\/code>, <code>Reply-To<\\/code> (частый признак подмены, когда ответ уходит атакующему), цепочку <code>Received<\\/code> снизу вверх, чтобы понять, через какие серверы письмо пришло. Затем результаты проверок в <code>Authentication-Results<\\/code>: SPF (разрешено ли серверу отправлять почту от имени домена, RFC 7208), DKIM (цифровая подпись письма доменом, RFC 6376) и DMARC (политика домена и согласование домена из <code>From<\\/code> с доменами SPF и DKIM, RFC 7489).<\\/p>\\n<p>Важно понимать ограничения: прохождение SPF и DKIM не означает, что письмо безопасно. Атакующий может отправить письмо с похожего домена, для которого сам всё правильно настроил. Поэтому проверяю и сам домен на похожесть и дату регистрации.<\\/p>\\n<p>Затем содержимое: ссылки (куда реально ведут, а не что написано в тексте) и вложения. Открываю их только в изолированной среде или песочнице, проверяю репутацию и хеши. Если письмо вредоносное, дальше ищу всех получателей, проверяю, кто открыл вложение или перешёл по ссылке и вводил ли учётные данные, удаляю письма из ящиков и блокирую индикаторы. В ATT&amp;CK это техника Phishing.<\\/p>","sources":["https://www.rfc-editor.org/rfc/rfc7208","https://www.rfc-editor.org/rfc/rfc6376","https://www.rfc-editor.org/rfc/rfc7489","https://attack.mitre.org/techniques/T1566/"]},{"id":149,"num":150,"category":"Blue team и SOC","text":"Как обнаружить подбор паролей и password spraying?","answer":"<p>Классический перебор это много попыток к одной учётной записи. Он виден как всплеск неудачных входов (событие 4625 в Windows, неудачи в журналах VPN и облачного провайдера идентификации) для одного пользователя и часто заканчивается блокировкой учётки (4740).<\\/p>\\n<p>Password spraying хитрее: атакующий пробует один-два распространённых пароля против сотен учётных записей, оставаясь ниже порога блокировки. На уровне одной учётки ничего подозрительного нет. Обнаруживать нужно по источнику: один IP или небольшая группа адресов с неудачными входами по большому числу разных пользователей за короткое время. На контроллерах домена также полезны события Kerberos с ошибкой предварительной аутентификации (4771).<\\/p>\\n<p>Особое внимание успешному входу после такой серии, это уже возможная компрометация. Для облачных сервисов важно учитывать устаревшие протоколы без поддержки MFA, через которые часто идёт spraying. Лучшая защита это MFA и блокировка устаревшей аутентификации, а обнаружение остаётся для контроля. В ATT&amp;CK это подтехника Password Spraying техники Brute Force.<\\/p>\\n<pre><code># один источник против многих учёток это spraying, а не перебор одной\\njournalctl -u ssh --since '-1h' | grep 'Failed password' |\\n  grep -oE 'from [0-9.]+' | sort | uniq -c | sort -rn<\\/code><\\/pre>\\n<p>При обычном переборе много попыток по одной учётке, при password spraying один или пара паролей по многим учёткам, чтобы не упереться в блокировку. Поэтому группировать надо и по источнику, и по имени пользователя.<\\/p>","sources":["https://attack.mitre.org/techniques/T1110/003/","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771"]},{"id":150,"num":151,"category":"Blue team и SOC","text":"Как обнаружить атаки на Kerberos, например Kerberoasting?","answer":"<p>При Kerberoasting атакующий с любой доменной учётной записью запрашивает сервисные билеты для учётных записей с SPN и перебирает их пароли офлайн. На контроллере домена это видно в событиях 4769 (запрос сервисного билета). Признаки: один пользователь запрашивает билеты к большому числу разных сервисов за короткое время, запросы с типом шифрования RC4 (<code>0x17<\\/code>) в среде, где сервисы должны использовать AES, запросы к сервисам, к которым этот пользователь обычно не обращается.<\\/p>\\n<p>Хорошо работает приманка (honeypot): учётная запись с SPN, которую никто никогда не использует. Любой запрос билета для неё почти наверняка атака, и это правило практически без ложных срабатываний. AS-REP roasting обнаруживается по событиям 4768 для учётных записей без предварительной аутентификации, особенно с RC4.<\\/p>\\n<p>Для golden ticket и других подделок билетов признаки сложнее: сервисные билеты без предшествующего запроса TGT, аномальные сроки жизни билетов, использование несуществующих учётных записей. Профилактика здесь важнее обнаружения: длинные пароли или gMSA для сервисных учётных записей, отключение RC4, регулярная смена пароля <code>krbtgt<\\/code>.<\\/p>","sources":["https://attack.mitre.org/techniques/T1558/003/","https://attack.mitre.org/techniques/T1558/004/","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769"]},{"id":151,"num":152,"category":"Blue team и SOC","text":"Как обнаружить горизонтальное перемещение в сети?","answer":"<p>Горизонтальное перемещение это переход атакующего с одного скомпрометированного хоста на другие. Типичные способы в Windows: удалённые службы через SMB и административные общие ресурсы (PsExec и аналоги), WMI, WinRM и PowerShell Remoting, RDP, запланированные задачи на удалённых машинах, использование украденных хешей и билетов.<\\/p>\\n<p>Признаки в журналах. На целевом хосте: вход типа 3 от учётной записи, которая обычно так не ходит, и сразу после него установка новой службы (событие 7045) или создание задачи (4698), доступ к общим ресурсам <code>ADMIN$<\\/code> и <code>C$<\\/code> (5140, 5145). Процессы, запущенные от <code>wmiprvse.exe<\\/code> или <code>wsmprovhost.exe<\\/code>, указывают на WMI и WinRM. На сети: один хост внезапно подключается по SMB, RDP или WinRM ко многим другим.<\\/p>\\n<p>Самый сильный сигнал это отклонение от нормального графа связей: рабочая станция бухгалтера не должна подключаться к серверам по RDP, а обычный пользователь не должен иметь административных входов на десятке машин. Поэтому знать, кто и куда обычно ходит, так же важно, как иметь правила. В ATT&amp;CK это тактика Lateral Movement.<\\/p>","sources":["https://attack.mitre.org/tactics/TA0008/","https://attack.mitre.org/techniques/T1021/002/","https://attack.mitre.org/techniques/T1569/002/"]},{"id":152,"num":153,"category":"Blue team и SOC","text":"Как обнаружить связь вредоноса с сервером управления (C2)?","answer":"<p>Вредонос после заражения регулярно связывается с сервером управления за командами. Характерный признак это beaconing: подключения к одному и тому же адресу через почти равные интервалы, иногда с небольшим случайным разбросом. Обычные пользователи и программы так себя не ведут. Поиск строится по сетевым журналам (прокси, Zeek, межсетевой экран): для каждой пары хост и назначение считают регулярность интервалов и стабильность размера ответов.<\\/p>\\n<p>Другие признаки: обращения к недавно зарегистрированным доменам или доменам с высокой энтропией имени (генерация доменов алгоритмом), редкие для организации назначения, туннелирование через DNS с длинными поддоменами и большим числом запросов, необычные отпечатки TLS-клиента, долгие соединения с малым объёмом данных, подключения процессов, которым сеть не нужна.<\\/p>\\n<p>Атакующие маскируются под легитимный трафик: используют облачные сервисы, CDN и популярные платформы в качестве канала. Поэтому сетевые признаки лучше сопоставлять с хостовыми данными: какой именно процесс делает эти подключения (Sysmon событие 3 или EDR). В ATT&amp;CK это тактика Command and Control.<\\/p>\\n<pre><code># регулярные соединения к одному хосту одинакового размера это маяк (beacon)\\ntshark -r capture.pcap -q -z conv,ip | sort -k7 -nr | head<\\/code><\\/pre>\\n<p>Канал управления часто выдаёт себя равномерными по времени и размеру запросами. Сводка разговоров <code>-z conv,ip<\\/code> помогает увидеть хост, к которому обращаются подозрительно ритмично.<\\/p>","sources":["https://attack.mitre.org/tactics/TA0011/","https://attack.mitre.org/techniques/T1071/","https://attack.mitre.org/techniques/T1568/002/"]},{"id":153,"num":154,"category":"Blue team и SOC","text":"Как обнаружить вывод данных (эксфильтрацию)?","answer":"<p>Первый признак это объём: необычно большой исходящий трафик с хоста или от пользователя, особенно на внешние адреса, куда раньше данные не уходили, или в нерабочее время. Сравнивать нужно с нормой именно этого хоста и пользователя, потому что для одних серверов гигабайты наружу это норма, для других аномалия.<\\/p>\\n<p>Второе это направление и способ: загрузки в облачные хранилища и файлообменники, особенно личные аккаунты, использование утилит синхронизации вроде rclone, выгрузка через DNS-туннели, архивы с паролем перед отправкой. Часто эксфильтрации предшествует сбор данных: массовое чтение файлов с общих ресурсов, выгрузки из баз, создание архивов, это тоже можно ловить.<\\/p>\\n<p>Источники для этого: прокси и межсетевые экраны с учётом объёма, журналы облачных хранилищ и SaaS, DLP, EDR с данными о процессах и файлах. В ATT&amp;CK это тактика Exfiltration. Отдельно стоит помнить про современный сценарий шифровальщиков: сначала данные выводят, потом шифруют, поэтому обнаружение эксфильтрации даёт шанс остановить атаку до шифрования.<\\/p>\\n<pre><code># аномально длинные DNS-запросы это возможный туннель для вывода данных\\ntshark -r capture.pcap -Y 'dns.qry.name' -T fields -e dns.qry.name |\\n  awk 'length > 50' | sort | uniq -c<\\/code><\\/pre>\\n<p>Вывод данных прячут в разрешённые протоколы, чаще всего в DNS. Много длинных уникальных поддоменов к одному домену это признак туннеля, отдельно смотрят и на резкий рост исходящего объёма.<\\/p>","sources":["https://attack.mitre.org/tactics/TA0010/","https://attack.mitre.org/techniques/T1567/002/"]},{"id":154,"num":155,"category":"Blue team и SOC","text":"Как устроен процесс реагирования на инциденты по NIST?","answer":"<p>Классическая модель из NIST SP 800-61 Rev. 2 содержит четыре фазы: подготовка; обнаружение и анализ; сдерживание, устранение и восстановление; действия после инцидента. Именно её чаще всего спрашивают на собеседованиях, и её полезно уметь рассказать.<\\/p>\\n<p>В апреле 2025 года вышла Rev. 3, которая заменила Rev. 2. Она устроена иначе: реагирование на инциденты встроено в общее управление рисками кибербезопасности по NIST CSF 2.0 и описано как профиль CSF. То есть подготовка к инцидентам распределена по функциям Govern, Identify и Protect, а само обнаружение, реагирование и восстановление соответствуют функциям Detect, Respond и Recover. Смысл изменения в том, что реагирование это не изолированный процесс команды SOC, а часть работы всей организации.<\\/p>\\n<p>На практике сама последовательность действий остаётся знакомой: быть готовыми заранее (план, роли, контакты, инструменты, журналы), обнаружить и понять масштаб, сдержать, убрать присутствие атакующего, восстановить работу и проверить, что он не вернулся, разобрать инцидент и улучшить защиту. Хороший ответ на собеседовании показывает, что вы знаете про Rev. 3.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r3/final","https://csrc.nist.gov/pubs/sp/800/61/r2/final","https://www.nist.gov/cyberframework"]},{"id":155,"num":156,"category":"Blue team и SOC","text":"Какие бывают стратегии сдерживания инцидента?","answer":"<p>Цель сдерживания это остановить распространение и ущерб, выиграв время на расследование и устранение. Варианты: изоляция хоста через EDR (сетевая связь остаётся только с консолью), перевод в карантинный VLAN, блокировка адресов и доменов на межсетевом экране и прокси, отключение или блокировка учётных записей, сброс паролей и отзыв сессий и токенов, отключение скомпрометированного сервиса или интеграции.<\\/p>\\n<p>Выбор всегда компромисс, и NIST подчёркивает, что критерии стоит определить заранее: влияние на бизнес, необходимость сохранить улики, время и ресурсы, эффективность меры. Изоляция критичного производственного сервера может стоить бизнесу больше, чем сама атака. А слишком ранние и шумные действия могут спугнуть атакующего: он поймёт, что обнаружен, и либо ускорится (например запустит шифрование), либо уйдёт через другие точки закрепления, которые вы ещё не нашли.<\\/p>\\n<p>Поэтому при подозрении на целенаправленную атаку разумно сначала понять масштаб и все точки присутствия, а потом одновременно их отрезать. При быстро распространяющемся вредоносе, например шифровальщике, наоборот, изолировать немедленно. И до сдерживания, по возможности, собрать изменчивые данные, прежде всего память.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/61/r2/final","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":156,"num":157,"category":"Blue team и SOC","text":"Какие метрики используют для оценки работы SOC?","answer":"<p>Основные временные метрики. MTTD (mean time to detect): среднее время от начала вредоносной активности до её обнаружения. MTTR: среднее время реагирования или восстановления, важно заранее договориться, что именно измеряется, потому что под этой аббревиатурой понимают разное. Также время до первого действия аналитика по алерту (time to triage) и время до сдерживания.<\\/p>\\n<p>Метрики качества: доля ложных срабатываний по каждому правилу, доля алертов, эскалированных на следующую линию и подтверждённых там, покрытие техник ATT&amp;CK проверенными правилами, покрытие активов сбором журналов и EDR. Метрики нагрузки: число алертов на аналитика за смену, доля алертов, обработанных автоматически.<\\/p>\\n<p>Предостережение: метрики легко превращаются в цель. Если оценивать аналитиков по скорости закрытия алертов, они начнут закрывать быстро, а не правильно. Число инцидентов само по себе тоже плохая метрика: рост может означать как ухудшение, так и то, что мы стали лучше видеть. Лучше смотреть на совокупность и на результаты учений, где известно, что атака была.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/55/v1/final","https://www.mitre.org/sites/default/files/2022-04/11-strategies-of-a-world-class-cybersecurity-operations-center.pdf"]},{"id":157,"num":158,"category":"Blue team и SOC","text":"Что такое honeytokens и технологии обмана (deception)?","answer":"<p>Deception это размещение в среде приманок, с которыми легитимные пользователи и системы никогда не взаимодействуют. Любое обращение к приманке почти наверняка означает атакующего, поэтому такие сигналы дают очень мало ложных срабатываний, в отличие от большинства правил.<\\/p>\\n<p>Примеры: honeypot-сервер, который выглядит как интересная цель; фальшивая учётная запись администратора, вход под которой вызывает алерт; учётная запись с SPN как приманка для Kerberoasting; фальшивые ключи доступа облака в конфигурационном файле, использование которых сразу видно в журналах облака; документ с «паролями» на общем ресурсе, открытие которого отправляет сигнал; записи в базе, которые не должны нигде появляться.<\\/p>\\n<p>Honeytokens особенно ценны против атакующих, которые уже внутри и ведут разведку, то есть против того, что хуже всего ловится периметровой защитой. Условия успеха: приманки должны выглядеть правдоподобно, о них должен знать очень узкий круг людей, а сигнал от них должен приходить в SOC с высоким приоритетом. MITRE Engage описывает использование обмана как стратегию противодействия.<\\/p>","sources":["https://engage.mitre.org/","https://csrc.nist.gov/glossary/term/honeypot"]},{"id":158,"num":159,"category":"Blue team и SOC","text":"EDR сообщил, что процесс читает память LSASS. Ваши действия?","answer":"<p>LSASS хранит в памяти учётные данные вошедших пользователей, и чтение его памяти посторонним процессом это классический признак кражи учётных данных, например mimikatz или создание дампа через <code>procdump<\\/code> или <code>comsvcs.dll<\\/code>. В ATT&amp;CK это подтехника LSASS Memory. Алерт приоритетный, потому что успешная кража даёт атакующему учётки для перемещения по сети.<\\/p>\\n<p>Сначала быстро проверяю, не легитимная ли это активность: какой процесс (путь, подпись, хеш), кто родитель, какая командная строка, от чьего имени запущен. Некоторые защитные и диагностические средства тоже обращаются к LSASS, но они известны и подписаны. Если процесс неизвестен, запущен из временного каталога, через <code>rundll32<\\/code> с <code>comsvcs.dll<\\/code>, или создан файл дампа, это инцидент.<\\/p>\\n<p>Дальше: изолировать хост через EDR, собрать артефакты, прежде всего образ памяти и файл дампа, если он есть. Определить, какие учётные записи были активны на хосте, значит потенциально скомпрометированы, и приоритетно сбросить их пароли, особенно привилегированных, и отозвать сессии. Искать использование этих учёток на других хостах и разбираться, как атакующий получил права администратора на этом хосте. Профилактика на будущее: Credential Guard, защита LSASS как PPL, правила ASR, отсутствие привилегированных входов на рабочие станции.<\\/p>","sources":["https://attack.mitre.org/techniques/T1003/001/","https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection","https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon"]},{"id":159,"num":160,"category":"Blue team и SOC","text":"В сети обнаружен шифровальщик. Что вы делаете в первые часы?","answer":"<p>Первое это остановить распространение: изолировать затронутые хосты через EDR или отключить от сети, но не выключать питание, потому что в памяти могут быть ключи и артефакты. При быстром распространении допустимо изолировать целые сегменты. Одновременно собрать команду реагирования по заранее подготовленному плану и сообщить руководству, юристам и, где требуется, регуляторам и правоохранительным органам. Руководство CISA по шифровальщикам содержит подробный чек-лист таких действий.<\\/p>\\n<p>Второе это защитить то, что позволит восстановиться: проверить, что резервные копии отделены от сети и не зашифрованы, приостановить синхронизации, которые могут размножить зашифрованные файлы, защитить контроллеры домена и системы управления резервным копированием, потому что атакующие целенаправленно атакуют именно их.<\\/p>\\n<p>Третье это масштаб и путь проникновения: какой вариант шифровальщика (по записке и расширению файлов), какие хосты затронуты, как атакующий попал внутрь и какие учётки использовал, были ли данные выведены до шифрования. Сбросить пароли скомпрометированных и привилегированных учёток, включая <code>krbtgt<\\/code> дважды. Восстанавливаться только после того, как понятно, что присутствие атакующего устранено, иначе восстановленные системы зашифруют снова.<\\/p>","sources":["https://www.cisa.gov/stopransomware/ransomware-guide","https://attack.mitre.org/techniques/T1486/"]},{"id":160,"num":161,"category":"GRC и compliance","text":"Что такое GRC и чем занимается специалист по GRC?","answer":"<p>GRC это Governance, Risk, Compliance: управление, риски и соответствие требованиям. Governance отвечает за то, кто принимает решения о безопасности, какие есть политики, роли и отчётность перед руководством. Risk это выявление, оценка и обработка рисков информационной безопасности. Compliance это соответствие внешним требованиям (законы, регуляторы, стандарты, договоры с клиентами) и внутренним политикам.<\\/p>\\n<p>Специалист по GRC пишет и поддерживает политики и стандарты, ведёт реестр рисков, организует оценку рисков, готовит компанию к аудитам (ISO 27001, PCI DSS, требования регулятора), управляет исключениями, оценивает поставщиков, собирает метрики для руководства. Он работает на стыке технической безопасности, юристов и бизнеса.<\\/p>\\n<p>Хороший GRC не про бумаги ради бумаг. Задача в том, чтобы связать технические меры с бизнес-рисками: руководство должно понимать, какие риски у компании есть, сколько стоит их снижение и какие риски оно сознательно принимает. Мой опыт в банковском комплаенсе и праве здесь напрямую применим: регуляторные требования, расследования, работа с аудиторами.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/39/final","https://www.nist.gov/cyberframework"]},{"id":161,"num":162,"category":"GRC и compliance","text":"Чем отличаются политика, стандарт, процедура и руководство?","answer":"<p>Это уровни документов, от общего к конкретному. Политика это высокоуровневое заявление руководства о целях и принципах: «доступ к информации предоставляется по принципу наименьших привилегий». Она утверждается руководством, меняется редко и обязательна для всех.<\\/p>\\n<p>Стандарт делает политику измеримой и обязательной в деталях: «пароли не короче 15 символов», «шифрование дисков на всех ноутбуках», «TLS не ниже 1.2». Процедура описывает пошаговые действия для конкретной задачи: как выдать доступ новому сотруднику, как отозвать доступ при увольнении. Руководство (guideline) содержит рекомендации, которые не обязательны, но помогают, например советы по выбору парольной фразы.<\\/p>\\n<p>Иерархия важна по двум причинам. Руководство утверждает только политику, а технические детали можно обновлять без его участия. И аудитор проверяет цепочку: есть политика, есть стандарт, который её реализует, есть процедура, и есть свидетельства, что процедура реально выполняется. В ISO/IEC 27002:2022 первая же мера организационного раздела посвящена политикам информационной безопасности.<\\/p>","sources":["https://www.iso.org/standard/75652.html","https://csrc.nist.gov/glossary/term/policy"]},{"id":162,"num":163,"category":"GRC и compliance","text":"Что такое ISO/IEC 27001 и как он устроен?","answer":"<p>ISO/IEC 27001 это международный стандарт требований к системе управления информационной безопасностью (СУИБ, ISMS). Актуальная редакция ISO/IEC 27001:2022, третья, с поправкой Amd 1:2024 про учёт изменения климата. По этому стандарту организации проходят сертификацию.<\\/p>\\n<p>Основная часть стандарта это требования к самой системе управления, построенные по общей для стандартов систем менеджмента структуре. Начинается она с контекста организации (раздел 4: понять организацию, заинтересованные стороны, определить область действия СУИБ) и лидерства (раздел 5: обязательства руководства, политика, роли), затем идут планирование с оценкой и обработкой рисков, обеспечение ресурсами, работа системы, оценка результативности и улучшение. Суть в цикле: оценили риски, выбрали меры, внедрили, измерили, улучшили.<\\/p>\\n<p>Кроме этого есть Annex A с перечнем мер безопасности. В редакции 2022 года текст стандарта согласован с ISO/IEC 27002:2022, где эти меры описаны подробно. Важно, что стандарт не требует внедрить все меры Annex A подряд: организация выбирает меры на основе оценки рисков и обосновывает выбор в Statement of Applicability.<\\/p>","sources":["https://www.iso.org/standard/27001","https://www.iso.org/obp/ui/en/#iso:std:iso-iec:27001:ed-3:v1:en"]},{"id":163,"num":164,"category":"GRC и compliance","text":"Чем ISO/IEC 27001 отличается от ISO/IEC 27002?","answer":"<p>ISO/IEC 27001 содержит требования к системе управления информационной безопасностью. Это нормативный документ со словом «shall»: по нему проводится сертификационный аудит, и на соответствие ему компания может получить сертификат.<\\/p>\\n<p>ISO/IEC 27002 это руководство по мерам безопасности. Для каждой меры в нём описаны цель, рекомендации по внедрению и дополнительная информация. Сертифицироваться по 27002 нельзя, это справочник, который помогает правильно реализовать меры, перечисленные в Annex A стандарта 27001. Актуальная редакция ISO/IEC 27002:2022, и в ней меры сгруппированы по разделам, первый из которых посвящён организационным мерам: политики, роли и ответственность, разделение обязанностей и так далее. Также в редакции 2022 года мерам присвоены атрибуты, позволяющие фильтровать их по разным срезам.<\\/p>\\n<p>Проще говоря, 27001 отвечает на вопрос, что должно быть в системе управления и что проверит аудитор, а 27002 на вопрос, как реализовать конкретную меру. Есть и другие стандарты семейства, например ISO/IEC 27005 про управление рисками информационной безопасности.<\\/p>","sources":["https://www.iso.org/standard/27001","https://www.iso.org/standard/75652.html","https://www.iso.org/obp/ui/en/#iso:std:iso-iec:27002:ed-3:v2:en"]},{"id":164,"num":165,"category":"GRC и compliance","text":"Что такое Statement of Applicability (SoA)?","answer":"<p>Statement of Applicability, заявление о применимости, это обязательный документ в СУИБ по ISO/IEC 27001. В нём по каждой мере из Annex A указано, применяется ли она в организации, почему (обоснование включения, обычно ссылка на риск, закон или договор), внедрена ли она, и если мера исключена, то почему.<\\/p>\\n<p>SoA связывает оценку рисков с конкретными мерами. Аудитор использует его как карту: берёт меру, отмеченную как внедрённая, и просит показать свидетельства её работы. Берёт исключённую меру и проверяет, что обоснование исключения убедительно, например «у компании нет собственной разработки ПО» для мер безопасной разработки.<\\/p>\\n<p>Частая ошибка в том, чтобы относиться к SoA как к формальной таблице, заполненной один раз для сертификации. На деле его нужно пересматривать при изменении рисков, области действия СУИБ или состава мер, иначе на надзорном аудите он разойдётся с реальностью. Требование к SoA входит в раздел стандарта про обработку рисков.<\\/p>","sources":["https://www.iso.org/standard/27001"]},{"id":165,"num":166,"category":"GRC и compliance","text":"Что такое NIST Cybersecurity Framework 2.0?","answer":"<p>NIST CSF это добровольный фреймворк для управления рисками кибербезопасности, который не привязан к отрасли и размеру организации. Версия 2.0 вышла в 2024 году. Главное изменение по сравнению с 1.1 это новая шестая функция Govern, и расширение области применения на любые организации, а не только критическую инфраструктуру.<\\/p>\\n<p>Шесть функций: Govern (стратегия, роли, политики, управление рисками цепочки поставок), Identify (активы, риски, возможности улучшения), Protect (меры защиты), Detect (обнаружение), Respond (реагирование на инциденты), Recover (восстановление). Каждая функция делится на категории и подкатегории, это конкретные желаемые результаты. Фреймворк описывает результаты, а не способы, поэтому для конкретных мер его связывают с каталогами вроде NIST SP 800-53 или ISO 27001.<\\/p>\\n<p>Практически CSF используют через профили: текущий профиль (как есть) и целевой профиль (как нужно), разница между ними даёт план работ. Уровни (tiers) описывают зрелость управления рисками. Кстати, новая редакция руководства по реагированию на инциденты NIST SP 800-61r3 построена именно как профиль CSF 2.0, где все шесть функций участвуют в реагировании.<\\/p>","sources":["https://www.nist.gov/cyberframework","https://nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.29.pdf","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":166,"num":167,"category":"GRC и compliance","text":"Что такое NIST SP 800-53?","answer":"<p>NIST SP 800-53 это каталог мер безопасности и приватности для информационных систем и организаций. Актуальная версия это Revision 5 с обновлениями. Изначально он создавался для федеральных систем США, но широко используется как подробный справочник мер во всём мире.<\\/p>\\n<p>Меры сгруппированы в семейства с двухбуквенными кодами: AC (управление доступом), AU (аудит и подотчётность), CM (управление конфигурацией), IA (идентификация и аутентификация), IR (реагирование на инциденты), RA (оценка рисков), SC (защита систем и коммуникаций), SI (целостность систем и информации), SR (управление рисками цепочки поставок) и другие. У мер есть усиления (enhancements) для более строгих требований.<\\/p>\\n<p>Отдельный документ SP 800-53B задаёт базовые наборы мер для систем с низким, умеренным и высоким уровнем воздействия, который определяется по категоризации из FIPS 199. В отличие от CSF, который описывает желаемые результаты, 800-53 описывает конкретные меры, поэтому их часто используют вместе: CSF для стратегии и общения с руководством, 800-53 для реализации.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","https://csrc.nist.gov/pubs/sp/800/53/b/upd1/final"]},{"id":167,"num":168,"category":"GRC и compliance","text":"Что такое PCI DSS и кому он нужен?","answer":"<p>PCI DSS (Payment Card Industry Data Security Standard) это стандарт безопасности данных платёжных карт, который поддерживает PCI Security Standards Council. Он распространяется на организации, которые хранят, обрабатывают или передают данные держателей карт или чувствительные данные аутентификации: торговцев, процессинговые центры, банки, сервис-провайдеров. Требование исходит от платёжных систем через договоры, а не от закона.<\\/p>\\n<p>Актуальная версия это PCI DSS v4.0.1. По данным PCI SSC, версия 4.0 выведена из действия 31 декабря 2024 года, после чего v4.0.1 стала единственной действующей версией. Стандарт содержит технические и операционные требования: сетевая защита, защита хранимых данных, шифрование при передаче, управление уязвимостями, контроль доступа, журналирование и мониторинг, тестирование безопасности, политики.<\\/p>\\n<p>Ключевое понятие это область действия (scope): все системы, которые хранят, обрабатывают или передают данные карт, и всё, что с ними связано. Главный способ снизить стоимость соответствия это уменьшить область: не хранить номер карты вообще, использовать токенизацию, выносить приём карт к сертифицированному провайдеру, изолировать сегмент с картами сегментацией сети.<\\/p>","sources":["https://www.pcisecuritystandards.org/standards/pci-dss/","https://blog.pcisecuritystandards.org/just-published-pci-dss-v4-0-1"]},{"id":168,"num":169,"category":"GRC и compliance","text":"Как проводится оценка рисков информационной безопасности?","answer":"<p>Процесс по NIST SP 800-30 включает подготовку (цель, область, допущения, модель рисков), саму оценку, доведение результатов до лиц, принимающих решения, и поддержание оценки в актуальном состоянии. Сама оценка это определение источников угроз и событий, уязвимостей и предрасполагающих условий, вероятности того, что угроза реализуется, и тяжести последствий, а из них уровня риска.<\\/p>\\n<p>Подходы бывают качественные, когда вероятность и последствия оцениваются по шкале «низкий, средний, высокий» и сводятся в матрицу рисков, и количественные, когда риск выражается в деньгах. В количественном подходе используют понятие ожидаемых годовых потерь (Annualized Loss Expectancy, ALE), оно есть в глоссарии NIST. Качественный подход быстрее и понятнее, количественный лучше для обоснования бюджета, но требует данных, которых часто нет.<\\/p>\\n<p>На практике я начинаю с активов, которые важнее всего для бизнеса, и сценариев, которые реально могут произойти: утечка персональных данных клиентов, шифровальщик в производственной сети, компрометация платёжного процесса. Результат оформляется в реестр рисков с владельцем каждого риска, и главное здесь не точность цифр, а то, что руководство видит риски и принимает по ним решения.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/30/r1/final","https://csrc.nist.gov/glossary/term/annualized_loss_expectancy"]},{"id":169,"num":170,"category":"GRC и compliance","text":"Какие есть варианты обработки риска?","answer":"<p>NIST SP 800-39 описывает варианты реагирования на риск: принять риск, избежать его, снизить, разделить или передать. Снижение означает внедрение мер, которые уменьшают вероятность или последствия. Избежание означает отказ от деятельности, которая порождает риск, например не хранить номера карт вообще. Передача или разделение означает перенос части последствий на другую сторону через страхование или договор с поставщиком. Принятие означает осознанное решение жить с риском, потому что он в пределах допустимого или снижение стоит дороже возможного ущерба.<\\/p>\\n<p>Решение о принятии риска принимает не специалист по безопасности, а владелец риска с достаточными полномочиями, обычно руководитель бизнес-направления. Задача безопасности в том, чтобы он принимал это решение осознанно, понимая последствия, и чтобы решение было задокументировано со сроком пересмотра.<\\/p>\\n<p>Отдельные понятия: риск-аппетит (сколько риска организация готова принять ради своих целей), остаточный риск (что осталось после внедрения мер) и реестр рисков, где для каждого риска зафиксированы оценка, владелец, выбранная обработка, меры и сроки. Важно помнить, что передача через страхование не передаёт репутационный ущерб и ответственность перед регулятором.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/39/final","https://csrc.nist.gov/pubs/sp/800/30/r1/final"]},{"id":170,"num":171,"category":"GRC и compliance","text":"Какие бывают типы мер безопасности (контролей)?","answer":"<p>По функции меры делят
