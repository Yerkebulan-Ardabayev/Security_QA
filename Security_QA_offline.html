на превентивные (не дают инциденту случиться: MFA, межсетевой экран, разграничение доступа), детективные (обнаруживают, что что-то происходит: журналы, SIEM, IDS, сверки), корректирующие (устраняют последствия и восстанавливают: резервные копии, план восстановления, процесс реагирования). Иногда выделяют сдерживающие (предупреждения, камеры) и компенсирующие меры, которые применяются, когда основную меру внедрить нельзя.<\\/p>\\n<p>По природе меры делят на административные или организационные (политики, обучение, разделение обязанностей, проверка персонала), технические (шифрование, контроль доступа, журналирование) и физические (замки, пропуска, охрана, защита ЦОДа). В ISO/IEC 27002:2022 меры тоже сгруппированы по похожему принципу, а атрибуты позволяют отметить, превентивная мера, детективная или корректирующая.<\\/p>\\n<p>Смысл классификации в том, чтобы проверить сбалансированность защиты. Если все меры превентивные, то при их обходе атаку никто не заметит. Если есть только обнаружение, то мы будем видеть все атаки, но ничего не сможем с ними сделать. Для важного риска должны быть меры нескольких типов.<\\/p>","sources":["https://csrc.nist.gov/glossary/term/security_control","https://www.iso.org/standard/75652.html"]},{"id":171,"num":172,"category":"GRC и compliance","text":"Что такое BIA, RTO и RPO?","answer":"<p>BIA (Business Impact Analysis, анализ воздействия на бизнес) это оценка того, какие бизнес-процессы и системы критичны и что произойдёт при их простое: финансовые потери, нарушение обязательств перед клиентами и регулятором, репутационный ущерб. По результатам BIA определяются приоритеты восстановления и требования к нему. NIST SP 800-34 описывает BIA как основу планирования непрерывности информационных систем.<\\/p>\\n<p>RTO (Recovery Time Objective) это максимально допустимое время восстановления системы после сбоя. RPO (Recovery Point Objective) по определению NIST это момент времени, на который должны быть восстановлены данные после сбоя, то есть допустимая потеря данных. Если RPO один час, резервные копии или репликация должны обеспечивать потерю не больше часа данных.<\\/p>\\n<p>Эти значения задаёт бизнес, а технологии выбираются под них: RPO близкий к нулю требует синхронной репликации, RTO в минуты требует горячего резерва. Обратная связь тоже важна: если требования бизнеса стоят неприемлемо дорого, это обсуждается. И главное, план восстановления должен регулярно проверяться учениями, иначе цифры RTO и RPO остаются на бумаге.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final","https://csrc.nist.gov/glossary/term/recovery_point_objective","https://csrc.nist.gov/glossary/term/recovery_time_objective"]},{"id":172,"num":173,"category":"GRC и compliance","text":"Как управлять рисками поставщиков и третьих сторон?","answer":"<p>Поставщик, у которого есть доступ к вашим данным или системам, становится частью вашей поверхности атаки. Многие крупные инциденты начинались именно с подрядчика: у него слабее защита, а доступ к клиенту широкий. Поэтому в CIS Controls есть отдельная мера Service Provider Management, а NIST SP 800-161 посвящён управлению рисками цепочки поставок.<\\/p>\\n<p>Процесс: инвентарь поставщиков и классификация по критичности (к каким данным и системам есть доступ, насколько бизнес от них зависит). Для критичных поставщиков оценка до заключения договора: анкеты безопасности, сертификаты (ISO 27001, отчёт SOC 2), при необходимости аудит. Требования безопасности в договоре: защита данных, уведомление об инцидентах в оговорённый срок, право на аудит, место хранения данных, порядок возврата и удаления данных при расторжении.<\\/p>\\n<p>И дальше непрерывно, а не один раз: пересмотр оценки по расписанию, мониторинг доступа поставщика (минимальные права, отдельные учётки, MFA, журналирование), отзыв доступа при окончании работ. Для казахстанских компаний сюда добавляется проверка, где поставщик хранит персональные данные, из-за требования закона о хранении на территории РК.<\\/p>","sources":["https://www.cisecurity.org/controls/cis-controls-list","https://csrc.nist.gov/pubs/sp/800/161/r1/upd1/final"]},{"id":173,"num":174,"category":"GRC и compliance","text":"Зачем нужна классификация данных?","answer":"<p>Классификация данных распределяет информацию по уровням чувствительности, чтобы защищать её соразмерно: нельзя одинаково строго защищать всё подряд, это слишком дорого, и нельзя защищать всё одинаково слабо. Типичная схема для компании: публичная, внутренняя, конфиденциальная, строго конфиденциальная. Для персональных данных, банковской и коммерческой тайны уровни часто задаёт закон.<\\/p>\\n<p>В федеральном подходе США категоризация идёт по FIPS 199: для каждого типа информации оценивается возможное воздействие (низкое, умеренное, высокое) на конфиденциальность, целостность и доступность. От уровня системы зависит набор обязательных мер.<\\/p>\\n<p>Практическая польза проявляется, когда к каждому уровню привязаны правила: где можно хранить, шифровать ли, кому можно передавать, можно ли отправлять по почте наружу, как уничтожать. Без привязанных правил классификация бесполезна. И у каждого набора данных должен быть владелец, который определяет его класс, иначе классификацию никто не поддерживает. DLP-системы опираются на классификацию, чтобы понимать, какие данные нельзя выпускать наружу.<\\/p>","sources":["https://csrc.nist.gov/pubs/fips/199/final","https://www.cisecurity.org/controls/cis-controls-list"]},{"id":174,"num":175,"category":"GRC и compliance","text":"Чем аудит отличается от оценки, что такое SOC 2?","answer":"<p>Аудит это формальная проверка на соответствие заранее определённым критериям (стандарту, закону, политике) с выводом, который используют третьи стороны: сертификат ISO 27001, отчёт для регулятора, отчёт для клиентов. Аудитор должен быть независимым и опирается на свидетельства. Оценка (assessment) шире и менее формальна: её цель найти слабые места и дать рекомендации, например оценка зрелости, оценка рисков или пентест.<\\/p>\\n<p>Аудиты бывают внутренние, которые организация проводит сама или силами нанятой стороны для себя, и внешние, результат которых нужен кому-то снаружи. ISO 27001 требует проводить внутренние аудиты СУИБ.<\\/p>\\n<p>SOC 2 это отчёт аудитора по стандартам AICPA об оценке контролей в сервисной организации. Он особенно распространён среди SaaS-компаний, поставляющих услуги в США. Название руководства AICPA перечисляет категории критериев: безопасность (Security), доступность (Availability), целостность обработки (Processing Integrity), конфиденциальность (Confidentiality) и приватность (Privacy). В отличие от ISO 27001, это не сертификат, а отчёт, который клиент читает сам и делает выводы.<\\/p>","sources":["https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services","https://www.iso.org/standard/27001"]},{"id":175,"num":176,"category":"GRC и compliance","text":"Что нужно знать о GDPR специалисту по безопасности?","answer":"<p>GDPR (Регламент ЕС 2016/679) регулирует обработку персональных данных людей в ЕС. Он применяется и к компаниям за пределами ЕС, если они предлагают товары или услуги людям в ЕС или отслеживают их поведение. Поэтому казахстанская компания с клиентами из ЕС может попасть под его действие.<\\/p>\\n<p>Для безопасности важны несколько положений. Требование обеспечить уровень безопасности, соответствующий риску, с примерами мер: псевдонимизация, шифрование, обеспечение конфиденциальности, целостности, доступности и устойчивости, регулярное тестирование мер. Принцип защиты данных при проектировании и по умолчанию. Уведомление надзорного органа об утечке персональных данных без неоправданной задержки и, где возможно, не позднее 72 часов с момента, когда о ней стало известно.<\\/p>\\n<p>Штрафы за нарушение ряда положений, включая основные принципы обработки, по статье 83 могут достигать 20 миллионов евро или 4 процентов общемирового годового оборота за предыдущий финансовый год, в зависимости от того, что больше. Для сравнения с казахстанским законом стоит помнить, что там срок уведомления уполномоченного органа об утечке намного короче.<\\/p>","sources":["https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng"]},{"id":176,"num":177,"category":"GRC и compliance","text":"Что такое CIS Controls?","answer":"<p>CIS Critical Security Controls это приоритизированный набор мер безопасности от Center for Internet Security. Актуальная версия v8.1 содержит 18 мер: от инвентаризации корпоративных активов и программного обеспечения, защиты данных и безопасной конфигурации, через управление учётными записями и доступом, управление уязвимостями, журналирование, защиту почты и браузеров, защиту от вредоносного ПО, восстановление данных, до обучения персонала, управления поставщиками, безопасности приложений, реагирования на инциденты и тестирования на проникновение.<\\/p>\\n<p>Каждая мера разбита на конкретные защитные действия (safeguards), а они распределены по группам внедрения (Implementation Groups). Первая группа это базовая гигиена, минимум для любой организации. Вторая и третья добавляют меры для организаций с большими ресурсами и более высокими рисками.<\\/p>\\n<p>Сильная сторона CIS Controls в практичности: это конкретный план, с чего начинать, особенно для небольших компаний без выделенной команды безопасности. Порядок мер не случаен: нельзя защитить то, о чём не знаешь, поэтому первые две меры про инвентаризацию. Для CIS Controls есть сопоставления с NIST CSF, ISO 27001 и другими стандартами.<\\/p>","sources":["https://www.cisecurity.org/controls/cis-controls-list","https://www.cisecurity.org/controls/v8-1"]},{"id":177,"num":178,"category":"GRC и compliance","text":"Как построить программу повышения осведомлённости по безопасности?","answer":"<p>NIST SP 800-50 описывает построение программы обучения и повышения осведомлённости как жизненный цикл: анализ потребностей, разработка материалов, внедрение, оценка результатов и улучшение. Обучение должно различаться по ролям: всем сотрудникам базовые вещи, разработчикам безопасная разработка, администраторам безопасная эксплуатация, руководителям управление рисками, бухгалтерии защита от мошенничества с платежами.<\\/p>\\n<p>Что работает на практике: короткие регулярные материалы вместо одного длинного курса раз в год, примеры из реальных инцидентов своей отрасли, учебные фишинговые рассылки с разбором сразу после клика, и прежде всего простой способ сообщить о подозрительном письме. Метрика, на которую я бы смотрел, это не доля кликнувших, а доля сообщивших и время до первого сообщения, потому что именно это даёт SOC шанс остановить атаку.<\\/p>\\n<p>Важно не превращать программу в наказание: если за клик по учебному письму сотрудника публично стыдят, в следующий раз он не сообщит о настоящем, чтобы не признаваться. Обучение ежегодно по кибербезопасности для работников, кстати, прямо закреплено в законе РК о кибербезопасности как обязанность владельцев критически важных цифровых объектов.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/50/r1/final","https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":178,"num":179,"category":"GRC и compliance","text":"Как докладывать руководству о рисках безопасности?","answer":"<p>Руководству нужны не технические детали, а ответы на три вопроса: какие у нас главные риски для бизнеса, как они меняются и что нужно от них решить или выделить. Поэтому доклад строится вокруг рисков в терминах бизнеса («простой процессинга на сутки», «утечка базы клиентов с персональными данными и штраф по КоАП»), а не вокруг числа уязвимостей и алертов.<\\/p>\\n<p>Полезная структура: топ рисков с динамикой и владельцами, ключевые индикаторы риска (KRI) с порогами, например доля критичных уязвимостей старше срока исправления на внешних системах, доля учёток без MFA, результаты учений по восстановлению, статус крупных проектов снижения рисков и решения, которые требуются от руководства: принять риск, выделить бюджет, изменить приоритет. NIST в серии NISTIR 8286 описывает, как интегрировать риски кибербезопасности в общее управление рисками предприятия.<\\/p>\\n<p>Важно быть честным и последовательным: одни и те же метрики из квартала в квартал, объяснение причин ухудшения, отсутствие запугивания. Руководство, которое понимает риски, принимает решения, а руководство, которое пугают, либо перестаёт слушать, либо требует «сделать так, чтобы нас не взломали», что невыполнимо.<\\/p>","sources":["https://csrc.nist.gov/pubs/ir/8286/final","https://www.nist.gov/cyberframework"]},{"id":179,"num":180,"category":"GRC и compliance","text":"Что такое разделение обязанностей и зачем оно нужно?","answer":"<p>Разделение обязанностей (segregation of duties) означает, что критичная операция не может быть выполнена одним человеком от начала до конца. Классический пример из финансов: один сотрудник создаёт платёж, другой его утверждает. Тогда для мошенничества нужен сговор двух людей, а ошибка одного замечается другим. В ISO/IEC 27002:2022 это отдельная мера 5.3 Segregation of duties.<\\/p>\\n<p>В ИТ и безопасности примеры: разработчик не может сам задеплоить свой код в прод без ревью другого человека; администратор, который управляет системой, не может сам удалить или изменить журналы аудита этой системы; тот, кто запрашивает доступ, не может его сам себе одобрить; администраторы резервного копирования и администраторы продуктивных систем разные люди, чтобы один скомпрометированный человек не мог уничтожить и данные, и копии.<\\/p>\\n<p>В маленьких командах полное разделение не всегда возможно. Тогда используют компенсирующие меры: подробное журналирование действий с отправкой в систему, к которой у администратора нет доступа, регулярный независимый просмотр журналов, обязательное согласование особо критичных действий. Из моего банковского опыта это одна из мер, которую регуляторы проверяют в первую очередь.<\\/p>","sources":["https://www.iso.org/obp/ui/en/#iso:std:iso-iec:27002:ed-3:v2:en","https://csrc.nist.gov/glossary/term/separation_of_duty"]},{"id":180,"num":181,"category":"GRC и compliance","text":"Как управлять исключениями из политик безопасности?","answer":"<p>Исключения неизбежны: унаследованная система не поддерживает MFA, критичное приложение требует старую версию библиотеки, бизнесу срочно нужен доступ, противоречащий стандарту. Плохо не наличие исключений, а их бесконтрольность, когда временные разрешения живут годами и о них никто не помнит.<\\/p>\\n<p>Нормальный процесс: запрос на исключение с обоснованием и описанием риска; оценка риска и компенсирующих мер, например изоляция старой системы в отдельном сегменте и усиленный мониторинг; утверждение владельцем риска с достаточными полномочиями, а не специалистом по безопасности; обязательный срок действия; запись в реестр исключений; пересмотр по истечении срока с решением продлить, закрыть или устранить причину.<\\/p>\\n<p>Реестр исключений полезен и как источник информации о состоянии безопасности: если одно и то же требование постоянно нарушается, возможно, проблема в самом требовании, и его стоит пересмотреть. Аудиторы всегда смотрят на исключения: есть ли они в реестре, утверждены ли, не просрочены ли.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/39/final","https://csrc.nist.gov/pubs/sp/800/37/r2/final"]},{"id":181,"num":182,"category":"GRC и compliance","text":"Как вы будете готовить компанию к внешнему аудиту?","answer":"<p>Сначала определяю критерии и область: по какому стандарту или требованиям аудит, какие подразделения, системы и процессы в области, какой период проверяется. Затем провожу собственную оценку по тем же критериям, как это сделал бы аудитор: по каждому требованию есть ли политика или процедура, внедрена ли она, и главное, есть ли свидетельства того, что она работает (журналы, заявки, протоколы, отчёты, скриншоты настроек).<\\/p>\\n<p>Найденные несоответствия закрываю по приоритету, а то, что закрыть до аудита невозможно, честно оформляю: план устранения со сроками и ответственными. Аудиторы гораздо лучше относятся к известной и управляемой проблеме, чем к проблеме, которую пытались скрыть. Параллельно внутренний аудит, если его требует стандарт, как ISO 27001.<\\/p>\\n<p>Перед аудитом готовлю людей: кто будет отвечать на вопросы по каждой области, чтобы ответы были точными и подкреплены документами. Во время аудита веду журнал запросов аудитора и выданных материалов. После аудита работа не заканчивается: несоответствия закрываются корректирующими действиями с анализом причин, и лучше, чтобы сбор свидетельств был автоматизирован и шёл постоянно, а не авралом раз в год.<\\/p>","sources":["https://www.iso.org/standard/27001","https://www.iso.org/standard/77802.html"]},{"id":182,"num":183,"category":"GRC и compliance","text":"Какие законы Казахстана регулируют информационную безопасность и персональные данные?","answer":"<p>Основные акты. Закон РК «О персональных данных и их защите» от 21 мая 2013 года № 94-V: сбор, обработка, хранение и защита персональных данных, права субъектов, обязанности собственников и операторов. В 2026 году в него внесены существенные изменения законом от 24 июня 2026 года № 326-VIII: уведомление о начале обработки, классификация операторов по объёму данных, реестр нарушений безопасности персональных данных.<\\/p>\\n<p>Закон РК от 24 ноября 2015 года № 418-V, который раньше назывался «Об информатизации». В действующей редакции на adilet.zan.kz он называется «О кибербезопасности»: заголовок изменён законом от 9 января 2026 года № 256-VIII. Он регулирует защиту цифровых объектов, критически важные цифровые объекты, центры обеспечения кибербезопасности, единые требования в сферах цифровизации и обеспечения кибербезопасности. Это важная деталь: многие материалы и вакансии ещё используют старые названия.<\\/p>\\n<p>Ответственность устанавливает Кодекс РК об административных правонарушениях, статья 79 «Нарушение законодательства Республики Казахстан о персональных данных и их защите», а в тяжёлых случаях Уголовный кодекс. Для отдельных отраслей есть свои требования, например для банков, на которые закон о кибербезопасности прямо ссылается в части аудита.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://adilet.zan.kz/rus/docs/Z1500000418","https://adilet.zan.kz/rus/docs/K1400000235"]},{"id":183,"num":184,"category":"GRC и compliance","text":"Кто такие субъект, собственник, оператор и третье лицо по закону РК о персональных данных?","answer":"<p>Определения даны в статье 1 закона «О персональных данных и их защите». Субъект это «физическое лицо, к которому относятся персональные данные». Персональные данные это «сведения или совокупность сведений о субъекте персональных данных, дополненные одним или несколькими идентификаторами персональных данных».<\\/p>\\n<p>Собственник базы и (или) цифрового объекта, содержащего персональные данные, это государственный орган, физическое или юридическое лицо, которые реализуют право владения, пользования и распоряжения базой или цифровым объектом с персональными данными. Оператор это лицо, которое осуществляет «сбор, обработку и защиту персональных данных». Третье лицо это лицо, не являющееся субъектом, собственником или оператором, но связанное с ними обстоятельствами или правоотношениями по сбору, обработке и защите персональных данных, например подрядчик или облачный провайдер.<\\/p>\\n<p>Практически важно, что обязанности по защите закон возлагает и на собственника, и на оператора, и на третье лицо. Статья 22 прямо называет их всех, поэтому передача обработки подрядчику не снимает ответственности, а договор с ним должен описывать меры защиты. Обратите внимание, что в определениях закона теперь используется термин «цифровой объект».<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":184,"num":185,"category":"GRC и compliance","text":"Какие требования к согласию на обработку персональных данных в РК?","answer":"<p>Порядок согласия установлен статьёй 8 закона «О персональных данных и их защите». Субъект или его законный представитель даёт и отзывает согласие «письменно, посредством государственного сервиса, негосударственного сервиса либо иным способом, позволяющим подтвердить получение согласия». Для данных в цифровых объектах государственных органов согласие предоставляется через государственный сервис.<\\/p>\\n<p>Пункт 4 статьи 8 перечисляет, что включает согласие: наименование и БИН (ИИН) собственника или оператора, ФИО субъекта, срок действия согласия, сведения о возможности передачи третьим лицам, о наличии или отсутствии трансграничной передачи, о возможности распространения в общедоступных источниках, перечень собираемых данных и иные сведения. Срок действия согласия не может превышать срок, необходимый для достижения целей обработки.<\\/p>\\n<p>Субъект вправе отозвать согласие, и тогда, по пункту 7, «в течение пятнадцати рабочих дней» собственник, оператор или третье лицо обязаны прекратить обработку, если её не требует законодательство, либо дать мотивированный отказ. Отозвать согласие нельзя, если это противоречит законам или есть неисполненное обязательство. Для специалиста по безопасности отсюда следует требование к системам: согласие должно храниться с доказательством его получения, а отзыв должен реально останавливать обработку во всех системах.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":185,"num":186,"category":"GRC и compliance","text":"Что требует закон РК о месте хранения персональных данных?","answer":"<p>Пункт 2 статьи 12 закона «О персональных данных и их защите» устанавливает: «Хранение персональных данных осуществляется собственником и (или) оператором, а также третьим лицом в базе и (или) цифровом объекте, которые находятся на территории Республики Казахстан». Это требование локализации: база с персональными данными должна физически находиться в Казахстане.<\\/p>\\n<p>Тот же пункт определяет срок хранения: он определяется датой достижения целей сбора и обработки, если иное не предусмотрено законодательством. То есть хранить данные «на всякий случай» бессрочно закон не позволяет.<\\/p>\\n<p>Для архитектуры это означает, что основная база персональных данных казахстанских клиентов должна размещаться в ЦОДе или облачном регионе на территории РК, и это нужно учитывать при выборе облачного провайдера и SaaS-сервисов, включая бэкапы, реплики и журналы с персональными данными. Трансграничная передача регулируется отдельно статьёй 16, и её допустимость не отменяет требования хранить базу в РК. В уведомлении о начале обработки по статье 10-1 оператор тоже указывает место нахождения базы.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":186,"num":187,"category":"GRC и compliance","text":"Когда в Казахстане допускается трансграничная передача персональных данных?","answer":"<p>Статья 16 закона «О персональных данных и их защите» определяет трансграничную передачу как «передача персональных данных на территорию иностранных государств». По пункту 2 она осуществляется только в случае обеспечения этими государствами защиты персональных данных.<\\/p>\\n<p>В государства, не обеспечивающие защиту, передача по пункту 3 возможна в случаях: согласия субъекта или его законного представителя на трансграничную передачу; если это предусмотрено ратифицированными Казахстаном международными договорами; если это предусмотрено законами и необходимо для защиты конституционного строя, общественного порядка, прав и свобод граждан, здоровья и нравственности населения; для защиты конституционных прав и свобод, если получить согласие невозможно. Пункт 4 допускает, что передача может быть запрещена или ограничена законами.<\\/p>\\n<p>Практически для компании самый частый путь это согласие, поэтому сведения о наличии или отсутствии трансграничной передачи обязательно включаются в согласие по пункту 4 статьи 8. При использовании зарубежных SaaS-сервисов (почта, CRM, аналитика, поддержка) нужно проверить, какие персональные данные туда уходят, и помнить, что это не отменяет требования статьи 12 о хранении базы в РК.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":187,"num":188,"category":"GRC и compliance","text":"Что делать при утечке персональных данных по закону РК?","answer":"<p>Подпункт 8 пункта 2 статьи 25 закона «О персональных данных и их защите» обязывает собственника или оператора в течение одного рабочего дня «c момента обнаружения нарушения безопасности персональных данных уведомить уполномоченный орган о таком нарушении с указанием контактных данных лица, ответственного за организацию обработки персональных данных (при наличии)». Это намного жёстче, чем 72 часа в GDPR.<\\/p>\\n<p>Само нарушение безопасности персональных данных определено в статье 1 как нарушение защиты, повлёкшее незаконное распространение, изменение, уничтожение и удаление, несанкционированное распространение данных или несанкционированный доступ к ним. С 2026 года статья 23-2 предусматривает реестр нарушений безопасности персональных данных, который ведёт уполномоченный орган, в том числе на основе информации от центров кибербезопасности.<\\/p>\\n<p>Для процесса реагирования это значит, что в плане реагирования на инциденты заранее должны быть: критерии, когда инцидент считается нарушением безопасности персональных данных, ответственный за уведомление, шаблон уведомления и контакт уполномоченного органа. За один рабочий день провести полное расследование невозможно, поэтому уведомление подаётся по первичным данным и дополняется позже. Статья 22 также требует мер по своевременному обнаружению несанкционированного доступа и минимизации его последствий.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":188,"num":189,"category":"GRC и compliance","text":"Что изменилось в законе РК о персональных данных в 2026 году?","answer":"<p>Законом от 24 июня 2026 года № 326-VIII в закон «О персональных данных и их защите» внесён ряд новых статей. Статья 10-1: собственник, оператор и третье лицо до начала и прекращения обработки обязаны уведомить уполномоченный орган, за исключением малых и средних. Уведомление содержит, среди прочего, применяемые меры защиты, сведения о трансграничной передаче, перечень данных и место нахождения базы, и эти сведения вносятся в реестр лиц, осуществляющих сбор и обработку персональных данных.<\\/p>\\n<p>Статья 25-1 вводит классификацию по объёму: малые обрабатывают данные не более десяти тысяч уникальных субъектов, средние от десяти до пятисот тысяч, крупные от пятисот тысяч. При обработке персональных данных ограниченного доступа категория повышается на один уровень, а меры защиты по категориям определяет уполномоченный орган. Статья 23-2 вводит реестр нарушений безопасности персональных данных, статья 23-1 добровольное киберстрахование.<\\/p>\\n<p>Для компании практический вывод: посчитать число уникальных субъектов во всех своих системах, определить категорию, понять, нужно ли уведомление, и следить за подзаконными актами уполномоченного органа, где будут конкретные меры по категориям.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":189,"num":190,"category":"GRC и compliance","text":"Какая ответственность предусмотрена в РК за нарушения в сфере персональных данных?","answer":"<p>Статья 29 закона «О персональных данных и их защите» отсылает к другим законам, а конкретные санкции установлены статьёй 79 Кодекса РК об административных правонарушениях. Штрафы исчисляются в месячных расчётных показателях (МРП) и зависят от субъекта: физическое лицо, должностное лицо, малый, средний или крупный бизнес.<\\/p>\\n<p>По частям статьи 79: часть 1 это незаконные сбор и (или) обработка персональных данных, для субъектов крупного предпринимательства штраф двести МРП. Часть 2 те же деяния с использованием служебного положения, для крупного бизнеса шестьсот МРП. Часть 3 это «несоблюдение собственником, оператором или третьим лицом мер по защите персональных данных», для крупного бизнеса шестьсот МРП. Часть 4 то же деяние, повлёкшее утерю, незаконный сбор или обработку персональных данных, для крупного бизнеса две тысячи МРП.<\\/p>\\n<p>Для специалиста по безопасности важна часть 3: штраф возможен за само несоблюдение мер защиты, даже без доказанной утечки, а если утечка произошла, санкция резко растёт. Если деяние содержит признаки уголовного правонарушения, применяется Уголовный кодекс. Это хороший аргумент в разговоре с руководством о бюджете на защиту персональных данных.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/K1400000235","https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":190,"num":191,"category":"GRC и compliance","text":"Какие обязанности у владельцев критически важных цифровых объектов в РК?","answer":"<p>Статья 18 закона РК № 418-V «О кибербезопасности» (прежнее название «Об информатизации») перечисляет обязанности собственника или владельца критически важных цифровых объектов. Он обязан создать собственный центр обеспечения кибербезопасности или приобрести его услуги у третьих лиц в установленном объёме; для объектов «цифрового правительства» подключить журналирование к системе мониторинга Национального координационного центра кибербезопасности; оповещать Национальный координационный центр кибербезопасности и свой центр обеспечения кибербезопасности о самостоятельно выявленных инцидентах; передавать резервные копии на единую национальную резервную платформу; ежегодно проводить обучение по кибербезопасности и киберкультуре для работников.<\\/p>\\n<p>Пункт 2 той же статьи: владельцы критически важных цифровых объектов, обрабатывающие данные с охраняемой законом тайной, проводят аудит кибербезопасности не реже одного раза в год, а для банков второго уровня аудит проводится по требованиям банковского законодательства.<\\/p>\\n<p>Кроме этого статья 54-1 устанавливает единые требования в сферах цифровизации и обеспечения кибербезопасности, которые утверждаются постановлением Правительства. Их положения о кибербезопасности обязательны для госорганов, квазигосударственного сектора, владельцев негосударственных цифровых объектов, интегрируемых с государственными, и владельцев критически важных цифровых объектов. На собеседовании в банк или госсектор РК эти понятия почти наверняка всплывут.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":191,"num":192,"category":"GRC и compliance","text":"Компания запускает SaaS для казахстанских клиентов в зарубежном облаке. Что вы проверите?","answer":"<p>Первое это персональные данные. Какие данные казахстанских субъектов будет обрабатывать сервис и где будет храниться база. Пункт 2 статьи 12 закона «О персональных данных и их защите» требует хранить базу и цифровой объект с персональными данными на территории РК, поэтому основную базу нужно размещать в казахстанском ЦОДе или облачном регионе, а в зарубежное облако выносить только то, что не содержит персональных данных, или обосновывать трансграничную передачу по статье 16, обычно через согласие.<\\/p>\\n<p>Второе это процессы по закону: форма согласия со всеми сведениями из пункта 4 статьи 8, включая трансграничную передачу; подсчёт уникальных субъектов для категории по статье 25-1 и, если компания крупная, уведомление уполномоченного органа по статье 10-1; процесс уведомления об утечке в течение одного рабочего дня по статье 25; назначение лица, ответственного за организацию обработки. Если клиенты сервиса банки или госорганы, добавляются отраслевые требования и, возможно, единые требования по статье 54-1 закона о кибербезопасности.<\\/p>\\n<p>Третье это техника и договоры: шифрование, управление доступом, журналирование, резервирование, договоры с облачным провайдером и субподрядчиками как с третьими лицами с описанием мер защиты. Результат я бы оформил как карту требований с владельцами и сроками и отдельно список решений, которые должно принять руководство, например выбор региона и бюджет. По юридической квалификации конкретных случаев, конечно, нужна консультация юриста, и здесь мой юридический опыт помогает говорить с ним на одном языке.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":192,"num":193,"category":"DFIR и форензика","text":"Что такое DFIR и чем форензика отличается от реагирования на инцидент?","answer":"<p>DFIR (Digital Forensics and Incident Response) объединяет две дисциплины, которые на практике работают вместе. Реагирование отвечает на вопрос, как остановить атаку и вернуть бизнес в строй: сдерживание, устранение, восстановление. Форензика отвечает на вопрос, что именно произошло: как злоумышленник попал внутрь, что делал, какие данные затронул, и делает это так, чтобы выводы можно было подтвердить доказательствами.<\\/p>\\n<p>Между ними есть естественное напряжение. Реагирование хочет быстро перезагрузить, переустановить и закрыть доступ, а форензике нужно сначала сохранить состояние системы: память, диск, журналы. Если сразу переустановить сервер, мы потеряем ответ на главный вопрос, откуда пришла атака, и она повторится.<\\/p>\\n<p>Поэтому в хорошем процессе сбор доказательств встроен в само реагирование. Сначала снимаем самое летучее и изолируем хост так, чтобы не уничтожить следы, потом устраняем. Процесс реагирования описан в NIST SP 800-61r3, а методика экспертизы в NIST SP 800-86.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/86/final","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":193,"num":194,"category":"DFIR и форензика","text":"Из каких этапов состоит цифровая экспертиза по NIST SP 800-86?","answer":"<p>NIST SP 800-86 описывает четыре этапа. Сбор (collection): определить источники данных, получить их с сохранением целостности. Исследование (examination): обработать собранное, извлечь значимое, отфильтровать шум. Анализ (analysis): связать найденное в выводы, ответить на вопросы расследования. Отчёт (reporting): изложить результаты, описать выполненные действия, объяснить выбор инструментов и процедур и дать рекомендации.<\\/p>\\n<p>На практике я держу в голове, что каждый этап должен быть воспроизводим. На сборе считаем хэши образов и ведём журнал действий, на исследовании работаем только с копией, на анализе отделяем то, что доказано артефактом, от того, что является гипотезой.<\\/p>\\n<p>Отдельный акцент документа в том, что форензика нужна не только для суда, но и для обычной эксплуатации: разбор инцидента, восстановление данных, поиск причины сбоя. Поэтому готовность к ней (какие журналы включены, сколько хранятся, есть ли инструменты) закладывается заранее, до инцидента.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/86/final"]},{"id":194,"num":195,"category":"DFIR и форензика","text":"Что такое порядок летучести и почему он важен?","answer":"<p>Порядок летучести (order of volatility) это правило собирать доказательства от самых быстро исчезающих к самым устойчивым. В RFC 3227 он выглядит так: регистры и кэш; таблица маршрутизации, ARP-кэш, таблица процессов, статистика ядра, оперативная память; временные файловые системы; диск; удалённые журналы и данные мониторинга; физическая конфигурация и топология сети; архивные носители.<\\/p>\\n<p>Смысл простой. Содержимое памяти, сетевые соединения и список процессов исчезают при перезагрузке, а часто и через минуты. Диск никуда не денется. Если начать с образа диска, пока он снимается, в памяти успеют смениться процессы и соединения, а бесфайловый вредонос мы не увидим вообще.<\\/p>\\n<p>В той же RFC есть список того, чего делать нельзя: не выключать систему до окончания сбора, не доверять программам на исследуемой системе и запускать свои с защищённого носителя, не запускать утилиты, которые меняют время доступа ко всем файлам, осторожно отключать от сети, потому что возможен механизм, уничтожающий следы при потере связи.<\\/p>","sources":["https://www.rfc-editor.org/rfc/rfc3227"]},{"id":195,"num":196,"category":"DFIR и форензика","text":"Что такое цепочка хранения доказательств (chain of custody)?","answer":"<p>Цепочка хранения это документированная история каждого доказательства: кто, где и когда его обнаружил и изъял, кто и где с ним работал, как и где оно хранилось, кому и как передавалось. RFC 3227 требует описывать именно эти элементы. Цель в том, чтобы можно было показать, что доказательство не подменили и не изменили между изъятием и выводом в отчёте.<\\/p>\\n<p>Технически целостность подтверждают хэши. Сразу после снятия образа я считаю SHA-256 (часто параллельно и второй алгоритм), записываю в журнал, а перед анализом и после него пересчитываю. Анализ идёт только по рабочей копии, оригинал хранится отдельно и с ограниченным доступом.<\\/p>\\n<p>Даже если инцидент не пойдёт в суд, привычка вести цепочку окупается: через полгода, при споре с подрядчиком или при проверке регулятора, мы можем показать, откуда взялся каждый вывод. Если есть вероятность судебного разбирательства, порядок изъятия согласуем с юристами до начала работ.<\\/p>","sources":["https://csrc.nist.gov/glossary/term/chain_of_custody","https://www.rfc-editor.org/rfc/rfc3227"]},{"id":196,"num":197,"category":"DFIR и форензика","text":"Как правильно снять образ диска для расследования?","answer":"<p>Главный принцип: не изменить оригинал и доказать это. Для физического диска используют аппаратный блокиратор записи (write blocker), он пропускает только команды чтения. Качество таких блокираторов и программ создания образов проверяет программа NIST CFTT, её отчёты полезно смотреть при выборе инструмента.<\\/p>\\n<p>Снимаю побитовый образ всего устройства, а не копию файлов, чтобы сохранить удалённые данные, свободное место и служебные структуры файловой системы. Формат либо raw (dd), либо E01 (Expert Witness Format), который умеет сжатие, хранит метаданные дела и хэш внутри образа; открытая библиотека для него libewf. Хэш считаю до и после, записываю в журнал.<\\/p>\\n<p>В облаке и в виртуализации логика та же, но инструменты другие: снимок тома (например, снимок EBS в AWS) или снимок диска виртуальной машины, затем копия в изолированную учётную запись для анализа. Если диск зашифрован (BitLocker, LUKS) и машина работает, важно до выключения снять память или ключи восстановления, иначе образ окажется нечитаемым.<\\/p>\\n<pre><code>dc3dd if=/dev/sdb of=disk.img hash=sha256 log=disk.log   # образ и хеш за один проход\\nsha256sum disk.img                                       # зафиксировать хеш образа<\\/code><\\/pre>\\n<p>Снимают побитовую копию через блокиратор записи, чтобы не изменить оригинал. <code>dc3dd<\\/code> считает хеш прямо при копировании, совпадение хешей оригинала и образа это основа доказуемости.<\\/p>","sources":["https://www.nist.gov/itl/ssd/software-quality-group/computer-forensics-tool-testing-program-cftt","https://github.com/libyal/libewf","https://csrc.nist.gov/pubs/sp/800/86/final"]},{"id":197,"num":198,"category":"DFIR и форензика","text":"Когда нужен live response, а когда систему можно выключить?","answer":"<p>Live response это сбор данных с работающей системы: память, процессы, сетевые соединения, открытые файлы, залогиненные пользователи. Он нужен почти всегда, когда есть подозрение на активного злоумышленника или бесфайловый вредонос, потому что после выключения этих данных не будет. RFC 3227 прямо советует не выключать систему до окончания сбора, в том числе потому, что атакующий мог изменить сценарии выключения, чтобы стереть следы.<\\/p>\\n<p>У live response есть цена: любое наше действие меняет систему. Поэтому я запускаю проверенные инструменты с внешнего носителя или через агент EDR, пишу результаты не на исследуемый диск, а на внешний носитель или по сети, и фиксирую каждую команду со временем.<\\/p>\\n<p>Выключить сразу оправдано, когда риск продолжения атаки выше ценности летучих данных: например, идёт активное шифрование или уничтожение данных, и изолировать хост по сети нельзя. Но и тогда я предпочту сетевую изоляцию через EDR, она останавливает атаку и сохраняет память.<\\/p>","sources":["https://www.rfc-editor.org/rfc/rfc3227","https://csrc.nist.gov/pubs/sp/800/86/final"]},{"id":198,"num":199,"category":"DFIR и форензика","text":"Как снимают дамп оперативной памяти в Windows и Linux?","answer":"<p>В Windows используют утилиты, которые через драйвер читают физическую память и пишут её в файл, например WinPmem. Во многих EDR есть своя функция снятия памяти по сети. Файл пишу на внешний носитель или сетевой ресурс, не на системный диск, и сразу считаю хэш.<\\/p>\\n<p>В Linux есть два распространённых варианта. LiME это загружаемый модуль ядра, умеет писать дамп в файл или отдавать по сети; минус в том, что модуль надо собрать под точную версию ядра. AVML от Microsoft работает в пространстве пользователя и не требует модуля ядра, поэтому его удобно применять на однотипных облачных машинах.<\\/p>\\n<p>Для анализа в Volatility 3 нужны символы ядра. Для Windows они обычно подтягиваются из PDB автоматически, для Linux таблицу символов часто приходится готовить под конкретное ядро, поэтому заранее собрать её для эталонных образов серверов это хорошая подготовительная задача.<\\/p>\\n<pre><code>sudo avml memory.lime          # Linux, дамп физической памяти\\n# Windows: winpmem_mini_x64.exe memory.raw<\\/code><\\/pre>\\n<p>Память снимают первой по порядку летучести, до выключения. <code>avml<\\/code> на Linux и winpmem на Windows пишут дамп на внешний носитель, дальше его разбирают в Volatility.<\\/p>","sources":["https://github.com/Velocidex/WinPmem","https://github.com/504ensicsLabs/LiME","https://github.com/microsoft/avml","https://volatility3.readthedocs.io/en/latest/getting-started-windows-tutorial.html"]},{"id":199,"num":200,"category":"DFIR и форензика","text":"Как вы анализируете дамп памяти в Volatility 3?","answer":"<p>Volatility 3 запускается командой вида <code>python3 vol.py -f memdump.raw windows.pslist<\\/code>. В отличие от второй версии, профиль указывать не нужно, фреймворк сам определяет систему и использует таблицы символов.<\\/p>\\n<p>Мой обычный порядок такой. Процессы: <code>windows.pslist<\\/code> и <code>windows.pstree<\\/code>, смотрю странных родителей (например, Word порождает PowerShell), процессы из необычных путей, двойники системных имён. <code>windows.psscan<\\/code> ищет структуры процессов сканированием памяти и может найти то, что скрыто из списка. Затем <code>windows.cmdline<\\/code> для аргументов запуска, <code>windows.netscan<\\/code> для сетевых соединений, <code>windows.malware.malfind<\\/code> для признаков внедрённого кода (в старых сборках он назывался <code>windows.malfind<\\/code>), <code>windows.dlllist<\\/code> и <code>windows.handles<\\/code> для деталей по подозрительному процессу.<\\/p>\\n<p>Найденное проверяю по другим источникам: хэш выгруженного исполняемого файла, адрес из netscan по журналам прокси и файрвола, время запуска по таймлайну диска. Вывод из одного плагина без подтверждения я не считаю доказанным.<\\/p>\\n<pre>python3 vol.py -f mem.raw windows.pstree\\npython3 vol.py -f mem.raw windows.netscan\\npython3 vol.py -f mem.raw windows.malware.malfind --pid 4321<\\/pre>","sources":["https://volatility3.readthedocs.io/en/latest/getting-started-windows-tutorial.html","https://github.com/volatilityfoundation/volatility3"]},{"id":200,"num":201,"category":"DFIR и форензика","text":"Как в памяти обнаружить внедрение кода в процесс?","answer":"<p>Внедрение кода (process injection, ATT&CK T1055) нужно злоумышленнику, чтобы выполняться внутри легитимного процесса и скрыться от защиты. Типичный след в памяти это область, которая выделена динамически, не связана ни с одним файлом на диске и одновременно доступна на запись и исполнение, иногда с заголовком PE внутри.<\\/p>\\n<p>Плагин <code>windows.malware.malfind<\\/code> в Volatility 3 (прежнее имя <code>windows.malfind<\\/code>) ищет как раз такие области и показывает их начало в шестнадцатеричном виде и дизассемблером. Дальше смотрю, что это: заголовок MZ, похожий на шелл-код пролог или ложное срабатывание (JIT-компиляторы .NET и браузеров законно создают исполняемые области). Подозрительную область выгружаю и проверяю YARA-правилами и в песочнице.<\\/p>\\n<p>Косвенные признаки тоже важны: процесс с правильным именем, но неправильным путём или родителем, сетевые соединения у процесса, которому сеть не нужна (например, notepad), расхождение между загруженными модулями и файлами на диске.<\\/p>","sources":["https://attack.mitre.org/techniques/T1055/","https://github.com/volatilityfoundation/volatility3"]},{"id":201,"num":202,"category":"DFIR и форензика","text":"Какие артефакты Windows показывают, что программа запускалась?","answer":"<p>Их несколько, и каждый имеет свои ограничения, поэтому смотрю в совокупности. Prefetch (<code>C:\\\\Windows\\\\Prefetch\\\\*.pf<\\/code>) хранит имя, число и время последних запусков и файлы, с которыми работала программа; на серверных редакциях часто выключен. Amcache (<code>C:\\\\Windows\\\\AppCompat\\\\Programs\\\\Amcache.hve<\\/code>) содержит пути и SHA1 исполняемых файлов. Shimcache (AppCompatCache в улье SYSTEM) фиксирует файлы, которые система проверяла на совместимость, но в современных Windows его наличие само по себе не доказывает запуск.<\\/p>\\n<p>Дальше артефакты, привязанные к пользователю. UserAssist в NTUSER.DAT хранит запуски из графической оболочки (значения закодированы ROT13). BAM в улье SYSTEM хранит время последнего запуска по SID пользователя. SRUM (<code>SRUDB.dat<\\/code>) держит статистику использования ресурсов, включая сетевой трафик по приложениям, за последние недели.<\\/p>\\n<p>Если заранее настроены аудит создания процессов (событие 4688 с командной строкой) и Sysmon (событие 1), они дают самую точную картину. Хорошая сводка артефактов по категориям есть в постере SANS по форензике Windows.<\\/p>","sources":["https://www.sans.org/posters/windows-forensic-analysis/","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4688","https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon"]},{"id":202,"num":203,"category":"DFIR и форензика","text":"Какие ульи реестра важны при расследовании и что в них ищут?","answer":"<p>Системные ульи лежат в <code>C:\\\\Windows\\\\System32\\\\config<\\/code>. SYSTEM: службы, подключавшиеся USB-устройства, сетевые интерфейсы, Shimcache, BAM, часовой пояс (без него неправильно прочитаем все времена). SOFTWARE: установленные программы, ключи автозапуска уровня машины, сетевые профили. SAM: локальные учётные записи и группы. SECURITY: политики и кэшированные секреты.<\\/p>\\n<p>Пользовательские ульи лежат в профиле. NTUSER.DAT: ключи Run пользователя, UserAssist, недавние документы, пути, введённые в проводнике, история подключений RDP. UsrClass.dat: ShellBags, по которым видно, какие папки пользователь открывал, включая удалённые и на съёмных носителях.<\\/p>\\n<p>Работаю с копиями ульев, снятыми с образа, вместе с журналами транзакций (файлы .LOG1 и .LOG2), иначе последние изменения могут потеряться. У каждого ключа есть время последней записи, это полезная точка для таймлайна.<\\/p>","sources":["https://learn.microsoft.com/en-us/windows/win32/sysinfo/registry-hives","https://www.sans.org/posters/windows-forensic-analysis/"]},{"id":203,"num":204,"category":"DFIR и форензика","text":"Что криминалист извлекает из файловой системы NTFS?","answer":"<p>Главная структура это $MFT (Master File Table), в ней запись на каждый файл и каталог: имя, размер, атрибуты, временные метки, расположение данных. Маленькие файлы хранятся прямо внутри записи MFT (resident). Записи удалённых файлов остаются, пока их не перезапишут, поэтому по MFT часто восстанавливаются имена и времена удалённых файлов.<\\/p>\\n<p>Журнал изменений USN (<code>$Extend\\\\$UsnJrnl<\\/code>, поток $J) фиксирует создание, переименование, изменение и удаление файлов с временем. По нему видно, например, что архиватор создал файл, потом его переименовали и удалили, даже если самого файла уже нет. $LogFile хранит журнал транзакций метаданных за короткий период.<\\/p>\\n<p>Временные метки есть в двух атрибутах: $STANDARD_INFORMATION и $FILE_NAME. Первый легко изменить из пользовательского режима, второй меняет только ядро, поэтому расхождение между ними это классический признак подделки времени.<\\/p>","sources":["https://learn.microsoft.com/en-us/windows/win32/fileio/master-file-table","https://learn.microsoft.com/en-us/windows/win32/fileio/change-journals"]},{"id":204,"num":205,"category":"DFIR и форензика","text":"Что такое timestomping и как его обнаружить?","answer":"<p>Timestomping (ATT&CK T1070.006) это подделка временных меток файла, чтобы вредоносный файл выглядел как давно существующий системный и не попал в выборку по времени инцидента. Злоумышленник копирует время у соседнего легитимного файла или ставит произвольное.<\\/p>\\n<p>В NTFS чаще всего меняют $STANDARD_INFORMATION, это делается обычными API вроде SetFileTime. Атрибут $FILE_NAME меняет ядро, поэтому расхождение между ними (например, $SI создан раньше, чем $FN) подозрительно. ATT&CK упоминает и двойной timestomping, когда подделаны оба атрибута, тогда помогают журнал USN, $LogFile и время в других артефактах (Prefetch, Amcache, журналы событий), которые злоумышленник обычно не правит.<\\/p>\\n<p>Ещё признаки: нулевые доли секунды во времени (многие инструменты ставят целые секунды), время файла раньше даты установки системы. В реальном времени смену времени создания файла ловит событие Sysmon 2. В Linux аналог это <code>touch -t<\\/code>, и там помогает ctime, которую <code>touch<\\/code> изменить не может.<\\/p>","sources":["https://attack.mitre.org/techniques/T1070/006/","https://learn.microsoft.com/en-us/windows/win32/fileio/master-file-table"]},{"id":205,"num":206,"category":"DFIR и форензика","text":"Как строится таймлайн расследования?","answer":"<p>Таймлайн это главный рабочий продукт расследования: все события из разных источников на одной шкале времени. Супертаймлайн собирают автоматически, например инструментом plaso (log2timeline): он разбирает образ диска и извлекает времена из файловой системы, реестра, журналов событий, истории браузера, Prefetch и десятков других форматов. Для совместного анализа и разметки удобен Timesketch.<\\/p>\\n<p>Первое, что я делаю, это привожу всё к UTC и проверяю часовой пояс и сдвиг часов каждого источника, иначе события разных хостов перепутаются. Второе, фильтрация: супертаймлайн содержит миллионы строк, поэтому начинаю от опорной точки (время алерта, известный вредоносный файл) и смотрю окно вокруг неё.<\\/p>\\n<p>Дальше работа идёт в обе стороны: назад, чтобы найти первоначальный вектор, и вперёд, чтобы понять, что злоумышленник делал после. Каждую ключевую строку таймлайна в отчёте подкрепляю ссылкой на конкретный артефакт.<\\/p>","sources":["https://plaso.readthedocs.io/en/latest/","https://github.com/google/timesketch"]},{"id":206,"num":207,"category":"DFIR и форензика","text":"Где искать закрепление злоумышленника в Windows?","answer":"<p>Самые частые места совпадают с техниками ATT&CK. Ключи Run и RunOnce в SOFTWARE и NTUSER.DAT и папка автозагрузки (T1547.001). Службы (T1543.003): новые записи в <code>SYSTEM\\\\CurrentControlSet\\\\Services<\\/code> и событие 7045 в журнале System. Задачи планировщика (T1053.005): файлы в <code>C:\\\\Windows\\\\System32\\\\Tasks<\\/code> и события создания задач. Подписки WMI (T1546.003): связки фильтра, потребителя и привязки в репозитории WMI.<\\/p>\\n<p>Кроме этого проверяю новые локальные и доменные учётные записи, добавление в привилегированные группы, изменённые ярлыки, подмену DLL в путях поиска, веб-шеллы на серверах с IIS, а в облаке новые ключи доступа и приложения с правами.<\\/p>\\n<p>Практический приём: сравнить список автозапусков с эталонной машиной той же роли. Утилита Autoruns от Sysinternals показывает большинство мест в одном окне, а при массовой проверке то же собирается через Velociraptor по всем хостам.<\\/p>","sources":["https://attack.mitre.org/techniques/T1547/001/","https://attack.mitre.org/techniques/T1543/003/","https://attack.mitre.org/techniques/T1053/005/","https://attack.mitre.org/techniques/T1546/003/"]},{"id":207,"num":208,"category":"DFIR и форензика","text":"Какие следы на атакованном хосте оставляют PsExec, RDP и WMI?","answer":"<p>PsExec и похожие инструменты (T1021.002, SMB и административные шары) на целевом хосте дают сетевой вход, событие 4624 с типом входа 3, установку службы (событие 7045, по умолчанию служба PSEXESVC) и запуск процессов от её имени. В копиях Impacket имя службы случайное, но картина та же: служба появилась и вскоре исчезла.<\\/p>\\n<p>RDP (T1021.001) оставляет на цели вход с типом 10 (RemoteInteractive) и события в журналах служб удалённых рабочих столов, а на исходной машине следы клиента: историю подключений в NTUSER.DAT и кэш растровых изображений RDP, по которому иногда можно восстановить фрагменты экрана.<\\/p>\\n<p>WMI (T1047) выдаёт себя процессами, у которых родитель WmiPrvSE.exe, например cmd или PowerShell с перенаправлением вывода в файл на административной шаре. Во всех трёх случаях цель расследования одна: связать вход на целевом хосте с исходной машиной и учётной записью и так пройти по цепочке перемещения назад.<\\/p>","sources":["https://attack.mitre.org/techniques/T1021/002/","https://attack.mitre.org/techniques/T1021/001/","https://attack.mitre.org/techniques/T1047/","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4624"]},{"id":208,"num":209,"category":"DFIR и форензика","text":"Какие артефакты Linux вы смотрите при расследовании?","answer":"<p>Журналы входа: <code>/var/log/auth.log<\\/code> или <code>/var/log/secure<\\/code> в зависимости от дистрибутива, журнал systemd (<code>journalctl<\\/code>), а также бинарные файлы wtmp (успешные входы), btmp (неудачные) и lastlog, которые читаются командами <code>last<\\/code>, <code>lastb<\\/code>, <code>lastlog<\\/code>. Формат utmp и wtmp описан в man utmp(5), работа с wtmp и btmp в man last(1), а lastlog имеет собственный формат и свою страницу man.<\\/p>\\n<p>Действия пользователя и закрепление: <code>~/.bash_history<\\/code> (легко очистить, поэтому отсутствие истории само по себе подозрительно), <code>~/.ssh/authorized_keys<\\/code>, crontab пользователей и <code>/etc/cron*<\\/code>, юниты systemd в <code>/etc/systemd/system<\\/code> и в домашних каталогах, <code>/etc/ld.so.preload<\\/code> для подмены библиотек (T1574.006), новые пользователи и sudoers.<\\/p>\\n<p>Файловые следы: исполняемые файлы в <code>/tmp<\\/code>, <code>/dev/shm<\\/code> и <code>/var/tmp<\\/code>, недавно изменённые файлы по ctime, процессы, чей исполняемый файл удалён (ссылка <code>/proc/PID/exe<\\/code> с пометкой deleted). Такой файл можно вытащить копированием из <code>/proc/PID/exe<\\/code>, пока процесс жив.<\\/p>\\n<pre>last -F -i ; lastb -F -i | head\\nfind / -xdev -newermt '2026-09-01' -type f -perm -u+x 2>/dev/null\\nls -l /proc/*/exe 2>/dev/null | grep deleted<\\/pre>","sources":["https://man7.org/linux/man-pages/man5/utmp.5.html","https://man7.org/linux/man-pages/man1/last.1.html","https://man7.org/linux/man-pages/man8/lastlog.8.html","https://attack.mitre.org/techniques/T1574/006/","https://man7.org/linux/man-pages/man8/ld.so.8.html"]},{"id":209,"num":210,"category":"DFIR и форензика","text":"Как обнаружить очистку журналов и другие приёмы антифорензики?","answer":"<p>Очистка журналов событий Windows (T1685.005 Disable or Modify Tools: Clear Windows Event Logs, прежний идентификатор T1070.001) сама оставляет след: событие 1102 в журнале Security и событие 104 в журнале System. Поэтому их появление, особенно вне планового обслуживания, это сильный сигнал. Защита на будущее одна: пересылать журналы в SIEM в реальном времени, тогда локальная очистка ничего не скрывает.<\\/p>\\n<p>Другие приёмы: подделка времени файлов (T1070.006), удаление инструментов после использования, очистка истории командной строки, выключение аудита или агентов защиты, шифрование и упаковка вредоноса. Против каждого есть избыточные источники: удалённый файл остаётся в MFT и журнале USN, запуск виден в Prefetch и Amcache, выключение агента видно в консоли EDR как пропажа телеметрии.<\\/p>\\n<p>Главный вывод для расследования: отсутствие данных тоже данные. Разрыв в журналах, пустая история у активного пользователя, внезапно выключенный аудит я отмечаю на таймлайне как событие и ищу, что происходило в этот момент по другим источникам.<\\/p>","sources":["https://attack.mitre.org/techniques/T1685/005/","https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-1102","https://attack.mitre.org/techniques/T1070/006/"]},{"id":210,"num":211,"category":"DFIR и форензика","text":"Как собирать артефакты с сотен хостов при крупном инциденте?","answer":"<p>Снимать полный образ каждого диска при масштабном инциденте невозможно, поэтому используют триаж: с каждого хоста собирают небольшой набор самых ценных артефактов (журналы событий, реестр, MFT, журнал USN, Prefetch, Amcache, задачи планировщика, история браузеров) и уже по ним решают, какие хосты разбирать глубже.<\\/p>\\n<p>Два распространённых инструмента. KAPE от Kroll собирает артефакты по наборам целей (targets) и обрабатывает их модулями, наборы целей открыто лежат в репозитории KapeFiles. Velociraptor это агентская платформа с языком запросов VQL: можно одновременно на всех хостах поискать файл по хэшу, собрать артефакт или выполнить YARA-скан памяти, и получить результаты централизованно.<\\/p>\\n<p>Важно подготовить это до инцидента: агент или способ быстрого развёртывания, проверенный набор коллекций, хранилище под результаты. Во время инцидента времени на выбор и согласование инструментов нет.<\\/p>","sources":["https://docs.velociraptor.app/","https://github.com/EricZimmerman/KapeFiles"]},{"id":211,"num":212,"category":"DFIR и форензика","text":"Как провести форензику скомпрометированного EC2 в AWS?","answer":"<p>AWS в паттерне Automate incident response and forensics описывает процесс из четырёх фаз: сдерживание, получение доказательств, исследование и анализ. Ключевая идея в отдельных учётных записях: security-аккаунт для автоматизации сбора и forensics-аккаунт для хранения артефактов и анализа, без выхода в интернет. Это ограничивает ущерб, защищает целостность артефактов и не зависит от квот скомпрометированного аккаунта.<\\/p>\\n<p>Практически порядок такой. Пометить инстанс тегом инцидента, снять память через Systems Manager (без интерактивного входа), сделать снимки всех томов EBS и скопировать их в forensics-аккаунт, изолировать инстанс группой безопасности без правил и вывести из Auto Scaling и балансировщика. Анализ ведётся на отдельной рабочей машине, в паттерне AWS это образ на базе SANS SIFT.<\\/p>\\n<p>Параллельно смотрю плоскость управления: CloudTrail покажет, какими ключами и ролями действовал злоумышленник, что создавал и откуда. В облаке компрометация учётных данных часто важнее самого инстанса.<\\/p>","sources":["https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/automate-incident-response-and-forensics.html","https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html","https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"]},{"id":212,"num":213,"category":"DFIR и форензика","text":"Как расследовать инцидент в контейнере и Kubernetes?","answer":"<p>Главная сложность в эфемерности: под перезапустили, и вместе с ним исчезли файлы и память. Поэтому первое действие не удалять под, а изолировать его сетевой политикой и снять состояние.<\\/p>\\n<p>В Kubernetes для этого есть kubelet Checkpoint API (feature gate ContainerCheckpoint, beta с версии 1.30 и включён по умолчанию). Он создаёт копию работающего контейнера, включая память всех процессов, в архив в <code>/var/lib/kubelet/checkpoints<\\/code>, при этом исходный контейнер об этом не знает. Архив содержит секреты и ключи из памяти, доступ к нему только у root. Без него помогают <code>docker diff<\\/code> (какие файлы изменились относительно образа) и <code>docker export<\\/code> (файловая система контейнера в tar).<\\/p>\\n<p>Затем плоскость управления: audit-журналы API-сервера покажут, кто выполнял exec в поды, создавал привилегированные поды, читал секреты. И узел: если контейнер вышел на хост, расследование идёт как по обычному Linux-серверу.<\\/p>","sources":["https://kubernetes.io/docs/reference/node/kubelet-checkpoint-api/","https://kubernetes.io/blog/2022/12/05/forensic-container-checkpointing-alpha/","https://docs.docker.com/reference/cli/docker/container/diff/","https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/"]},{"id":213,"num":214,"category":"DFIR и форензика","text":"Как расследовать компрометацию учётной записи Microsoft 365 или Entra ID?","answer":"<p>Основные источники два. Журналы входа Entra ID: откуда, с какого устройства и приложения был вход, прошла ли MFA, сработал ли условный доступ. Единый журнал аудита Microsoft Purview (из консоли или командлетом <code>Search-UnifiedAuditLog<\\/code>): действия в почте, SharePoint, OneDrive, Teams и администрировании.<\\/p>\\n<p>В типичном сценарии компрометации почты я ищу вход из необычной страны или хостинга, новые методы MFA, созданные правила входящих (пересылка наружу, перемещение писем в скрытые папки), делегирование доступа к ящику, выданные согласия приложениям OAuth, массовый доступ к письмам и файлам. Правила пересылки и согласия приложений это закрепление, которое переживает смену пароля.<\\/p>\\n<p>Поэтому сдерживание включает не только смену пароля, но и отзыв сессий и токенов, удаление правил, отзыв согласий приложений и проверку методов MFA. Пошаговые сценарии Microsoft публикует в своих incident response playbooks.<\\/p>","sources":["https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-ins","https://learn.microsoft.com/en-us/purview/audit-search","https://learn.microsoft.com/en-us/security/operations/incident-response-playbooks"]},{"id":214,"num":215,"category":"DFIR и форензика","text":"Как безопасно провести первичный анализ подозрительного файла?","answer":"<p>Работаю в изолированной виртуальной машине без доступа к корпоративной сети, со снимком для отката. Файл храню в архиве с паролем и с изменённым расширением, чтобы его нельзя было случайно запустить.<\\/p>\\n<p>Статический анализ без запуска: хэши SHA-256 для поиска в threat intelligence, imphash (хэш таблицы импорта, помогает связать образцы одного семейства), нечёткий хэш ssdeep для похожих файлов, строки, секции и импорты PE, признаки упаковки. capa от Mandiant автоматически описывает возможности файла (сеть, шифрование, закрепление) и сопоставляет их с ATT&CK. YARA-правилами проверяю на известные семейства.<\\/p>\\n<p>Динамический анализ: запуск в песочнице с записью процессов, изменений файлов и реестра, сетевых запросов. Результат анализа это не описание вредоноса ради описания, а индикаторы и поведение, по которым можно найти другие заражённые хосты и написать правило обнаружения. Загружать файл в публичные сервисы можно не всегда: если он может содержать данные компании или мы не хотим предупредить атакующего, достаточно поиска по хэшу.<\\/p>\\n<pre><code>file suspicious.bin                  # реальный тип, не доверяя расширению\\nsha256sum suspicious.bin             # хеш для сверки по threat intelligence\\nstrings -n 8 suspicious.bin | less   # читаемые строки, адреса, пути, команды<\\/code><\\/pre>\\n<p>Первичный разбор статический, без запуска образца. <code>file<\\/code> определяет тип по содержимому, по хешу проверяют репутацию, <code>strings<\\/code> вытягивает подсказки. Запуск только в изолированной песочнице.<\\/p>","sources":["https://github.com/mandiant/capa","https://cloud.google.com/blog/topics/threat-intelligence/tracking-malware-import-hashing/","https://ssdeep-project.github.io/ssdeep/index.html","https://virustotal.github.io/yara/"]},{"id":215,"num":216,"category":"DFIR и форензика","text":"Как найти веб-шелл на сервере и понять, как он попал?","answer":"<p>Веб-шелл (ATT&CK T1505.003) это скрипт в каталоге веб-приложения, через который атакующий выполняет команды. Искать начинаю с процессов: веб-сервер или пул приложений (w3wp.exe, php-fpm, java) порождает cmd, PowerShell, sh или whoami, этого в нормальной работе почти не бывает.<\\/p>\\n<p>Затем файлы: недавно созданные или изменённые скрипты в веб-каталогах (с оглядкой на возможный timestomping, сверяю с журналом USN или ctime), файлы, которых нет в репозитории или в эталонном деплое, характерные функции вроде eval, base64-декодирования и выполнения команд, проверка YARA-правилами. Сравнение с последней сборкой из CI это самый надёжный способ.<\\/p>\\n<p>Путь проникновения ищу по журналам веб-сервера: первые обращения к файлу веб-шелла, а перед ними запросы с того же адреса к загрузке файлов, к уязвимым страницам или с признаками эксплуатации. Нашли уязвимость, значит устраняем её, иначе удалённый веб-шелл через день появится снова.<\\/p>\\n<pre><code>grep -rEl 'eval\\\\(|base64_decode\\\\(|system\\\\(|passthru\\\\(' /var/www --include='*.php'\\nfind /var/www -name '*.php' -mtime -7      # скрипты, изменённые за неделю<\\/code><\\/pre>\\n<p>Веб-шелл это чужой скрипт в каталоге сайта, часто с обфускацией и вызовами выполнения команд. Поиск по таким функциям и по недавно изменённым файлам сужает круг, дальше сверяют с журналом веб-сервера.<\\/p>","sources":["https://attack.mitre.org/techniques/T1505/003/"]},{"id":216,"num":217,"category":"DFIR и форензика","text":"Как определить первоначальный вектор проникновения?","answer":"<p>Первоначальный вектор это ответ на вопрос, как злоумышленник впервые получил доступ: фишинговое письмо, уязвимость в публичном сервисе, украденные учётные данные VPN или облака, подрядчик, съёмный носитель. В ATT&CK это тактика Initial Access (TA0001), и её техники хорошо подходят как чек-лист гипотез.<\\/p>\\n<p>Иду по таймлайну назад от самого раннего подтверждённого вредоносного события. На каждом шаге спрашиваю, как это действие стало возможным: процесс запустил родитель, учётную запись использовали впервые вот с этого адреса, файл пришёл во вложении или был скачан. Часто цепочка упирается в граничный сервис: VPN, почту, веб-приложение, RDP в интернет.<\\/p>\\n<p>Если журналы до определённой даты не сохранились, я честно пишу в отчёте, что вектор установлен с такой-то степенью уверенности, и перечисляю, чего не хватило. Это важный вывод для улучшений: сроки хранения журналов и их полнота напрямую определяют, сможем ли мы ответить на этот вопрос в следующий раз.<\\/p>","sources":["https://attack.mitre.org/tactics/TA0001/","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":217,"num":218,"category":"DFIR и форензика","text":"Что должно быть в отчёте о расследовании инцидента?","answer":"<p>NIST SP 800-86 выделяет отчёт отдельным этапом и среди прочего называет описание выполненных действий и обоснование выбора инструментов и процедур. Ограничения анализа документ отдельным требованием не называет, но я их описываю всегда, иначе читатель примет непроверенное за проверенное. Я делаю отчёт из двух частей для двух читателей.<\\/p>\\n<p>Краткое резюме для руководства на страницу: что произошло, когда, какой ущерб (затронутые системы и данные), закрыт ли доступ злоумышленника, что нужно решить руководству (уведомление регулятора и клиентов, бюджет на улучшения).<\\/p>\\n<p>Техническая часть: хронология с опорой на артефакты, первоначальный вектор, затронутые хосты и учётные записи, индикаторы компрометации, отображение действий на техники ATT&CK, выполненные меры сдерживания и устранения, рекомендации с приоритетами и владельцами. Отдельно разделяю установленные факты, выводы и гипотезы, и перечисляю то, что проверить не удалось. По NIST SP 800-61r3 результаты разбора должны вернуться в улучшение процессов, поэтому рекомендации без владельца и срока я считаю незавершённой работой.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/86/final","https://csrc.nist.gov/pubs/sp/800/61/r3/final"]},{"id":218,"num":219,"category":"Пентест и offensive-основы","text":"Что такое пентест и чем он отличается от сканирования уязвимостей?","answer":"<p>Пентест (penetration testing) это санкционированная проверка защищённости, где специалист моделирует действия злоумышленника, чтобы найти и подтвердить реальные пути проникновения и оценить их последствия для бизнеса. Ключевое слово санкционированная: без письменного разрешения и рамок это уже не пентест, а правонарушение.<\\/p><p>Сканирование уязвимостей это автоматическая проверка, которая по базе признаков находит потенциальные слабые места и выдаёт список с оценкой. Оно широкое, но неглубокое и даёт ложные срабатывания. Пентест использует результаты сканера как отправную точку, но дальше человек проверяет, эксплуатируема ли уязвимость на самом деле, связывает несколько мелких проблем в одну атаку и показывает достижимый эффект, например доступ к данным.<\\/p><p>На практике разница в вопросе, на который отвечает работа. Сканер отвечает, где могут быть проблемы. Пентест отвечает, что из этого действительно позволяет навредить и что чинить в первую очередь. Методику пентеста веб-приложений описывает OWASP Web Security Testing Guide.<\\/p>","sources":["https://owasp.org/www-project-web-security-testing-guide/","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":219,"num":220,"category":"Пентест и offensive-основы","text":"Из каких этапов состоит пентест по методологии?","answer":"<p>Общепринятая рамка это NIST SP 800-115 и PTES (Penetration Testing Execution Standard). Этапы примерно такие. Согласование и рамки: цели, границы (что можно трогать, что нельзя), правила, окна проведения, контакты для экстренной остановки. Разведка: сбор информации о цели. Сканирование и анализ: поиск сервисов и уязвимостей. Получение доступа: подтверждение эксплуатируемости. Постэксплуатация: оценка, что доступ реально даёт. Отчёт: находки, риск, рекомендации.<\\/p><p>Отчёт я считаю главным продуктом. Заказчику нужен не список того, что удалось взломать, а понятный приоритезированный план, что и почему чинить. Поэтому каждую находку описываю связкой: суть, как воспроизвести, какой эффект, оценка риска, конкретная рекомендация.<\\/p><p>Отдельно держу в голове правила остановки и связь с заказчиком. Если в ходе работы нашёл действующую утечку данных или следы реального взлома, работу приостанавливаю и немедленно сообщаю, это оговаривается заранее.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://owasp.org/www-project-web-security-testing-guide/"]},{"id":220,"num":221,"category":"Пентест и offensive-основы","text":"Зачем перед пентестом нужны рамки работ (scope) и правила проведения (rules of engagement)?","answer":"<p>Рамки и правила это документ, который превращает потенциально незаконные действия в легальную работу и защищает обе стороны. В нём фиксируется, какие адреса, домены и системы входят в проверку, а какие категорически нет, какие типы воздействия разрешены, в какие часы, кто контакты для экстренной остановки и как обращаться с найденными данными.<\\/p><p>Без этого документа легко причинить реальный ущерб (уронить продакшн, задеть чужую систему в общей инфраструктуре) или выйти за пределы разрешённого, что уже правонарушение. Особенно важно письменное разрешение владельца системы: в облаке дополнительно действуют правила провайдера о тестировании.<\\/p><p>На собеседовании этот вопрос проверяет зрелость. Хороший ответ подчёркивает, что первым делом всегда идёт авторизация и согласованные границы, а не инструменты. Тестировать можно только то, чем владеешь сам, или то, на что есть явное письменное разрешение.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":221,"num":222,"category":"Пентест и offensive-основы","text":"Чем отличаются black box, grey box и white box тестирование?","answer":"<p>Это степень знаний о цели, которую заказчик даёт исполнителю. Black box: исполнитель начинает без внутренней информации, как внешний злоумышленник. Реалистично, но много времени уходит на разведку, и часть проблем может остаться ненайденной за отведённый срок. White box: полный доступ к документации, конфигурациям и исходному коду. Максимальное покрытие за то же время, ближе к аудиту. Grey box: частичный доступ, например обычная учётная запись пользователя, компромисс между реализмом и покрытием.<\\/p><p>Выбор зависит от цели. Хотим проверить, что увидит внешний атакующий, берём black box. Хотим найти как можно больше проблем в конкретном приложении за ограниченный бюджет, берём white box или grey box. Для собеседования важно уметь объяснить компромисс: black box реалистичнее, white box глубже и эффективнее по времени.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/115/final","https://owasp.org/www-project-web-security-testing-guide/"]},{"id":222,"num":223,"category":"Пентест и offensive-основы","text":"Чем пентест отличается от red team и purple team?","answer":"<p>Пентест ищет как можно больше уязвимостей в заданных рамках за ограниченное время, цель это покрытие. Red team проверяет не систему, а способность организации обнаружить и остановить целенаправленную атаку: скрытность важнее охвата, работа имитирует конкретного противника и его цели, а защита (blue team) обычно не предупреждена.<\\/p><p>Purple team это не отдельная команда, а формат совместной работы атакующих и защитников. Атакующие выполняют технику, защитники смотрят, видят ли они её в своих журналах и срабатывают ли правила, и тут же донастраивают обнаружение. Это самый быстрый способ улучшить детектирование.<\\/p><p>Логика зрелости такая. Сначала пентест, чтобы закрыть очевидные дыры. Когда базовая гигиена есть, red team проверяет реакцию, а purple team планомерно закрывает пробелы в обнаружении, часто с опорой на матрицу MITRE ATT&CK как общий язык.<\\/p>","sources":["https://attack.mitre.org/","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":223,"num":224,"category":"Пентест и offensive-основы","text":"Что делают на этапе разведки (reconnaissance)?","answer":"<p>Разведка это сбор информации о цели перед активными действиями. Её делят на пассивную и активную. Пассивная не касается систем цели напрямую и использует открытые источники (OSINT): доменные записи, сведения о сотрудниках, публичные репозитории кода, поддомены, утёкшие в прошлом учётные данные, метаданные документов. Цель понять поверхность атаки и вероятные точки входа.<\\/p><p>Активная разведка уже взаимодействует с целью: определение живых узлов, открытых портов, версий сервисов, технологий сайта. Она заметнее и должна быть внутри согласованных рамок.<\\/p><p>Ценность разведки в том, что качество всей дальнейшей работы зависит от полноты этого этапа. С точки зрения защиты вывод прямой: чем меньше лишнего организация публикует (внутренние адреса, версии, секреты в репозиториях), тем меньше поверхность. Управление поверхностью атаки (ASM) это, по сути, регулярная разведка против самих себя.<\\/p>\\n<pre><code>whois example.com          # регистрационные данные домена\\ndig +short example.com any  # DNS-записи из открытых источников<\\/code><\\/pre>\\n<p>Пассивная разведка собирает данные из открытых источников, не касаясь цели напрямую. Это домены, поддомены, DNS-записи и утёкшие данные, из них складывается поверхность атаки перед активной фазой.<\\/p>","sources":["https://owasp.org/www-project-web-security-testing-guide/"]},{"id":224,"num":225,"category":"Пентест и offensive-основы","text":"Зачем нужны сканеры портов и что показывает результат?","answer":"<p>Сканер портов (самый известный это Nmap) определяет, какие узлы в сети доступны, какие у них открыты сетевые порты, какие службы за ними слушают и часто их версии и операционную систему. Это база для оценки поверхности атаки: каждая открытая служба это потенциальная точка входа.<\\/p><p>Результат читаю так. Открытый порт с устаревшей версией службы это первый кандидат на проверку известных уязвимостей. Неожиданно открытые порты (администрирование баз данных или удалённого доступа, торчащие в интернет) это находка сама по себе. Расхождение между тем, что должно быть открыто по документации, и тем, что открыто на самом деле, указывает на ошибку конфигурации.<\\/p><p>С точки зрения защиты тот же инструмент полезен для инвентаризации: регулярно сканировать свой периметр и сравнивать с эталоном, чтобы вовремя замечать случайно открытые сервисы. Официальная документация Nmap хорошо объясняет, что означают состояния портов.<\\/p>\\n<pre><code>nmap -sV -p- --open target.lab   # -sV версии служб, -p- все порты, --open только открытые<\\/code><\\/pre>\\n<p>Сканер показывает, какие службы доступны и каких версий. <code>-p-<\\/code> проверяет все 65535 портов, <code>-sV<\\/code> определяет версию, чтобы сопоставить с известными уязвимостями. Запускается только по адресам в рамках работ.<\\/p>","sources":["https://nmap.org/book/man.html","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":225,"num":226,"category":"Пентест и offensive-основы","text":"Что такое эксплойт, полезная нагрузка и proof of concept?","answer":"<p>Эксплойт это код или последовательность действий, которые используют конкретную уязвимость, чтобы заставить систему сделать то, что не задумано. Полезная нагрузка (payload) это то, что выполняется после успешной эксплуатации, например получение сессии для управления. Proof of concept (PoC) это минимальная демонстрация, что уязвимость реальна и эксплуатируема, без развития в полноценную атаку.<\\/p><p>В пентесте цель обычно именно PoC: подтвердить и показать эффект, а не нанести ущерб. Часто достаточно безопасного доказательства (например, выполнить команду, возвращающую имя пользователя системы), чтобы зафиксировать находку, дальше разрушать ничего не нужно.<\\/p><p>Важна и оценка серьёзности. Уязвимость с публичным рабочим эксплойтом и признаками использования в реальных атаках приоритетнее теоретической. Каталог CISA KEV перечисляет уязвимости, которые действительно эксплуатируются, и это хороший ориентир при расстановке приоритетов.<\\/p>","sources":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":226,"num":227,"category":"Пентест и offensive-основы","text":"Что такое Metasploit и для чего его используют в пентесте?","answer":"<p>Metasploit это фреймворк для тестирования на проникновение: единая среда, где собраны модули проверки уязвимостей, полезные нагрузки и вспомогательные инструменты. Он избавляет от написания рутинного кода с нуля и даёт стандартный способ подтвердить эксплуатируемость находки в согласованных рамках работ.<\\/p><p>Ценность для отчёта в воспроизводимости: заказчик или другой инженер может повторить проверку теми же модулями и убедиться, что проблема реальна. Есть учебные полигоны (например, намеренно уязвимая Metasploitable), на которых легально осваивают инструмент, не трогая чужие системы.<\\/p><p>С точки зрения защиты полезно знать, что многие такие инструменты оставляют характерные следы и сигнатуры, которые ловят EDR и сетевые сенсоры. Поэтому знание инструментария атакующего напрямую помогает настраивать обнаружение.<\\/p>","sources":["https://docs.metasploit.com/","https://csrc.nist.gov/pubs/sp/800/115/final"]},{"id":227,"num":228,"category":"Пентест и offensive-основы","text":"Что такое привилегированная эскалация и какие бывают направления?","answer":"<p>Эскалация привилегий это получение более высоких прав, чем были изначально. Два направления. Вертикальная: от обычного пользователя к администратору или root на том же узле. Горизонтальная: доступ к данным или функциям другого пользователя того же уровня прав (близко к IDOR в веб-приложениях).<\\/p><p>Типичные причины на уровне системы это ошибки конфигурации (избыточные права, небезопасные права на файлы и службы, задачи по расписанию от имени администратора), устаревшее ядро или ПО с известными уязвимостями, оставленные учётные данные. В ATT&CK это тактика Privilege Escalation.<\\/p><p>С точки зрения защиты рецепт устойчивый: наименьшие привилегии, своевременные обновления, аккуратные права на службы и файлы, отсутствие секретов в открытом виде. На собеседова
