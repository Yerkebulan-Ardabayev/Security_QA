странению и восстановлению штатного функционирования.<\\/p><p>Практический вывод для работы: в переписке с заказчиком и во внутренних документах стоит использовать действующую терминологию закона, а при цитировании обязательно смотреть текущую редакцию на adilet.zan.kz, потому что эта сфера в Казахстане меняется часто.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":289,"num":290,"category":"Кибербезопасность в Казахстане","text":"Как в Казахстане устроена система органов и центров обеспечения кибербезопасности?","answer":"<p>Закон «О кибербезопасности» описывает несколько уровней. Уполномоченный орган это центральный исполнительный орган, который осуществляет руководство и межотраслевую координацию в сфере обеспечения кибербезопасности, его компетенция описана в статье 7-1. Отдельными статьями закреплены Государственный оперативный центр кибербезопасности (статья 7-4) и Национальный координационный центр кибербезопасности (статья 9).<\\/p><p>Ниже уровнем работают центры, ближе к конкретным организациям. Центр обеспечения кибербезопасности (статья 7-5) защищает цифровые объекты подключённых организаций. Отраслевой центр кибербезопасности (статья 10) отвечает за отрасль. Реагированием занимаются Национальная служба реагирования на компьютерные инциденты кибербезопасности (статья 7-7) и службы реагирования на инциденты кибербезопасности (статья 7-8).<\\/p><p>Для инженера практический смысл такой: при инциденте в организации, попадающей под действие закона, есть внешние адресаты уведомления, и порядок взаимодействия с ними нужно прописать в плане реагирования заранее, а не выяснять в момент инцидента.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":290,"num":291,"category":"Кибербезопасность в Казахстане","text":"Что такое центр обеспечения кибербезопасности по закону РК?","answer":"<p>По определению закона центр обеспечения кибербезопасности это юридическое лицо или структурное подразделение юридического лица, являющееся резидентом Республики Казахстан без участия иностранных юридических и физических лиц, которое осуществляет деятельность по защите цифровых объектов. Требование о резидентстве и отсутствии иностранного участия здесь принципиально и часто становится решающим при выборе поставщика услуг.<\\/p><p>По функциям это близко к тому, что в мире называют SOC. Такой центр ведёт мониторинг кибербезопасности подключённых цифровых объектов, принимает меры по минимизации угроз, незамедлительно информирует собственника и владельца цифрового объекта, а также Национальный координационный центр кибербезопасности о выявленных инцидентах и угрозах, и обменивается информацией с отраслевыми центрами.<\\/p><p>Для компании это означает выбор между своим центром и услугой на аутсорсинге. При выборе внешнего поставщика проверяются соответствие требованиям закона, состав услуги, время реакции и порядок передачи журналов, а также как именно будет организовано уведомление сторон при инциденте.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":291,"num":292,"category":"Кибербезопасность в Казахстане","text":"Что такое Единые требования в области ИКТ и обеспечения информационной безопасности?","answer":"<p>Это постановление Правительства Республики Казахстан от 20 декабря 2016 года № 832, которым утверждены единые требования в области информационно-коммуникационных технологий и обеспечения информационной безопасности. По сути это основной подзаконный документ, задающий конкретные требования там, где закон задаёт рамку.<\\/p><p>Круг применения важен для понимания, касается ли это вашей компании. Положения, относящиеся к сфере обеспечения информационной безопасности, обязательны для государственных органов, местных исполнительных органов, государственных юридических лиц, субъектов квазигосударственного сектора, а также собственников и владельцев негосударственных информационных систем, интегрируемых с информационными системами государственных органов. То есть частная компания попадает под них, когда интегрируется с государственными системами.<\\/p><p>Документ регулярно меняется, поэтому единственный корректный способ работы с ним это открыть действующую редакцию на adilet.zan.kz и смотреть конкретные пункты, а не цитировать по памяти или по чужой презентации.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/P1600000832","https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":292,"num":293,"category":"Кибербезопасность в Казахстане","text":"Что закон РК понимает под аудитом кибербезопасности?","answer":"<p>Аудит кибербезопасности определён в законе как оценка состояния защищённости цифровых объектов на соответствие требованиям кибербезопасности. Это важное отличие от тестирования на проникновение: аудит отвечает на вопрос о соответствии требованиям, а пентест на вопрос, можно ли практически проникнуть.<\\/p><p>На практике организации обычно нужны оба вида работ, и подменять один другим нельзя. Формальное соответствие требованиям не гарантирует, что систему нельзя взломать, а успешный пентест не отменяет необходимости выполнить обязательные требования.<\\/p><p>В разговоре с заказчиком я всегда уточняю, какой именно результат нужен: заключение для регулятора или проверки, или же практическая оценка защищённости. От этого зависят и методика, и форма отчёта, и стоимость работ.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":293,"num":294,"category":"Кибербезопасность в Казахстане","text":"Что такое программа взаимодействия с исследователями кибербезопасности в РК?","answer":"<p>Закон вводит два связанных понятия. Исследователь кибербезопасности это специалист в сфере обеспечения кибербезопасности, участвующий в программе взаимодействия с исследователями кибербезопасности. Сама программа определена как организационно-технические мероприятия, обеспечивающие взаимодействие исследователей кибербезопасности с цифровыми объектами для выявления в них уязвимостей.<\\/p><p>По смыслу это легальная рамка для того, что в мире называют bug bounty и координированным раскрытием уязвимостей. Ценность такой рамки именно правовая: она даёт исследователю понятные границы, а организации предсказуемый канал получения сообщений об уязвимостях вместо неожиданной публикации.<\\/p><p>Практический вывод для инженера тот же, что и в мировой практике. Искать уязвимости можно только в рамках объявленной программы и её правил. Работа вне объявленных рамок остаётся несанкционированным доступом, наличие программы у организации само по себе не даёт разрешения трогать всё подряд.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418","https://www.rfc-editor.org/rfc/rfc9116"]},{"id":294,"num":295,"category":"Кибербезопасность в Казахстане","text":"Что закон РК понимает под системой управления событиями кибербезопасности и мониторингом?","answer":"<p>Система управления событиями кибербезопасности определена в законе как программное обеспечение или аппаратно-программный комплекс, предназначенные для автоматизированного выявления событий кибербезопасности путём сбора и анализа журналов регистрации событий цифрового объекта. Это, по сути, определение SIEM в терминах казахстанского законодательства.<\\/p><p>Рядом стоит мониторинг событий кибербезопасности, определённый как постоянное наблюдение за цифровым объектом с целью выявления и идентификации событий кибербезопасности посредством такой системы. Отдельно закон описывает систему мониторинга обеспечения кибербезопасности как организационные и технические мероприятия по мониторингу безопасного использования цифровых технологий.<\\/p><p>Практический смысл в том, что сбор и анализ журналов это не просто хорошая инженерная практика, а описанная в законе функция. Поэтому при построении защиты в казахстанской организации сбор журналов в централизованную систему и постоянный мониторинг стоит закладывать с самого начала, включая срок хранения журналов, достаточный для расследования.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418","https://csrc.nist.gov/pubs/sp/800/92/final"]},{"id":295,"num":296,"category":"Кибербезопасность в Казахстане","text":"Нужна ли в Казахстане лицензия для деятельности в сфере информационной безопасности?","answer":"<p>Да, закон содержит отдельную статью 9-1 о лицензировании в сфере обеспечения информационной безопасности. Поэтому при планировании услуг по защите информации и при выборе подрядчика вопрос наличия лицензии относится к числу первых, а не к формальностям в конце.<\\/p><p>Практически это влияет на два решения. Если компания сама собирается оказывать такие услуги на рынке, нужно заранее изучить условия лицензирования и заложить их в план. Если компания нанимает подрядчика, наличие необходимой лицензии проверяется вместе с остальной проверкой контрагента.<\\/p><p>Конкретный перечень лицензируемых видов деятельности и условия меняются, поэтому корректный порядок такой: открыть действующую редакцию закона и соответствующие подзаконные акты на adilet.zan.kz, а при существенной цене вопроса привлечь юриста. Отвечать заказчику по памяти в этой части я бы не стал.<\\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]}]};
