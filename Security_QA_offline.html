ование.<\\/p>\\n<p>Отдельно выделю Poisoned Pipeline Execution. Атакующий, у которого есть право открыть пул-реквест, меняет файл пайплайна, Makefile или скрипт тестов, и CI выполняет его код с доступом к секретам. Поэтому пайплайны для кода из форков должны запускаться без секретов и с минимальными правами.<\\/p>\\n<p>Почему это важно: система CI/CD имеет доступ и к коду, и к секретам, и к проду. Скомпрометировав её, атакующий получает всё сразу, и его изменения выглядят как обычный деплой. Поэтому CI я защищаю как продовую систему: MFA, минимальные права, изолированные раннеры, журналы аудита.<\\/p>","sources":["https://github.com/OWASP/www-project-top-10-ci-cd-security-risks"]},{"id":58,"num":59,"category":"DevSecOps и AppSec","text":"Как защитить GitHub Actions?","answer":"<p>Первое это права токена. <code>GITHUB_TOKEN<\\/code> нужно ограничивать явным блоком <code>permissions<\\/code> в workflow, по умолчанию только чтение, и выдавать запись только тем задачам, которым она нужна.<\\/p>\\n<p>Второе это сторонние actions. GitHub в документации по безопасному использованию прямо пишет, что закрепление action за полным SHA коммита сейчас единственный способ использовать его как неизменяемый релиз. Тег вроде <code>v4<\\/code> владелец или атакующий с доступом к репозиторию может перенаправить на другой код. Для автоматического обновления закреплённых SHA подходит Dependabot.<\\/p>\\n<p>Третье это недоверенный ввод. Опасный триггер <code>pull_request_target<\\/code> выполняется в контексте базового репозитория с доступом к секретам, и если в нём сделать checkout кода из пул-реквеста и запустить его, это прямое выполнение чужого кода с секретами. Ещё одна частая ошибка это подстановка <code>\${{ github.event.pull_request.title }}<\\/code> прямо в <code>run:<\\/code>, что даёт инъекцию команд через заголовок пул-реквеста. Правильно передавать такие значения через переменные окружения. И наконец, для доступа в облако использовать OIDC вместо сохранённых ключей, а self-hosted раннеры не использовать для публичных репозиториев.<\\/p>","sources":["https://docs.github.com/en/actions/reference/security/secure-use","https://docs.github.com/en/actions/concepts/security/openid-connect"]},{"id":59,"num":60,"category":"DevSecOps и AppSec","text":"Как CI получает доступ к облаку без статических ключей?","answer":"<p>Через OIDC-федерацию. Платформа CI, например GitHub Actions или GitLab CI, выступает провайдером идентификации и выдаёт каждому запуску подписанный короткоживущий JWT. В нём указано, из какого репозитория, ветки, окружения и workflow идёт запуск.<\\/p>\\n<p>В облаке настраивается доверие к этому провайдеру и роль с условием на claims токена, например разрешить принимать роль только для репозитория <code>org/app<\\/code> и ветки <code>main<\\/code>. Во время запуска CI обменивает свой токен на временные учётные данные облака (в AWS это <code>AssumeRoleWithWebIdentity<\\/code>), которые живут минуты или часы.<\\/p>\\n<p>Выигрыш в том, что в CI нет ни одного долгоживущего ключа, который можно украсть из переменных или логов, и не нужно ротировать ключи. Главное место, где ошибаются, это слишком широкое условие доверия: если не ограничить <code>sub<\\/code> конкретным репозиторием и веткой, роль сможет принять любой репозиторий, который использует тот же провайдер.<\\/p>","sources":["https://docs.github.com/en/actions/concepts/security/openid-connect","https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html"]},{"id":60,"num":61,"category":"DevSecOps и AppSec","text":"Как защищают ветки и процесс ревью кода?","answer":"<p>Основа это правила защиты основной ветки: изменения только через пул-реквест, обязательное одобрение как минимум одного ревьюера, который не является автором, обязательное прохождение статусных проверок (тесты, SAST, SCA), запрет force-push и удаления ветки. В GitHub это branch protection rules или rulesets, в GitLab protected branches.<\\/p>\\n<p>Дополнительно: CODEOWNERS назначает обязательных ревьюеров для чувствительных путей, например файлов пайплайна, инфраструктурного кода и модулей аутентификации. Сброс одобрений при новых коммитах не даёт протащить изменение после ревью. Требование подписанных коммитов позволяет проверить, что автор коммита действительно тот, за кого себя выдаёт, потому что имя и email в git задаются произвольно.<\\/p>\\n<p>Важно, чтобы правила распространялись и на администраторов, иначе это не контроль, а рекомендация. С точки зрения OWASP CI/CD это закрывает первый риск, недостаточный контроль потока: ни один человек в одиночку не может довести изменение до прода.<\\/p>","sources":["https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches","https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"]},{"id":61,"num":62,"category":"DevSecOps и AppSec","text":"Что такое dependency confusion и тайпсквоттинг?","answer":"<p>Dependency confusion возникает, когда у компании есть внутренний пакет, например <code>acme-utils<\\/code> во внутреннем реестре, а менеджер пакетов настроен искать и во внутреннем, и в публичном реестре. Атакующий публикует в публичный реестр пакет с тем же именем и большей версией, и менеджер пакетов выбирает его. Код атакующего выполняется при установке на машинах разработчиков и в CI.<\\/p>\\n<p>Тайпсквоттинг это публикация пакета с именем, похожим на популярный: опечатка, перестановка букв, лишний дефис. Разработчик ошибается при вводе имени и ставит вредоносный пакет.<\\/p>\\n<p>Защита: зарезервировать имена и пространства имён своей организации в публичных реестрах (scope в npm), настроить менеджер пакетов так, чтобы внутренние имена брались только из внутреннего реестра, использовать прокси-реестр с белым списком, фиксировать версии и хеши в lock-файлах, проверять новые зависимости перед добавлением. В MITRE ATT&amp;CK это подтехника компрометации зависимостей и инструментов разработки.<\\/p>","sources":["https://attack.mitre.org/techniques/T1195/001/","https://docs.npmjs.com/cli/v10/using-npm/scope"]},{"id":62,"num":63,"category":"DevSecOps и AppSec","text":"Зачем нужны lock-файлы и фиксация версий зависимостей?","answer":"<p>Lock-файл (<code>package-lock.json<\\/code>, <code>poetry.lock<\\/code>, <code>go.sum<\\/code>) фиксирует точные версии всех зависимостей, включая транзитивные, и обычно их хеши. Без него каждая установка может подтянуть новую версию в пределах разрешённого диапазона, и сборка в CI будет отличаться от того, что проверял разработчик.<\\/p>\\n<p>С точки зрения безопасности это даёт две вещи. Воспроизводимость: мы точно знаем, что попало в сборку, и можем это проверить сканером. Защиту от внезапной подмены: если мейнтейнера взломали и опубликовали вредоносную версию, она не приедет автоматически. Хеши дополнительно защищают от подмены содержимого пакета с той же версией.<\\/p>\\n<p>Обратная сторона в том, что зафиксированные версии сами не обновляются, и уязвимости накапливаются. Поэтому фиксацию всегда сочетают с автоматическими пул-реквестами на обновление через Dependabot или Renovate и с SCA. В CI устанавливать зависимости нужно строго по lock-файлу, например <code>npm ci<\\/code>, а не <code>npm install<\\/code>.<\\/p>","sources":["https://docs.npmjs.com/cli/v10/commands/npm-ci","https://go.dev/ref/mod#go-sum-files","https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/about-dependabot-version-updates"]},{"id":63,"num":64,"category":"DevSecOps и AppSec","text":"Какие проверки безопасности и где вы бы поставили в пайплайн?","answer":"<p>До коммита, на машине разработчика: сканер секретов в pre-commit и плагины SAST в IDE. Это самая дешёвая точка, но она не обязательная, поэтому всё повторяется дальше.<\\/p>\\n<p>В пул-реквесте: SAST по изменённому коду, SCA по зависимостям, сканирование секретов, проверка IaC (Terraform, манифесты Kubernetes) на ошибки конфигурации, линтер Dockerfile. Результаты показываются прямо в пул-реквесте комментариями. При сборке: сканирование образа контейнера на уязвимости, генерация SBOM, подпись образа и provenance.<\\/p>\\n<p>На стенде: DAST, например ZAP в режиме базового сканирования. При деплое: admission-политики в кластере проверяют подпись образа и базовые требования к подам. В проде: мониторинг, периодическое повторное сканирование образов, потому что новые CVE появляются в уже задеплоенных версиях. Принцип блокировки такой: сборку останавливают только критичные находки с доступным исправлением и найденные секреты, всё остальное уходит в бэклог с SLA, иначе пайплайн будет постоянно красным.<\\/p>\\n<pre><code>semgrep ci                                     # SAST по исходному коду\\ntrivy fs --scanners vuln,misconfig,secret .    # зависимости, IaC и секреты одним проходом<\\/code><\\/pre>\\n<p>В пул-реквесте быстрые проверки, SAST и поиск секретов, чтобы разработчик видел результат за минуты. Более тяжёлые сканы образа и DAST на этапе сборки и на стенде, а не на каждом коммите.<\\/p>","sources":["https://owasp.org/www-project-devsecops-guideline/","https://csrc.nist.gov/pubs/sp/800/218/final"]},{"id":64,"num":65,"category":"DevSecOps и AppSec","text":"Как бороться с ложными срабатываниями сканеров?","answer":"<p>Первое это настройка правил под свой стек. Из коробки SAST включает всё подряд, и значительная часть правил к вашему коду не относится. Я начинаю с небольшого набора правил с высокой точностью по самым опасным классам (инъекции, секреты, небезопасная десериализация) и расширяю постепенно.<\\/p>\\n<p>Второе это управляемое подавление. Ложное срабатывание помечается прямо в коде или в конфигурации сканера с обязательным комментарием, почему это не уязвимость, и это подавление проходит ревью. Бесконтрольные <code>nosec<\\/code> по всему коду хуже, чем отсутствие сканера.<\\/p>\\n<p>Третье это контекст при приоритизации. Для зависимостей это достижимость уязвимой функции и данные об эксплуатации: CISA KEV и EPSS, который оценивает вероятность эксплуатации CVE в ближайшие 30 дней. Для образов это VEX-заявления о том, что уязвимость в вашем продукте не эксплуатируется. Метрика, которую стоит отслеживать, это доля находок, которые разработчики помечают как ложные. Если она высокая, доверие к инструменту падает, и это надо чинить в первую очередь.<\\/p>","sources":["https://www.first.org/epss/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://semgrep.dev/docs/ignoring-files-folders-code"]},{"id":65,"num":66,"category":"DevSecOps и AppSec","text":"Как проверять безопасность инфраструктурного кода (IaC)?","answer":"<p>IaC-сканеры проверяют Terraform, CloudFormation, манифесты Kubernetes, Helm-чарты и Dockerfile на ошибки конфигурации до того, как они попадут в облако: публичный бакет, security group с <code>0.0.0.0/0<\\/code> на SSH, незашифрованный диск, под с привилегированным режимом, отсутствие логирования.<\\/p>\\n<p>Основные открытые инструменты: Checkov, KICS и Trivy. Отдельно отмечу, что tfsec, который раньше был популярен для Terraform, переведён в Trivy, и его проверки IaC теперь развиваются там. Сканер ставится в пул-реквест и показывает, какая строка какого ресурса нарушает какое правило.<\\/p>\\n<p>Статического сканирования недостаточно, потому что реальное состояние облака расходится с кодом: кто-то поменял руками через консоль. Поэтому добавляют обнаружение дрейфа (например <code>terraform plan<\\/code> по расписанию) и CSPM, который проверяет уже развёрнутое облако. Для своих требований, которых нет в готовых наборах, пишут правила как код на Rego через OPA и Conftest.<\\/p>","sources":["https://www.checkov.io/1.Welcome/What%20is%20Checkov.html","https://github.com/aquasecurity/tfsec","https://trivy.dev/latest/docs/scanner/misconfiguration/"]},{"id":66,"num":67,"category":"DevSecOps и AppSec","text":"Как сканировать образы контейнеров и что делать с найденным?","answer":"<p>Сканер образов (Trivy, Grype) разбирает слои образа, определяет пакеты операционной системы и библиотеки языков, и сверяет версии с базами уязвимостей. Сканировать нужно в двух местах: в CI после сборки, чтобы не пустить плохой образ в реестр, и периодически в реестре или кластере, потому что для уже задеплоенного образа завтра выйдет новая CVE.<\\/p>\\n<p>Большинство находок обычно приходит из базового образа. Поэтому первое действие это выбрать минимальную базу (distroless, Alpine, slim-варианты) и регулярно пересобирать образы, чтобы подтягивать исправления. Часто одна пересборка на свежую базу закрывает основную часть уязвимостей.<\\/p>\\n<p>Политику блокировки я строю так: критичная или высокая уязвимость с доступным исправлением останавливает сборку, остальное попадает в отчёт. Уязвимости без исправления фиксируем с решением: принять риск на срок, найти обходной путь, сменить компонент. Для них полезен флаг вроде <code>--ignore-unfixed<\\/code> в Trivy, чтобы пайплайн не был красным из-за того, что команда исправить не может.<\\/p>","sources":["https://trivy.dev/latest/docs/target/container_image/","https://github.com/anchore/grype","https://github.com/GoogleContainerTools/distroless"]},{"id":67,"num":68,"category":"DevSecOps и AppSec","text":"Как написать безопасный Dockerfile?","answer":"<p>Минимальный базовый образ с закреплённой версией, а лучше по digest, а не <code>latest<\\/code>. Многоэтапная сборка: компиляторы, исходники и инструменты сборки остаются в промежуточном этапе, в финальный образ копируется только результат. Чем меньше в образе, тем меньше уязвимостей и тем меньше инструментов у атакующего внутри контейнера.<\\/p>\\n<p>Запуск не от root: создать пользователя и указать <code>USER<\\/code>. Никаких секретов в слоях образа: ни <code>ARG<\\/code>, ни <code>ENV<\\/code>, ни скопированных файлов, потому что их можно достать из любого слоя. Для секретов на этапе сборки есть BuildKit secret mounts (<code>RUN --mount=type=secret<\\/code>), которые не сохраняются в образ.<\\/p>\\n<p>Также: <code>COPY<\\/code> вместо <code>ADD<\\/code> для локальных файлов, <code>.dockerignore<\\/code>, чтобы в контекст сборки не попали <code>.git<\\/code> и <code>.env<\\/code>, очистка кеша пакетного менеджера в том же слое. Проверять Dockerfile линтером (Hadolint) и IaC-сканером в пайплайне. Многие из этих требований совпадают с CIS Docker Benchmark.<\\/p>","sources":["https://docs.docker.com/build/building/best-practices/","https://docs.docker.com/build/building/secrets/","https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html"]},{"id":68,"num":69,"category":"DevSecOps и AppSec","text":"Что такое policy as code?","answer":"<p>Policy as code означает, что правила безопасности и соответствия описываются в виде кода, хранятся в git, проходят ревью и тесты, и автоматически применяются в пайплайне и в рантайме. Вместо документа «под не должен работать от root» есть политика, которая не пускает такой под в кластер.<\\/p>\\n<p>Самый универсальный движок это Open Policy Agent (OPA) с языком Rego. Его используют в Conftest для проверки конфигураций в CI, в Gatekeeper как admission controller в Kubernetes, для авторизации в API и в Terraform. Альтернатива для Kubernetes это Kyverno, где политики пишутся в YAML как обычные ресурсы Kubernetes, это проще для команд без опыта Rego. Kyverno также умеет изменять и генерировать ресурсы и проверять подписи образов.<\\/p>\\n<p>Выигрыш в единообразии и аудите: одна и та же политика проверяется и в пул-реквесте, и при деплое, изменения политик видны в истории git. Вводить политики разумно в режиме аудита, собрать нарушения, договориться с командами и только потом включать блокировку.<\\/p>","sources":["https://www.openpolicyagent.org/docs/latest/","https://kyverno.io/docs/introduction/","https://open-policy-agent.github.io/gatekeeper/website/docs/"]},{"id":69,"num":70,"category":"DevSecOps и AppSec","text":"Что такое NIST SSDF?","answer":"<p>SSDF (Secure Software Development Framework), NIST SP 800-218, это набор практик безопасной разработки, который не привязан к конкретной методологии, языку или инструментам. Его удобно использовать как общий язык между разработкой, безопасностью и заказчиком.<\\/p>\\n<p>Практики разделены на четыре группы. Prepare the Organization (PO): подготовить организацию, то есть роли, обучение, требования, инструменты. Protect the Software (PS): защитить код и артефакты от несанкционированного доступа и подмены, обеспечить проверку целостности релизов. Produce Well-Secured Software (PW): проектирование с учётом угроз, проверка кода, тестирование, безопасные настройки по умолчанию. Respond to Vulnerabilities (RV): находить, анализировать и исправлять уязвимости в выпущенном ПО и устранять их первопричины.<\\/p>\\n<p>Практическая ценность SSDF в том, что по нему удобно провести оценку текущего состояния: пройти по практикам и отметить, что уже есть, что частично, чего нет. Получается дорожная карта DevSecOps, которую можно показать руководству.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/218/final"]},{"id":70,"num":71,"category":"DevSecOps и AppSec","text":"Что такое OWASP SAMM и зачем модели зрелости?","answer":"<p>OWASP SAMM (Software Assurance Maturity Model) это открытая модель для оценки и улучшения программы безопасности разработки. Она делит работу на пять бизнес-функций: Governance, Design, Implementation, Verification, Operations. В каждой по три практики, и для каждой практики определены уровни зрелости с конкретными действиями.<\\/p>\\n<p>Зачем это нужно. Когда приходишь в компанию, где DevSecOps нет, хочется сразу поставить все сканеры. Модель зрелости помогает сначала честно оценить, где мы сейчас, выбрать целевой уровень для каждой практики с учётом рисков и ресурсов, и построить план по шагам. Результат понятен руководству: было так, станет так, вот что для этого нужно.<\\/p>\\n<p>Есть также BSIMM, но он устроен иначе: это описательная модель, которая показывает, что реально делают компании, участвующие в исследовании. SAMM предписывающая и открытая, её удобнее брать как план собственных действий.<\\/p>","sources":["https://owaspsamm.org/model/","https://owasp.org/www-project-samm/"]},{"id":71,"num":72,"category":"DevSecOps и AppSec","text":"Кто такие security champions и зачем они нужны?","answer":"<p>Security champion это разработчик в продуктовой команде, который помимо основной работы отвечает за вопросы безопасности в своей команде. Он не заменяет специалистов по безопасности, а служит связующим звеном: первым смотрит на находки сканеров, участвует в моделировании угроз, знает, к кому идти со сложным вопросом.<\\/p>\\n<p>Проблема, которую это решает, в масштабе. Специалистов по безопасности всегда намного меньше, чем разработчиков, и они физически не могут участвовать в каждом ревью и каждом обсуждении архитектуры. Чемпионы переносят знания в команды и поднимают вопросы безопасности рано, когда исправлять дёшево.<\\/p>\\n<p>Чтобы программа работала, нужны выделенное время (иначе безопасность всегда проигрывает сроку), обучение, регулярные встречи чемпионов между собой и признание их работы. У OWASP есть руководство по построению такой программы. Без поддержки руководства и выделенного времени программа обычно превращается в формальный список имён.<\\/p>","sources":["https://github.com/OWASP/www-project-security-champions-guidebook","https://owaspsamm.org/model/governance/education-and-guidance/"]},{"id":72,"num":73,"category":"DevSecOps и AppSec","text":"Что такое OWASP ASVS и как его используют?","answer":"<p>ASVS (Application Security Verification Standard) это стандарт требований к безопасности веб-приложений от OWASP. В отличие от Top 10, который просто перечисляет главные риски для повышения осведомлённости, ASVS даёт конкретные проверяемые требования по областям: аутентификация, управление сессиями, контроль доступа, валидация, криптография, логирование, конфигурация и другие.<\\/p>\\n<p>Требования разбиты на уровни. Первый уровень это минимум для любого приложения. Второй рекомендован для большинства приложений, работающих с чувствительными данными. Третий для критичных систем, где цена компрометации очень высока, например финансы и здравоохранение. Уровень выбирают по риску приложения.<\\/p>\\n<p>Как применять на практике: как чек-лист требований безопасности при проектировании, как основу для тест-кейсов безопасности, как критерии приёмки для подрядчика и как рамку для пентеста, чтобы тестировщики проверяли по понятному списку, а не на своё усмотрение.<\\/p>","sources":["https://github.com/OWASP/ASVS","https://asvs.dev/"]},{"id":73,"num":74,"category":"DevSecOps и AppSec","text":"Что входит в OWASP API Security Top 10?","answer":"<p>Актуальная редакция 2023 года. API1 Broken Object Level Authorization, то есть отсутствие проверки прав на конкретный объект (тот же IDOR). API2 Broken Authentication. API3 Broken Object Property Level Authorization, когда API отдаёт или позволяет менять поля объекта, которые пользователю не положены, например поле роли. API4 Unrestricted Resource Consumption, отсутствие лимитов. API5 Broken Function Level Authorization, доступ обычного пользователя к административным функциям.<\\/p>\\n<p>API6 Unrestricted Access to Sensitive Business Flows, злоупотребление бизнес-процессом через автоматизацию, например скупка товара ботами. API7 Server Side Request Forgery. API8 Security Misconfiguration. API9 Improper Inventory Management, забытые старые версии API и недокументированные эндпоинты. API10 Unsafe Consumption of APIs, слепое доверие данным от сторонних API.<\\/p>\\n<p>Заметно, что три пункта из десяти касаются авторизации. Для API это главная проблема, потому что каждый эндпоинт и каждое поле нужно защищать отдельно. На практике помогают централизованная проверка прав, явные схемы ответов вместо сериализации объекта целиком, инвентарь API по спецификациям OpenAPI и лимиты на шлюзе.<\\/p>","sources":["https://github.com/OWASP/API-Security/blob/master/editions/2023/en/0x11-t10.md"]},{"id":74,"num":75,"category":"DevSecOps и AppSec","text":"Как правильно делать валидацию входных данных?","answer":"<p>Основное правило: валидация на сервере, всегда. Проверки в браузере это удобство для пользователя, атакующий их просто обходит, отправляя запрос напрямую. Валидировать нужно как можно раньше, на входе в систему, все данные из недоверенных источников: параметры, заголовки, cookie, тело запроса, файлы, ответы сторонних API.<\\/p>\\n<p>Предпочтителен белый список: описываем, что допустимо (тип, длина, формат, диапазон, набор значений), и отвергаем всё остальное. Чёрный список опасных символов почти всегда обходится кодировками и вариантами записи. Для структурированных данных удобна валидация по схеме, например JSON Schema или OpenAPI.<\\/p>\\n<p>Важно понимать, что валидация ввода не заменяет защиту на выходе. Поле «имя» может законно содержать апостроф, как в O'Brien, и отвергать его нельзя. От SQL-инъекции защищает параметризация запроса, от XSS кодирование вывода по контексту. Валидация это дополнительный слой, который сужает поверхность атаки, а не главный механизм.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html"]},{"id":75,"num":76,"category":"DevSecOps и AppSec","text":"Что нельзя писать в логи и как логировать безопасно?","answer":"<p>В логи нельзя писать пароли, токены сессий и доступа, ключи API, строки подключения с паролями, полные номера карт, и без необходимости персональные данные. Логи копируются в много мест (агрегатор, бэкапы, SIEM, подрядчики), доступ к ним шире, чем к базе, и утечка через логи очень частая.<\\/p>\\n<p>Что логировать нужно по OWASP Logging Cheat Sheet: события аутентификации (успехи и неудачи), отказы в авторизации, ошибки валидации, изменения прав и настроек, административные действия, использование высокорисковых функций. У каждого события должны быть время, источник, пользователь, результат. Без этих событий нечего будет расследовать, и в OWASP Top 10:2025 это отдельная категория A09 Security Logging and Alerting Failures.<\\/p>\\n<p>Отдельная угроза это инъекция в логи: если писать пользовательский ввод как есть, атакующий может вставить перевод строки и подделать запись, а в худшем случае эксплуатировать уязвимость в самом логгере, как было с Log4Shell. Поэтому структурированное логирование (JSON), экранирование ввода, маскирование чувствительных полей на уровне библиотеки и защита логов от изменения.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html","https://top10.owasp.org/2025/A09_2025-Security_Logging_and_Alerting_Failures/"]},{"id":76,"num":77,"category":"DevSecOps и AppSec","text":"Как защитить вход от перебора паролей и credential stuffing?","answer":"<p>Перебор (brute force) это подбор пароля к одной учётке, credential stuffing это проверка пар логин-пароль, утёкших с других сайтов, по множеству учёток сразу. Второе сейчас встречается чаще, потому что люди повторяют пароли, и против него плохо работает блокировка одной учётной записи.<\\/p>\\n<p>Самая сильная защита это MFA, лучше устойчивая к фишингу: с ней утёкший пароль сам по себе бесполезен. Дальше: проверка паролей при установке по списку скомпрометированных, как требует NIST SP 800-63B; ограничение частоты попыток по учётке, по IP и по отпечатку устройства; нарастающие задержки вместо жёсткой блокировки, чтобы атакующий не мог заблокировать чужие учётки; CAPTCHA или другие проверки при подозрительной активности.<\\/p>\\n<p>Ещё важны одинаковые ответы и время ответа при неверном логине и неверном пароле, чтобы нельзя было перечислить существующих пользователей. И мониторинг: всплеск неудачных входов с множества адресов по разным учёткам это типичная картина credential stuffing, и на неё нужно правило в SIEM.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Credential_Stuffing_Prevention_Cheat_Sheet.html","https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html","https://pages.nist.gov/800-63-4/sp800-63b.html"]},{"id":77,"num":78,"category":"DevSecOps и AppSec","text":"Чем опасна небезопасная десериализация?","answer":"<p>Десериализация восстанавливает объект из потока байтов. Во многих языках нативные форматы (Java serialization, Python <code>pickle<\\/code>, PHP <code>unserialize<\\/code>, .NET BinaryFormatter) при восстановлении объекта могут вызывать его методы. Если атакующий контролирует входные данные, он может собрать цепочку объектов из классов, которые есть в приложении и его библиотеках, так что при десериализации выполнится произвольный код.<\\/p>\\n<p>Это одна из самых опасных уязвимостей, потому что часто ведёт сразу к удалённому выполнению кода. Встречается там, где сериализованные объекты передаются через недоверенный канал: cookie, скрытые поля форм, очереди сообщений, кеш, межсервисные вызовы.<\\/p>\\n<p>Защита по OWASP: не десериализовать недоверенные данные нативными форматами вообще, использовать простые форматы данных вроде JSON без автоматического восстановления типов. Если нативный формат неизбежен, то проверка целостности подписью до десериализации и белый список разрешённых классов. Например, документация Python прямо предупреждает, что модуль <code>pickle<\\/code> небезопасен для данных из недоверенных источников.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html","https://docs.python.org/3/library/pickle.html"]},{"id":78,"num":79,"category":"DevSecOps и AppSec","text":"Что такое path traversal и как его предотвратить?","answer":"<p>Path traversal (обход каталогов) возникает, когда приложение строит путь к файлу из пользовательского ввода. Атакующий передаёт что-то вроде <code>../../../etc/passwd<\\/code> и выходит за пределы разрешённой директории. Результат это чтение конфигурации, ключей, исходного кода, а при записи файлов даже перезапись исполняемых файлов и выполнение кода.<\\/p>\\n<p>Лучшая защита в том, чтобы вообще не принимать путь от пользователя. Вместо имени файла пользователь передаёт идентификатор, а приложение по нему находит путь в своей таблице. Если имя всё же нужно, то белый список допустимых символов и затем обязательная проверка: привести путь к каноническому виду (разрешить <code>..<\\/code>, символические ссылки) и убедиться, что результат начинается с разрешённой базовой директории.<\\/p>\\n<p>Чёрный список вида «удалить <code>../<\\/code>» обходится кодировками (<code>%2e%2e%2f<\\/code>), двойным кодированием и конструкциями вроде <code>....//<\\/code>. Дополнительный слой это процесс приложения с минимальными правами на файловую систему, чтобы даже при уязвимости он не мог прочитать чувствительные файлы. Уязвимость описана как CWE-22.<\\/p>","sources":["https://owasp.org/www-community/attacks/Path_Traversal","https://cwe.mitre.org/data/definitions/22.html"]},{"id":79,"num":80,"category":"DevSecOps и AppSec","text":"Как безопасно реализовать загрузку файлов?","answer":"<p>Загрузка файлов опасна сразу по нескольким направлениям: выполнение загруженного скрипта на сервере, хранимый XSS через HTML или SVG, обход каталогов через имя файла, отказ в обслуживании через огромные файлы или архивы-бомбы, вредонос для других пользователей.<\\/p>\\n<p>Основные меры по OWASP. Белый список расширений, нужных бизнесу, и проверка реального типа содержимого, а не заголовка <code>Content-Type<\\/code>, который задаёт клиент. Новое имя файла генерирует сервер, пользовательское имя в путь не попадает. Ограничение размера. Хранение вне корня веб-сервера, а лучше в отдельном объектном хранилище, откуда файлы нельзя выполнить.<\\/p>\\n<p>При отдаче файлов: заголовок <code>Content-Disposition: attachment<\\/code> для всего, что не должно открываться в браузере, <code>X-Content-Type-Options: nosniff<\\/code>, отдача с отдельного домена, чтобы XSS в загруженном файле не получил доступ к cookie основного сайта. Для документов и изображений полезна проверка антивирусом и перекодирование изображений, которое удаляет встроенное содержимое и метаданные.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html"]},{"id":80,"num":81,"category":"DevSecOps и AppSec","text":"Что такое инъекция команд ОС и как от неё защититься?","answer":"<p>Инъекция команд возникает, когда приложение вызывает системную команду через оболочку и подставляет в неё пользовательский ввод. Например <code>ping<\\/code> с адресом из формы: если ввести <code>8.8.8.8; cat /etc/passwd<\\/code>, оболочка выполнит обе команды. Результат обычно полный контроль над сервером с правами процесса приложения.<\\/p>\\n<p>Лучшая защита в том, чтобы не вызывать внешние команды, а использовать библиотеки языка для нужной операции. Если без команды не обойтись, вызывать её без оболочки, передавая аргументы списком, например <code>subprocess.run([\\"ping\\", \\"-c\\", \\"1\\", host])<\\/code> в Python без <code>shell=True<\\/code>. Тогда метасимволы оболочки (<code>;<\\/code>, <code>|<\\/code>, <code>$()<\\/code>) не интерпретируются.<\\/p>\\n<p>Дополнительно: валидация ввода по белому списку (для адреса это формат IP или имени хоста), защита от инъекции аргументов (значение, начинающееся с <code>-<\\/code>, может стать опцией, поэтому ставят <code>--<\\/code> перед позиционными аргументами), и запуск приложения с минимальными правами. SAST хорошо находит вызовы с <code>shell=True<\\/code> и склейку строк в командах, это правило стоит включить в блокирующий набор.<\\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/OS_Command_Injection_Defense_Cheat_Sheet.html","https://docs.python.org/3/library/subprocess.html#security-considerations"]},{"id":81,"num":82,"category":"DevSecOps и AppSec","text":"На что вы смотрите при ревью кода с точки зрения безопасности?","answer":"<p>Я иду от границ доверия: откуда в этот код приходят недоверенные данные и куда они уходят. Входы это параметры запросов, заголовки, файлы, сообщения из очередей, ответы внешних API. Опасные места назначения это SQL-запросы, команды ОС, пути к файлам, HTML-шаблоны, десериализация, исходящие HTTP-запросы по адресу из ввода. Если данные доходят до такого места без параметризации или проверки, это кандидат в уязвимость.<\\/p>\\n<p>Второе это авторизация. Для каждого нового эндпоинта: кто может его вызвать и проверяется ли, что объект принадлежит пользователю. Это самый частый класс проблем, и сканеры его почти не находят, потому что он зависит от бизнес-логики.<\\/p>\\n<p>Третье: работа с секретами и криптографией (захардкоженные ключи, свои алгоритмы, <code>random<\\/code> вместо криптостойкого генератора), обработка ошибок (не раскрываются ли детали пользователю, не остаётся ли система в открытом состоянии при исключении), логирование чувствительных данных, новые зависимости. OWASP Code Review Guide даёт подробный список, но на практике я держу короткий чек-лист под стек команды.<\\/p>","sources":["https://owasp.org/www-project-code-review-guide/","https://cheatsheetseries.owasp.org/cheatsheets/Secure_Code_Review_Cheat_Sheet.html"]},{"id":82,"num":83,"category":"DevSecOps и AppSec","text":"Как встроить DAST (например ZAP) в пайплайн?","answer":"<p>ZAP (Zed Attack Proxy) это открытый DAST-сканер, который раньше был проектом OWASP, а с 2023 года развивается независимо при поддержке Checkmarx,, у которого есть готовые сценарии для автоматизации. Базовое сканирование (baseline scan) пассивно обходит приложение пауком и анализирует ответы без атак: заголовки безопасности, флаги cookie, раскрытие информации. Оно быстрое и безопасное, его можно запускать на каждый деплой в тестовое окружение. Полное сканирование (full scan) уже выполняет активные атаки, занимает больше времени и запускается реже, например ночью.<\\/p>\\n<p>Для API есть отдельный режим сканирования по спецификации OpenAPI, и это важно: паук не найдёт эндпоинты API, которые не связаны ссылками. Для приложений с логином нужно настроить аутентификацию, иначе сканер проверит только страницу входа.<\\/p>\\n<p>Правила: активное сканирование только против своего тестового стенда с тестовыми данными, никогда против прода без согласования, потому что оно создаёт мусорные записи и может положить сервис. Результаты фильтруются через файл конфигурации правил: какие предупреждения блокируют сборку, какие только сообщаются, какие игнорируются как неприменимые.<\\/p>\\n<pre><code>docker run -t ghcr.io/zaproxy/zaproxy \\\\\\n  zap-baseline.py -t https://staging.example.com   # пассивный скан по стенду<\\/code><\\/pre>\\n<p><code>zap-baseline.py<\\/code> гоняет пассивные проверки против уже развёрнутого стенда и возвращает ненулевой код при находках, что удобно как шаг пайплайна. Активный скан запускают отдельно и только на тестовом окружении.<\\/p>","sources":["https://www.zaproxy.org/docs/docker/baseline-scan/","https://www.zaproxy.org/docs/docker/api-scan/","https://www.zaproxy.org/docs/docker/full-scan/","https://www.zaproxy.org/"]},{"id":83,"num":84,"category":"DevSecOps и AppSec","text":"Что такое фаззинг и где он полезен?","answer":"<p>Фаззинг это автоматическое тестирование, при котором программе подаются огромные объёмы специально сгенерированных некорректных или неожиданных входных данных, и отслеживаются падения, зависания, утечки памяти и нарушения проверок. Современные фаззеры управляются покрытием: они наблюдают, какие ветви кода выполнились, и мутируют входы так, чтобы дойти до новых ветвей.<\\/p>\\n<p>Лучше всего фаззинг работает для кода, который разбирает сложные форматы: парсеры, декодеры изображений и видео, сетевые протоколы, десериализаторы, особенно на языках с ручным управлением памятью. Там он находит переполнения буфера и использование освобождённой памяти, которые другие методы пропускают.<\\/p>\\n<p>Порог входа сейчас низкий. В Go фаззинг встроен в стандартный инструмент тестирования (<code>go test -fuzz<\\/code>), для C и C++ есть libFuzzer и AFL++, а Google OSS-Fuzz бесплатно и непрерывно фаззит критичные открытые проекты. В пайплайне фаззинг обычно запускают коротко на каждый пул-реквест и долго по расписанию.<\\/p>","sources":["https://go.dev/doc/security/fuzz/","https://google.github.io/oss-fuzz/","https://owasp.org/www-community/Fuzzing"]},{"id":84,"num":85,"category":"DevSecOps и AppSec","text":"Как выстроить процесс управления уязвимостями?","answer":"<p>Процесс это цикл: инвентаризация активов, обнаружение уязвимостей, приоритизация, исправление, проверка и отчётность. Без инвентаря он не работает, потому что нельзя защитить то, о чём вы не знаете.<\\/p>\\n<p>Приоритизация по одной оценке CVSS не работает: критичных уязвимостей слишком много. Я бы учитывал четыре фактора. Тяжесть по CVSS. Факт эксплуатации в реальных атаках по каталогу CISA KEV. Вероятность эксплуатации по EPSS, который оценивает её на ближайшие 30 дней. И контекст актива: доступен ли он из интернета, какие данные обрабатывает, есть ли компенсирующие меры.<\\/p>\\n<p>Для каждого уровня приоритета задаётся срок исправления (SLA), например уязвимость из KEV на внешнем сервисе в течение нескольких дней. Если исправить нельзя, фиксируется исключение с владельцем риска, сроком и компенсирующей мерой. Метрики, которые я бы показывал руководству: среднее время исправления по уровням, доля просроченных, покрытие активов сканированием. Для реакции на новые уязвимости в выпущенном ПО это практики группы RV в NIST SSDF.<\\/p>","sources":["https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://www.first.org/epss/","https://csrc.nist.gov/pubs/sp/800/40/r4/final"]},{"id":85,"num":86,"category":"DevSecOps и AppSec","text":"Как вы будете внедрять DevSecOps в команде, где его совсем нет?","answer":"<p>Сначала оценка, а не инструменты. Я бы поговорил с командами, посмотрел пайплайны и прошёлся по практикам NIST SSDF или OWASP SAMM, чтобы понять текущее состояние. Параллельно инвентаризация: какие репозитории, какие сервисы, что торчит наружу, где лежат секреты.<\\/p>\\n<p>Первые шаги выбираю по соотношению пользы и сопротивления. Обычно это сканирование секретов с push protection (сразу закрывает очень частую причину инцидентов), SCA с автоматическими пул-реквестами обновлений, защита основных веток с обязательным ревью. Всё это сначала в режиме отчёта, без блокировки, чтобы оценить объём находок и не сломать работу команд.<\\/p>\\n<p>Дальше постепенно: SAST с узким набором точных правил, сканирование образов и IaC, OIDC вместо ключей в CI, блокировка только по критичным находкам. Параллельно security champions в командах и короткое обучение на реальных находках из их же кода. Успех я бы измерял не числом инструментов, а метриками: время исправления критичных уязвимостей, число секретов в коде, доля сервисов под сканированием, и тем, отключают ли команды проверки.<\\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/218/final","https://owaspsamm.org/model/"]},{"id":86,"num":87,"category":"DevSecOps и AppSec","text":"Как защитить реестр контейнеров и артефактов?","answer":"<p>Реестр это точка, откуда кластер берёт то, что будет запущено в проде, поэтому его компрометация равна компрометации прода. Первое это доступ: запись в реестр только из CI через отдельную учётку или OIDC, у людей только чтение, у кластеров только чтение нужных репозиториев. Никаких общих токенов с правом записи у разработчиков.<\\/p>\\n<p>Второе это неизменяемость. Включить immutable tags, чтобы тег нельзя было перезаписать другим образом, а в манифестах деплоя ссылаться на образ по digest (<code>image@sha256:...<\\/code>), а не по тегу. Тогда даже при подмене тега в кластере запустится ровно то, что проверили.<\\/p>\\n<p>Третье: сканирование образов в реестре по расписанию, подписи и их проверка при допуске в кластер, политика очистки старых образов, журнал аудита операций. Для внешних образов разумно использовать прокси-кеш или зеркало с проверкой, а не тянуть напрямую из Docker Hub в прод: это и защита от подмены, и защита от ограничений частоты запросов.<\\/p>","sources":["https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html","https://kubernetes.io/docs/concepts/containers/images/"]},{"id":87,"num":88,"category":"DevSecOps и AppSec","text":"Какие метрики вы бы использовали для оценки программы DevSecOps?","answer":"<p>Я делю метрики на три группы. Покрытие: доля репозиториев с включёнными SAST, SCA и сканированием секретов, доля сервисов с подписанными образами, доля активов в инвентаре под сканированием уязвимостей. Это показывает, насколько широко вообще работают контроли.<\\/p>\\n<p>Результативность: среднее время исправления уязвимостей по уровням критичности, доля уязвимостей, исправленных в пределах SLA, число просроченных критичных находок, число секретов, найденных в коде, и сколько из них было заблокировано до push. Здесь важна динамика, а не абсолютное число, потому что при расширении покрытия находок сначала становится больше.<\\/p>\\n<p>Удобство для разработчиков: доля ложных срабатываний, время, которое проверки добавляют к пайплайну, число обходов и отключений проверок. Если эти показатели плохие, остальные скоро тоже станут плохими, потому что команды начнут избегать инструментов. Метрики не должны становиться целью сами по себе: «ноль уязвимостей в отчёте» легко получить, отключив сканер.<\\/p>","sources":["https://owaspsamm.org/model/governance/strategy-and-metrics/","https://csrc.nist.gov/pubs/sp/800/55/v1/final"]},{"id":88,"num":89,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое модель разделённой ответственности в облаке?","answer":"<p>Модель разделённой ответственности описывает, за что отвечает облачный провайдер, а за что клиент. В формулировке AWS провайдер отвечает за безопасность самого облака (security of the cloud): физические ЦОДы, оборудование, сеть, гипервизор, управляемые сервисы. Клиент отвечает за безопасность в облаке (security in the cloud): свои данные, учётные записи и права, конфигурацию сервисов, операционные системы виртуальных машин, код приложений.<\\/p>\\n<p>Граница сдвигается в зависимости от типа сервиса. На виртуальной машине (IaaS) патчить ОС и настраивать межсетевой экран должен клиент. В управляемой базе данных провайдер патчит движок и ОС, но пароли, доступ по сети, шифрование и бэкапы по-прежнему настраивает клиент. В SaaS на клиенте остаются в основном пользователи, права и данные.<\\/p>\\n<p>Практический вывод: большинство облачных инцидентов происходит не из-за взлома провайдера, а из-за ошибок на стороне клиента, прежде всего публичные хранилища, слишком широкие права IAM и утёкшие ключи доступа. Поэтому я начинаю аудит облака именно с этих трёх вещей.<\\/p>","sources":["https://aws.amazon.com/compliance/shared-responsibility-model/","https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility"]},{"id":89,"num":90,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как AWS принимает решение, разрешить запрос или нет?","answer":"<p>По умолчанию любой запрос запрещён (неявный запрет). Чтобы действие стало возможным, его должна разрешить хотя бы одна применимая политика: политика на личности (пользователь, роль) или политика на ресурсе (например политика бакета). При этом явный запрет (<code>Effect: Deny<\\/code>) в любой из применимых политик перекрывает любые разрешения. Это главное правило, которое нужно помнить.<\\/p>\\n<p>Поверх этого есть ограничивающие механизмы, которые сами ничего не разрешают, а только задают потолок. Permissions boundary на пользователе или роли: итоговые права это пересечение политик личности и границы. SCP в AWS Organizations задают максимум прав для всех учётных записей в организационной единице, включая администраторов этих учётных записей. Session policy ограничивает права конкретной временной сессии.<\\/p>\\n<p>На практике это используют так: SCP запрещают опасные действия на уровне организации (отключить CloudTrail, выйти из организации, работать в неиспользуемых регионах), permissions boundary позволяют делегировать командам создание ролей без риска эскалации, а политики личности выдают конкретные права по принципу наименьших привилегий.<\\/p>","sources":["https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html","https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html","https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html"]},{"id":90,"num":91,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Какие лучшие практики IAM в облаке вы знаете?","answer":"<p>Люди входят через централизованный провайдер идентификации с SSO и MFA (в AWS это IAM Identity Center) и получают временные учётные данные через роли, а не постоянные ключи доступа IAM-пользователей. Нагрузки (EC2, Lambda, поды) тоже работают через роли. Долгоживущие ключи доступа остаются только там, где без них никак, и регулярно ротируются.<\\/p>\\n<p>Права выдаются по принципу наименьших привилегий и сужаются со временем. Помогают IAM Access Analyzer, который находит ресурсы, доступные извне учётной записи, и генерирует политики по фактической активности из CloudTrail, и данные о последнем использовании прав. Широкие политики вроде <code>\\"Action\\": \\"*\\"<\\/code> для людей используются только как исключение с обоснованием.<\\/p>\\n<p>Root-пользователь защищён MFA, не имеет ключей доступа и не используется в ежедневной работе. Всё это регулярно проверяется автоматически, а не раз в год вручную: неиспользуемые роли и ключи, пользователи без MFA, политики с подстановочными знаками.<\\/p>","sources":["https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html","https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html"]},{"id":91,"num":92,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Зачем в облаке нужна мультиаккаунтная структура?","answer":"<p>Учётная запись AWS это самая сильная граница изоляции в облаке: ресурсы, права и квоты разных учётных записей по умолчанию полностью разделены. Если всё живёт в одной учётной записи, то ошибка в правах или компрометация одной роли потенциально даёт доступ ко всему сразу, включая прод.<\\/p>\\n<p>Типичная структура через AWS Organizations: отдельные учётные записи для прода, тестовых сред и разработки, отдельная учётная запись для централизованных журналов, куда пишут CloudTrail всех остальных и откуда их нельзя удалить из рабочих учётных записей, отдельная учётная запись для инструментов безопасности. Учётные записи группируются в организационные единицы, на которые навешиваются SCP.<\\/p>\\n<p>Выигрыш в том, что радиус поражения ограничен одной учётной записью, журналы защищены от атакующего, который получил права администратора в рабочей среде, а политики безопасности применяются централизованно. AWS описывает этот подход в руководстве по организации среды с несколькими учётными записями.<\\/p>","sources":["https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/organizing-your-aws-environment.html","https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"]},{"id":92,"num":93,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как защитить объектное хранилище вроде S3 от утечек?","answer":"<p>Первое это S3 Block Public Access на уровне всей учётной записи. По документации AWS новые бакеты, точки доступа и объекты по умолчанию не разрешают публичный доступ, но политикой бакета или правами объекта его можно открыть, а Block Public Access перекрывает такие политики. Если публичная раздача действительно нужна, её лучше делать через CDN с отдельным механизмом доступа, а не открытием бакета.<\\/p>\\n<p>Второе это права: доступ по ролям, условия в политике бакета (например доступ только через VPC endpoint или только из своей организации), отключённые ACL через настройку Object Ownership. Третье это шифрование: с 5 января 2023 года S3 автоматически шифрует все новые загружаемые объекты, а для чувствительных данных стоит использовать ключи KMS, тогда для чтения нужны права ещё и на ключ.<\\/p>\\n<p>Четвёртое это видимость: журналы доступа или события данных CloudTrail, IAM Access Analyzer для поиска бакетов, доступных извне, и сервис классификации данных вроде Amazon Macie, чтобы знать, в каких бакетах лежат персональные данные. Плюс версионирование и Object Lock для защиты от удаления и шифровальщиков.<\\/p>","sources":["https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html","https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html","https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingServerSideEncryption.html"]},{"id":93,"num":94,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как работает конвертное шифрование и сервис KMS?","answer":"<p>Конвертное шифрование (envelope encryption) использует два уровня ключей. Данные шифруются ключом данных (DEK), который генерируется для объекта или группы объектов. Сам ключ данных шифруется ключом шифрования ключей (KEK), который хранится в KMS и никогда не покидает его в открытом виде. Рядом с данными хранится только зашифрованный DEK.<\\/p>\\n<p>Почему так: шифровать гигабайты данных прямо в KMS медленно и дорого, а ключ данных работает локально и быстро. При этом доступ к данным всё равно контролирует KMS: чтобы расшифровать DEK, нужно право на KEK, и каждое такое обращение пишется в журнал. Ротация KEK не требует перешифровывать все данные.<\\/p>\\n<p>С точки зрения безопасности KMS даёт разделение обязанностей: администратор хранилища может управлять бакетом или базой, но без права на ключ не прочитает данные. По этой же схеме Kubernetes шифрует Secrets в etcd с провайдером KMS v2: данные шифруются DEK по AES-GCM, а DEK шифруются KEK во внешнем KMS.<\\/p>","sources":["https://docs.aws.amazon.com/kms/latest/developerguide/kms-cryptography.html","https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/"]},{"id":94,"num":95,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Какие журналы и сервисы обнаружения нужно включить в облаке?","answer":"<p>Базовый журнал это CloudTrail: кто, когда, откуда и какой вызов API сделал. Его включают для всех регионов и всех учётных записей организации, пишут в отдельную защищённую учётную запись с проверкой целостности файлов журнала. Без него расследовать облачный инцидент практически невозможно, потому что почти всё в облаке происходит через API.<\\/p>\\n<p>Дополнительно: VPC Flow Logs для сетевого трафика, журналы доступа балансировщиков и CDN, журналы DNS-запросов, события данных S3 для чувствительных бакетов, журналы аудита управляемого Kubernetes. Журналы нужно хранить достаточно долго, потому что атакующего часто обнаруживают через недели.<\\/p>\\n<p>Поверх журналов работает обнаружение угроз. В AWS это GuardDuty, который анализирует CloudTrail, Flow Logs и DNS и находит, например, использование учётных данных инстанса с адреса вне AWS, обращения к известным вредоносным адресам, майнинг. Находки централизуются в Security Hub и отправляются в SIEM. Важно не просто включить, а назначить, кто и в какой срок реагирует на находки.<\\/p>","sources":["https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html","https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html","https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"]},{"id":95,"num":96,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое CSPM и CNAPP?","answer":"<p>CSPM (Cloud Security Posture Management) это класс инструментов, которые непрерывно проверяют конфигурацию облачных ресурсов на соответствие правилам безопасности и стандартам: публичные бакеты, открытые порты управления, незашифрованные диски, отключённые журналы, пользователи без MFA. Проверки обычно привязаны к CIS Benchmarks для облаков и к требованиям стандартов вроде PCI DSS.<\\/p>\\n<p>Отличие от сканирования IaC в том, что CSPM смотрит на фактическое состояние облака, включая ресурсы, созданные вручную через консоль, и дрейф от кода. У провайдеров есть встроенные варианты: AWS Security Hub и Config, Microsoft Defender for Cloud, Google Security Command Center. Есть и открытые инструменты, например Prowler.<\\/p>\\n<p>CNAPP (Cloud-Native Application Protection Platform) это маркетинговый термин для платформ, которые объединяют CSPM, защиту нагрузок (CWPP), сканирование образов и IaC, анализ прав (CIEM) в одном продукте. Главная ценность такой платформы в связывании: не просто «уязвимый образ», а «уязвимый образ, доступный из интернета, с ролью, которая читает бакет с персональными данными».<\\/p>","sources":["https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html","https://www.cisecurity.org/cis-benchmarks","https://github.com/prowler-cloud/prowler"]},{"id":96,"num":97,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как устроена сетевая безопасность в облачной VPC?","answer":"<p>Базовая схема: публичные подсети только для того, что должно принимать трафик из интернета (балансировщики, NAT), а приложения и базы в приватных подсетях без публичных адресов. Исходящий доступ в интернет из приватных подсетей через NAT, а к облачным сервисам через VPC endpoints, чтобы трафик к S3 или KMS не выходил в интернет и можно было ограничить его политикой эндпоинта.<\\/p>\\n<p>Фильтрация на двух уровнях. Security groups работают с состоянием на уровне сетевого интерфейса и позволяют ссылаться на другие группы, например «база принимает 5432 только от группы приложения», это удобнее и надёжнее, чем списки адресов. Network ACL работают без состояния на уровне подсети и служат грубым дополнительным слоем.<\\/p>\\n<p>Типичные ошибки, которые я ищу при аудите: security group с <code>0.0.0.0/0<\\/code> на SSH, RDP или порты баз данных, базы с публичным адресом, отсутствие Flow Logs. Для администрирования вместо открытого SSH лучше использовать сессии через Systems Manager или бастион с проверкой личности, тогда входящие порты управления вообще не нужны.<\\/p>","sources":["https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html","https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html","https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html"]},{"id":97,"num":98,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как контейнер изолирован от хоста и почему это не виртуальная машина?","answer":"<p>Контейнер это обычный процесс на хосте, которому ядро Linux показывает ограниченный вид системы. Изоляцию дают namespaces: свой вид процессов (PID), сети, точек монтирования, имени хоста, IPC, пользователей. Ограничение ресурсов дают cgroups: сколько CPU, памяти, процессов может использовать контейнер. Дальше права сужают capabilities, seccomp и модули LSM вроде AppArmor и SELinux.<\\/p>\\n<p>Ключевое отличие от виртуальной машины в том, что у всех контейнеров на хосте одно общее ядро. Виртуальная машина имеет своё ядро, а граница проходит по гипервизору, у которого намного меньше поверхность атаки. У контейнера граница это весь интерфейс системных вызовов ядра Linux. Уязвимость в ядре или ошибка конфигурации может позволить выйти из контейнера на хост.<\\/p>\\n<p>Поэтому для нагрузок с разным уровнем доверия, например код клиентов в мультиарендной платформе, одного контейнера мало. Используют песочницы вроде gVisor или Kata Containers, отдельные узлы для разных уровней доверия, или виртуальные машины.<\\/p>","sources":["https://man7.org/linux/man-pages/man7/namespaces.7.html","https://man7.org/linux/man-pages/man7/cgroups.7.html","https://docs.docker.com/engine/security/"]},{"id":98,"num":99,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое Linux capabilities и почему опасен привилегированный контейнер?","answer":"<p>Capabilities делят всемогущество root на отдельные привилегии: <code>CAP_NET_BIND_SERVICE<\\/code> для привязки к портам ниже 1024, <code>CAP_NET_ADMIN<\\/code> для настройки сети, <code>CAP_SYS_ADMIN<\\/code> для огромного набора административных операций и так далее. Процесс может быть root по UID, но иметь только часть capabilities. Docker по умолчанию запускает контейнеры с урезанным набором.<\\/p>\\n<p>Привилегированный режим (<code>--privileged<\\/code> в Docker, <code>privileged: true<\\/code> в Kubernetes) отдаёт контейнеру практически все capabilities, доступ ко всем устройствам хоста и отключает часть защит вроде seccomp и AppArmor. Из такого контейнера выйти на хост тривиально, например смонтировав диск хоста. По сути это root на узле.<\\/p>\\n<p>Правильная настройка: <code>drop: [\\"ALL\\"]<\\/code> и добавление только того, что действительно нужно (обычно ничего или <code>NET_BIND_SERVICE<\\/code>), плюс <code>allowPrivilegeEscalation: false<\\/code>. Профиль Restricted в Pod Security Standards именно этого и требует. Особо опасны <code>SYS_ADMIN<\\/code>, <code>SYS_PTRACE<\\/code>, <code>SYS_MODULE<\\/code> и <code>NET_ADMIN<\\/code>, их появление в манифесте я бы всегда разбирал отдельно.<\\/p>","sources":["https://man7.org/linux/man-pages/man7/capabilities.7.html","https://docs.docker.com/engine/containers/run/#runtime-privilege-and-linux-capabilities","https://kubernetes.io/docs/concepts/security/pod-security-standards/"]},{"id":99,"num":100,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое seccomp, AppArmor и SELinux?","answer":"<p>Seccomp ограничивает, какие системные вызовы процесс может делать. Контейнеру обычно нужна малая часть из сотен системных вызовов ядра, и запрет остальных сильно уменьшает поверхность атаки на ядро. У рантаймов контейнеров есть профиль по умолчанию, в Kubernetes он включается как <code>seccompProfile: type: RuntimeDefault<\\/code>. Профиль Restricted в Pod Security Standards требует, чтобы профиль seccomp был задан явно, допустимы значения <code>RuntimeDefault<\\/code> или <code>Localhost<\\/code>, а <code>Unconfined<\\/code> и отсутствие профиля запрещены.<\\/p>\\n<p>AppArmor и SELinux это модули безопасности ядра с принудительным контролем доступа (MAC). AppArmor использует профили на основе путей: какие файлы процесс может читать и писать, какие операции делать. Он распространён в Ubuntu и Debian. SELinux использует метки на всех объектах системы и политику, какие метки процессов могут обращаться к каким меткам объектов. Он распространён в RHEL, где контейнерам по умолчанию назначаются метки, изолирующие их друг от друга и от хоста.<\\/p>\\n<p>Главная мысль в том, что это дополнительные слои, которые работают даже тогда, когда процесс в контейнере стал root. Отключать их ради совместимости без разбора причины я бы не стал: обычно проблему решает точечное исключение в профиле.<\\/p>","sources":["https://kubernetes.io/docs/tutorials/security/seccomp/","https://kubernetes.io/docs/tutorials/security/apparmor/","https://docs.docker.com/engine/security/seccomp/","https://kubernetes.io/docs/concepts/security/pod-security-standards/"]},{"id":100,"num":101,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как происходит побег из контейнера и как его предотвратить?","answer":"<p>Чаще всего побег возможен не из-за уязвимости, а из-за конфигурации. Привилегированный контейнер или контейнер с <code>SYS_ADMIN<\\/code> может смонтировать диск хоста. Смонтированный сокет Docker (<code>/var/run/docker.sock<\\/code>) позволяет создать новый привилегированный контейнер с корнем хоста внутри, это равносильно root на хосте. Монтирование <code>hostPath<\\/code> с чувствительными каталогами, <code>hostPID<\\/code> или <code>hostNetwork<\\/code> тоже ломают изоляцию.<\\/p>\\n<p>Реже используются уязвимости ядра или рантайма, потому что ядро общее. Пример уязвимости рантайма это CVE-2019-5736 в runc, которая позволяла из контейнера перезаписать бинарник runc на хосте. Такие случаи закрываются обновлением ядра и рантайма.<\\/p>\\n<p>Защита: запрет привилегированных контейнеров, hostPath, hostPID, hostNetwork и монтирования сокета рантайма через Pod Security Standards уровня Baseline или Restricted и admission-политики; запуск не от root и с <code>readOnlyRootFilesystem<\\/code>; seccomp и AppArmor или SELinux; своевременное обновление узлов; обнаружение подозрительного поведения в рантайме инструментами вроде Falco. В MITRE ATT&amp;CK это техника Escape to Host.<\\/p>","sources":["https://attack.mitre.org/techniques/T1611/","https://nvd.nist.gov/vuln/detail/CVE-2019-5736","https://docs.docker.com/engine/security/#docker-daemon-attack-surface"]},{"id":101,"num":102,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое rootless-контейнеры и user namespaces?","answer":"<p>User namespace позволяет процессу иметь UID 0 внутри контейнера, который на хосте соответствует обычному непривилегированному пользователю. Процесс считает себя root и может выполнять операции внутри своего пространства, но если он выберется из контейнера, на хосте у него не будет прав root. Это сильно снижает последствия побега.<\\/p>\\n<p>Rootless-режим идёт дальше: и сам демон или рантайм контейнеров работает без прав root. Docker и Podman поддерживают такой режим. Компрометация демона тогда тоже не даёт root на хосте. Есть ограничения, например с привязкой к низким портам и частью сетевых функций, поэтому для серверов это пока не всегда вариант по умолчанию.<\\/p>\\n<p>В Kubernetes поддержка user namespaces для подов включается полем <code>hostUsers: false<\\/code> в спецификации пода. Независимо от этого базовое требование остаётся: приложение в контейнере не должно работать от root (<code>runAsNonRoot: true<\\/code> и явный <code>runAsUser<\\/code>), это требование профиля Restricted.<\\/p>","sources":["https://man7.org/linux/man-pages/man7/user_namespaces.7.html","https://docs.docker.com/engine/security/rootless/","https://kubernetes.io/docs/concepts/workloads/pods/user-namespaces/"]},{"id":102,"num":103,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое песочницы для контейнеров вроде gVisor и Kata Containers?","answer":"<p>Это рантаймы, которые добавляют ещё одну границу между контейнером и ядром хоста, чтобы уязвимость ядра не давала сразу выйти на хост.<\\/p>\\n<p>gVisor реализует значительную часть интерфейса ядра Linux в пространстве пользователя. Системные вызовы приложения перехватывает компонент gVisor, а к ядру хоста сам gVisor обращается через узкий набор вызовов. Kata Containers запускает каждый под или контейнер в лёгкой виртуальной машине со своим ядром, то есть граница проходит по гипервизору, как у обычной ВМ, но с интерфейсом контейнеров.<\\/p>\\n<p>Цена это производительность и совместимость: у gVisor есть накладные расходы на системные вызовы и неполная поддержка некоторых функций ядра, у Kata дольше старт и больше расход памяти. В Kubernetes такие рантаймы подключаются через <code>RuntimeClass<\\/code>, и ими пользуются выборочно: для недоверенного кода, мультиарендных нагрузок, обработки файлов от пользователей.<\\/p>","sources":["https://gvisor.dev/docs/","https://katacontainers.io/learn/","https://kubernetes.io/docs/concepts/containers/runtime-class/"]},{"id":103,"num":104,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Какие компоненты Kubernetes являются основной поверхностью атаки?","answer":"<p>API server это главный вход в кластер: через него делается всё. Его доступность из интернета, слабая аутентификация или анонимный доступ с лишними правами означают прямую угрозу всему кластеру. Лучше, когда он доступен только из приватной сети или по белому списку адресов.<\\/p>\\n<p>etcd хранит всё состояние кластера, включая Secrets, которые по умолчанию, по документации Kubernetes, хранятся там незашифрованными. Прямой доступ к etcd равен полному контролю над кластером. Kubelet на каждом узле имеет свой HTTPS API, через который можно выполнять команды в контейнерах. По документации запросы к нему, не отклонённые другими методами аутентификации, по умолчанию считаются анонимными, поэтому анонимный доступ нужно отключать флагом <code>--anonymous-auth=false<\\/code> и включать авторизацию через API server.<\\/p>\\n<p>Дальше идут нагрузки: уязвимое приложение в поде даёт точку входа, а дальше атакующий использует токен ServiceAccount, сетевую доступность других подов, метаданные облака и слабые настройки пода для продвижения. OWASP Kubernetes Top 10 редакции 2025 отдельно выделяет избыточно открытые компоненты кластера и горизонтальное перемещение из кластера в облако.<\\/p>","sources":["https://kubernetes.io/docs/concepts/security/api-server-bypass-risks/","https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/","https://kubernetes.io/docs/concepts/configuration/secret/"]},{"id":104,"num":105,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как проходит запрос к API Kubernetes с точки зрения безопасности?","answer":"<p>Запрос проходит три этапа. Аутентификация определяет, кто делает запрос: клиентский сертификат, токен ServiceAccount, OIDC-токен от корпоративного провайдера. Важно, что обычных пользователей в Kubernetes как объектов нет, личность берётся из внешнего источника.<\\/p>\\n<p>Авторизация решает, можно ли этому субъекту выполнить это действие (глагол) над этим ресурсом в этом пространстве имён. Основной механизм это RBAC: Role и ClusterRole описывают права, RoleBinding и ClusterRoleBinding привязывают их к пользователям, группам и ServiceAccount. Права в RBAC только разрешающие, запретов нет, поэтому всё, что явно не разрешено, запрещено.<\\/p>\\n<p>Admission control это цепочка контроллеров, которые могут изменить объект (mutating) или отклонить его (validating) уже после авторизации. Здесь работают Pod Security Admission, квоты, политики Kyverno или Gatekeeper, проверка подписей образов. Именно на этом этапе можно запретить, например, привилегированный под, даже если у пользователя есть право создавать поды.<\\/p>","sources":["https://kubernetes.io/docs/concepts/security/controlling-access/","https://kubernetes.io/docs/reference/access-authn-authz/rbac/","https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/"]},{"id":105,"num":106,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Какие ошибки в RBAC Kubernetes приводят к эскалации привилегий?","answer":"<p>Самая очевидная ошибка это выдача <code>cluster-admin<\\/code> или ролей с подстановочными знаками <code>*<\\/code> по ресурсам и глаголам сервисам и людям, которым это не нужно. Подстановочные знаки опасны ещё и тем, что автоматически захватывают ресурсы, которые появятся в будущем.<\\/p>\\n<p>Менее очевидные права, которые документация Kubernetes прямо называет рискованными. Право создавать поды в пространстве имён фактически даёт доступ ко всем Secrets и ServiceAccount этого пространства, потому что под может смонтировать любой из них. Право <code>list<\\/code> и <code>watch<\\/code> на Secrets раскрывает их содержимое. Глаголы <code>escalate<\\/code>, <code>bind<\\/code> и <code>impersonate<\\/code> позволяют выдать себе больше прав или действовать от имени другого субъекта. Право на <code>nodes/proxy<\\/code> даёт доступ к API kubelet. Право изменять admission webhooks позволяет перехватывать объекты.<\\/p>\\n<p>Как проверять: <code>kubectl auth can-i --list --as=system:serviceaccount:ns:name<\\/code> для конкретного субъекта, регулярный обзор привязок к <code>cluster-admin<\\/code>, инструменты анализа RBAC. В OWASP Kubernetes Top 10:2025 это пункт K02 Overly Permissive Authorization Configurations.<\\/p>","sources":["https://kubernetes.io/docs/concepts/security/rbac-good-practices/","https://kubernetes.io/docs/reference/access-authn-authz/rbac/#privilege-escalation-prevention-and-bootstrapping","https://owasp.org/www-project-kubernetes-top-ten/"]},{"id":106,"num":107,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как защищать ServiceAccount и их токены?","answer":"<p>ServiceAccount это личность, под которой под обращается к API Kubernetes. По документации начиная с версии 1.22 Kubernetes выдаёт поду короткоживущий автоматически ротируемый токен через TokenRequest API и монтирует его как projected volume. До 1.22 использовался долгоживущий статический токен в Secret, и такие старые токены стоит найти и удалить.<\\/p>\\n<p>По умолчанию токен монтируется в каждый под, даже если приложению API Kubernetes вообще не нужен. Если атакующий получил выполнение кода в поде, первое, что он делает, это читает токен из <code>/var/run/secrets/kubernetes.io/serviceaccount/<\\/code>. Поэтому для приложений, которым API не нужен, ставят <code>automountServiceAccountToken: false<\\/code>.<\\/p>\\n<p>Остальные правила: у каждого приложения свой ServiceAccount, а не <code>default<\\/code>; права выдаются минимальные и в пределах своего пространства имён; ServiceAccount по умолчанию не получает никаких прав. Для доступа из пода в облако используют workload identity (IRSA или EKS Pod Identity в AWS), а не ключи облака в Secret.<\\/p>","sources":["https://kubernetes.io/docs/concepts/security/service-accounts/","https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"]},{"id":107,"num":108,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое Pod Security Standards и Pod Security Admission?","answer":"<p>Pod Security Standards это три профиля требований к подам. Privileged без ограничений, для системных компонентов, которым действительно нужен доступ к узлу. Baseline запрещает известные способы повышения привилегий: привилегированные контейнеры, hostPath, hostNetwork, hostPID, опасные capabilities. Restricted по документации нацелен на применение текущих лучших практик усиления подов ценой части совместимости: запуск не от root, запрет повышения привилегий, сброс всех capabilities, обязательный seccomp-профиль.<\\/p>\\n<p>Pod Security Admission это встроенный admission controller, который применяет эти профили к пространству имён через метки. Режимов три: <code>enforce<\\/code> отклоняет нарушающие поды, <code>audit<\\/code> добавляет запись в журнал аудита, <code>warn<\\/code> показывает пользователю предупреждение. Режимы можно комбинировать и задавать для них разные уровни.<\\/p>\\n<p>Практический путь внедрения: поставить на все пространства имён <code>warn<\\/code> и <code>audit<\\/code> на уровне Restricted, <code>enforce<\\/code> на Baseline, собрать нарушения, исправить манифесты и затем поднять <code>enforce<\\/code> до Restricted для прикладных пространств. PSA заменил устаревший PodSecurityPolicy, который удалён из Kubernetes. Для более тонких правил поверх него используют Kyverno или Gatekeeper.<\\/p>","sources":["https://kubernetes.io/docs/concepts/security/pod-security-standards/","https://kubernetes.io/docs/concepts/security/pod-security-admission/"]},{"id":108,"num":109,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Какие поля securityContext вы бы настроили для пода?","answer":"<p>Минимальный набор, который соответствует профилю Restricted:<\\/p>\\n<pre><code>securityContext:\\n  runAsNonRoot: true\\n  runAsUser: 10001\\n  seccompProfile:\\n    type: RuntimeDefault\\ncontainers:\\n- name: app\\n  securityContext:\\n    allowPrivilegeEscalation: false\\n    readOnlyRootFilesystem: true\\n    capabilities:\\n      drop: [\\"ALL\\"]<\\/code><\\/pre>\\n<p><code>runAsNonRoot<\\/code> не даст запустить контейнер от UID 0. <code>allowPrivilegeEscalation: false<\\/code> запрещает процессу получить больше прав, чем у родителя, например через setuid-бинарники. <code>capabilities.drop: [\\"ALL\\"]<\\/code> убирает все capabilities. <code>seccompProfile: RuntimeDefault<\\/code> ограничивает системные вызовы. <code>readOnlyRootFilesystem<\\/code> не даёт атакующему записать и запустить свои файлы, а для временных данных монтируется <code>emptyDir<\\/code>.<\\/p>\\n<p>Плюс на уровне спецификации пода: не использовать <code>hostNetwork<\\/code>, <code>hostPID<\\/code>, <code>hostIPC<\\/code> и <code>hostPath<\\/code>, <code>automountServiceAccountToken: false<\\/code>, если API не нужен, и задавать лимиты ресурсов, чтобы один под не мог исчерпать узел.<\\/p>","sources":["https://kubernetes.io/docs/tasks/configure-pod-container/security-context/","https://kubernetes.io/docs/concepts/security/pod-security-standards/"]},{"id":109,"num":110,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как работает NetworkPolicy в Kubernetes?","answer":"<p>По умолчанию в Kubernetes все поды могут обращаться ко всем подам во всех пространствах имён. Это плоская сеть, и скомпрометированный под сразу видит базы данных и внутренние сервисы других команд.<\\/p>\\n<p>NetworkPolicy описывает, какой трафик разрешён для выбранных подов: входящий (ingress) и исходящий (egress), с отбором источников и назначений по меткам подов, меткам пространств имён и диапазонам IP. Как только на под действует хотя бы одна политика определённого направления, всё, что ею не разрешено, для этого направления запрещается. Важно, что политики применяет сетевой плагин (например Calico или Cilium), и если плагин их не поддерживает, объекты создаются, но ничего не делают.<\\/p>\\n<p>Практический порядок: в каждом пространстве имён политика запрета по умолчанию для входящего и исходящего трафика, затем явные разрешения. При запрете исходящего трафика нужно не забыть разрешить DNS, иначе всё сломается. Отдельно стоит запретить подам доступ к адресу метаданных облака <code>169.254.169.254<\\/code>, если он им не нужен. В OWASP Kubernetes Top 10:2025 это пункт K05 Missing Network Segmentation Controls.<\\/p>","sources":["https://kubernetes.io/docs/concepts/services-networking/network-policies/","https://owasp.org/www-project-kubernetes-top-ten/"]},{"id":110,"num":111,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как правильно хранить секреты в Kubernetes?","answer":"<p>Первое, что нужно знать: значения в Secret хранятся в Base64, это кодирование, а не шифрование. Документация Kubernetes прямо предупреждает, что по умолчанию Secrets хранятся в etcd незашифрованными, их может прочитать любой с доступом к API или к etcd, а также любой, кто может создать под в этом пространстве имён.<\\/p>\\n<p>Меры из документации: включить шифрование при хранении (encryption at rest) через конфигурацию <code>--encryption-provider-config<\\/code>, лучше с провайдером KMS v2 и внешним KMS. Если первым в списке стоит провайдер <code>identity<\\/code>, шифрования нет. Ограничить RBAC так, чтобы <code>get<\\/code>, <code>list<\\/code> и <code>watch<\\/code> на Secrets были только у тех, кому они нужны. В управляемых кластерах шифрование через облачный KMS обычно включается одной настройкой.<\\/p>\\n<p>Следующий уровень это хранить секреты вне кластера во внешнем хранилище (Vault, AWS Secrets Manager) и доставлять их через External Secrets Operator или CSI-драйвер Secrets Store. Тогда источник правды, ротация и аудит находятся в хранилище. Секреты в git допустимы только в зашифрованном виде, например через Sealed Secrets или SOPS.<\\/p>","sources":["https://kubernetes.io/docs/concepts/configuration/secret/","https://kubernetes.io/docs/concepts/security/secrets-good-practices/","https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/"]},{"id":111,"num":112,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Как защитить etcd?","answer":"<p>etcd хранит всё состояние кластера, и доступ на запись в него равнозначен полному контролю над кластером, а на чтение раскрывает все Secrets. Документация Kubernetes так и формулирует: доступ к etcd эквивалентен root-доступу к кластеру.<\\/p>\\n<p>Меры: etcd доступен только API server и только по сети управляющего слоя, клиенты аутентифицируются по взаимному TLS с клиентскими сертификатами, трафик между членами кластера etcd тоже шифруется TLS. Шифрование данных при хранении включается на уровне API server через конфигурацию encryption provider, потому что сам etcd получает уже зашифрованные значения.<\\/p>\\n<p>Отдельно бэкапы: снимок etcd содержит все секреты, поэтому бэкапы шифруются и хранятся с таким же ограничением доступа, как и сам etcd. В управляемых кластерах (EKS, GKE, AKS) etcd обслуживает провайдер, и на клиенте остаётся включить шифрование Secrets через KMS и ограничить доступ к API.<\\/p>","sources":["https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/","https://etcd.io/docs/v3.5/op-guide/security/"]},{"id":112,"num":113,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое admission controllers и как ими обеспечивают политики?","answer":"<p>Admission controllers получают запрос на создание или изменение объекта после аутентификации и авторизации и могут его изменить или отклонить. Встроенные контроллеры включаются в API server: например Pod Security Admission, NodeRestriction, который не даёт kubelet менять чужие узлы и поды, ResourceQuota и LimitRanger.<\\/p>\\n<p>Для своих правил используют динамические admission webhooks. На их основе работают OPA Gatekeeper и Kyverno: политики вроде «образы только из нашего реестра», «обязательны лимиты ресурсов», «запрещён тег latest», «только подписанные образы», «обязательные метки владельца». Есть и встроенная альтернатива без вебхуков, ValidatingAdmissionPolicy на языке выражений CEL.<\\/p>\\n<p>Важные детали эксплуатации. Если вебхук недоступен, поведение задаётся <code>failurePolicy<\\/code>: <code>Fail<\\/code> безопаснее, но может остановить деплои при сбое движка политик. Системные пространства имён обычно исключают, чтобы не сломать сам кластер. И право менять конфигурацию вебхуков должно быть у очень узкого круга, иначе политики можно просто отключить.<\\/p>","sources":["https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/","https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/","https://kyverno.io/docs/introduction/"]},{"id":113,"num":114,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Зачем нужен журнал аудита Kubernetes и что в нём смотреть?","answer":"<p>Журнал аудита API server записывает запросы к API: кто, когда, с какого адреса, какое действие над каким объектом и с каким результатом. Это главный источник для расследования инцидентов в кластере, потому что почти всё в Kubernetes делается через API. Какие события и с какой детализацией писать, задаёт политика аудита: уровни <code>None<\\/code>, <code>Metadata<\\/code>, <code>Request<\\/code>, <code>RequestResponse<\\/code>.<\\/p>\\n<p>Политику настраивают осторожно: для Secrets писать только метаданные, иначе содержимое секретов окажется в журнале, а шумные служебные запросы вроде чтения endpoints исключать, чтобы не утонуть в объёме. Журналы отправляются в SIEM, в управляемых кластерах их нужно явно включить.<\\/p>\\n<p>На что ставить правила: создание привязок к <code>cluster-admin<\\/code>, изменения RBAC, <code>exec<\\/code> и <code>attach<\\/code> в поды в проде, создание привилегированных подов или подов с hostPath, чтение Secrets необычными субъектами, анонимные запросы, изменение admission webhooks, массовые отказы в авторизации от одного ServiceAccount. В OWASP Kubernetes Top 10:2025 недостаточное логирование и мониторинг это K10.<\\/p>","sources":["https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/","https://owasp.org/www-project-kubernetes-top-ten/"]},{"id":114,"num":115,"category":"Безопасность облака, контейнеров и Kubernetes","text":"Что такое runtime security и как работает Falco?","answer":"<p>Runtime security это обнаружение атак во время работы нагрузок, а не до деплоя. Сканеры и политики допуска проверяют то, что мы собираемся запустить, но не видят, что атакующий делает в уже работающем контейнере через уязвимость в приложении.<\\/p>\\n<p>Falco это открытый инструмент CNCF, который собирает системные вызовы с узла через драйвер ядра или eBPF и сопоставляет их с правилами, обогащая событие контекстом Kubernetes (под, пространство имён, образ). Примеры правил из коробки: запуск оболочки в контейнере, запись в каталоги бинарников, чтение
