<script>
var DATA = {"categories":["Основы безопасности","DevSecOps и AppSec","Безопасность облака, контейнеров и Kubernetes","Blue team и SOC","GRC и compliance"],"questions":[{"id":0,"num":1,"category":"Основы безопасности","text":"Что такое триада CIA?","answer":"<p>CIA это три базовых свойства информации, которые мы защищаем: конфиденциальность (confidentiality), целостность (integrity) и доступность (availability). Почти любое требование безопасности в итоге сводится к одному из них.<\/p>\n<p>Конфиденциальность означает, что данные видят только те, кому положено. Её обеспечивают шифрование, управление доступом, классификация данных. Целостность означает, что данные не изменены незаметно и без разрешения. Здесь работают хеши, цифровые подписи, контроль версий, журналы изменений. Доступность означает, что система и данные доступны тогда, когда они нужны. Её дают резервирование, бэкапы, защита от DDoS, план восстановления.<\/p>\n<p>На практике свойства конфликтуют между собой. Жёсткое шифрование и строгий доступ повышают конфиденциальность, но могут ударить по доступности, если ключи потеряны. Поэтому при оценке риска я всегда спрашиваю, какое из трёх свойств для этого актива важнее. Для платёжной системы на первом месте целостность и доступность, для медицинской карты конфиденциальность.<\/p>","sources":["https://csrc.nist.gov/glossary/term/confidentiality","https://csrc.nist.gov/glossary/term/integrity","https://csrc.nist.gov/glossary/term/availability"]},{"id":1,"num":2,"category":"Основы безопасности","text":"Чем аутентификация отличается от авторизации?","answer":"<p>Аутентификация отвечает на вопрос «кто ты», авторизация на вопрос «что тебе разрешено». Сначала система проверяет, что пользователь действительно тот, за кого себя выдаёт (пароль, ключ, второй фактор), и только потом решает, к каким ресурсам и действиям его допустить.<\/p>\n<p>Типичная ошибка в приложениях как раз в том, что аутентификацию делают, а авторизацию на каждом запросе нет. Пользователь залогинен, но меняет в URL идентификатор заказа и видит чужой заказ. Это уже не проблема логина, это сломанный контроль доступа, и в OWASP Top 10:2025 он стоит на первом месте.<\/p>\n<p>Ещё одно различие в том, где это реализуется. Аутентификацию часто выносят во внешний провайдер идентификации через OIDC или SAML. Авторизация почти всегда остаётся в самом приложении, потому что только оно знает свою бизнес-логику. Проверять права нужно на сервере на каждом запросе, по принципу запрета по умолчанию.<\/p>","sources":["https://csrc.nist.gov/glossary/term/authentication","https://csrc.nist.gov/glossary/term/authorization","https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html"]},{"id":2,"num":3,"category":"Основы безопасности","text":"Что такое принцип наименьших привилегий?","answer":"<p>Принцип наименьших привилегий (least privilege) означает, что каждый пользователь, процесс или сервис получает ровно те права, которые нужны для его задачи, и не больше. Если учётную запись скомпрометируют, ущерб ограничен её правами.<\/p>\n<p>На практике это выглядит так. Сервисный аккаунт приложения в базе имеет права только на свои таблицы и без DDL. Под в Kubernetes работает не от root, без привилегированного режима и с ServiceAccount, у которого минимальная Role. IAM-роль в облаке выдаётся на конкретный бакет, а не <code>s3:*<\/code> на всё. Администраторы работают под обычной учёткой, а привилегированную берут временно через PAM или just-in-time доступ.<\/p>\n<p>Сложность в том, что права со временем только растут. Поэтому кроме выдачи нужен регулярный пересмотр: кто и чем реально пользуется, какие роли не использовались месяцами. Облачные провайдеры дают для этого отчёты по последнему использованию прав, и я бы опирался на них, а не на память команды.<\/p>","sources":["https://csrc.nist.gov/glossary/term/least_privilege","https://kubernetes.io/docs/concepts/security/rbac-good-practices/"]},{"id":3,"num":4,"category":"Основы безопасности","text":"Что такое эшелонированная защита (defense in depth)?","answer":"<p>Эшелонированная защита означает, что мы не полагаемся на один механизм, а ставим несколько независимых слоёв. Если один слой обойдён или дал сбой, следующий всё ещё останавливает атаку или хотя бы её обнаруживает.<\/p>\n<p>Пример для веб-приложения. Снаружи WAF и защита от DDoS, дальше сегментация сети, чтобы с веб-сервера нельзя было напрямую попасть в базу. В самом приложении валидация ввода и параметризованные запросы. В базе отдельная учётка с минимальными правами и шифрование данных. Поверх всего логирование и мониторинг, чтобы заметить, если что-то всё же прошло.<\/p>\n<p>Важно, чтобы слои были действительно независимы. Три проверки, которые все опираются на один и тот же токен или один и тот же список доступа, это по сути один слой. Когда я оцениваю архитектуру, я спрашиваю, что произойдёт, если конкретный контроль отключится, и есть ли за ним что-то ещё.<\/p>","sources":["https://csrc.nist.gov/glossary/term/defense_in_depth"]},{"id":4,"num":5,"category":"Основы безопасности","text":"Что такое Zero Trust?","answer":"<p>Zero Trust это модель, в которой доверие не выдаётся автоматически по местоположению в сети. Раньше считалось, что всё внутри периметра доверенное. В Zero Trust каждый запрос к ресурсу проверяется отдельно: кто пользователь, с какого устройства, в каком состоянии это устройство, нужен ли ему этот ресурс именно сейчас.<\/p>\n<p>Основной документ здесь NIST SP 800-207. В нём описаны ключевые компоненты: точка принятия решения о доступе (Policy Decision Point) и точка его применения (Policy Enforcement Point), которая стоит между субъектом и ресурсом. Доступ выдаётся на уровне сессии и к конкретному ресурсу, а не ко всей сети сразу.<\/p>\n<p>На практике Zero Trust не покупается одним продуктом. Это набор шагов: единый провайдер идентификации с MFA, проверка состояния устройства, микросегментация, доступ к внутренним приложениям через прокси с проверкой личности вместо плоского VPN, непрерывный мониторинг. Внедряют его постепенно, начиная с самых ценных ресурсов.<\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/207/final"]},{"id":5,"num":6,"category":"Основы безопасности","text":"Чем отличаются уязвимость, угроза и риск?","answer":"<p>Уязвимость это слабое место в системе, процессе или контроле, которое можно использовать. Например, неисправленная версия библиотеки или открытый наружу порт управления. Угроза это обстоятельство или источник, который может этой слабостью воспользоваться и причинить вред: злоумышленник, вредонос, инсайдер, даже пожар в ЦОДе.<\/p>\n<p>Риск это мера того, насколько всё это для нас важно. Он складывается из вероятности того, что угроза реализуется через уязвимость, и из последствий для бизнеса, если это произойдёт. Методика оценки подробно описана в NIST SP 800-30.<\/p>\n<p>Это различие важно на собеседовании и в работе. Уязвимость с высоким CVSS на изолированном стенде без данных может нести низкий риск, а средняя уязвимость на публичном сервисе с персональными данными высокий. Поэтому приоритизацию исправлений я строю по риску, а не только по оценке уязвимости.<\/p>","sources":["https://csrc.nist.gov/glossary/term/vulnerability","https://csrc.nist.gov/glossary/term/threat","https://csrc.nist.gov/pubs/sp/800/30/r1/final"]},{"id":6,"num":7,"category":"Основы безопасности","text":"Чем симметричное шифрование отличается от асимметричного?","answer":"<p>В симметричном шифровании один и тот же ключ используется и для шифрования, и для расшифровки. Пример это AES, стандарт FIPS 197. Оно быстрое и подходит для больших объёмов данных, но у него есть проблема распределения ключа: обеим сторонам нужно как-то безопасно получить один и тот же секрет.<\/p>\n<p>В асимметричном шифровании у каждой стороны пара ключей: открытый и закрытый. То, что зашифровано открытым ключом, расшифровывается только закрытым. Примеры RSA и криптография на эллиптических кривых. Оно решает проблему распределения ключей и даёт цифровые подписи, но работает на порядки медленнее.<\/p>\n<p>На практике их комбинируют. В TLS асимметричная криптография используется, чтобы проверить сервер и согласовать общий секрет, а сами данные дальше шифруются симметричным алгоритмом, например AES-GCM или ChaCha20-Poly1305. Так мы получаем и удобство обмена ключами, и скорость.<\/p>","sources":["https://csrc.nist.gov/pubs/fips/197/final","https://csrc.nist.gov/glossary/term/asymmetric_cryptography","https://www.rfc-editor.org/rfc/rfc8446"]},{"id":7,"num":8,"category":"Основы безопасности","text":"Чем хеширование отличается от шифрования и кодирования?","answer":"<p>Кодирование, например Base64, это просто смена представления данных. Ключа нет, раскодировать может любой. Безопасности оно не даёт, и хранить секреты в Kubernetes Secret в Base64 значит хранить их открытым текстом.<\/p>\n<p>Шифрование обратимо, но только при наличии ключа. Его цель в конфиденциальности: без ключа данные нельзя прочитать.<\/p>\n<p>Хеширование это одностороннее преобразование данных произвольной длины в значение фиксированной длины. Обратно восстановить исходные данные нельзя, а хорошая хеш-функция делает практически невозможным найти два разных входа с одинаковым хешем. Хеши используют для проверки целостности, в цифровых подписях и для хранения паролей. Для целостности подходят SHA-256 и другие функции из FIPS 180-4, а вот для паролей нужны специальные медленные функции, об этом отдельный вопрос.<\/p>","sources":["https://csrc.nist.gov/pubs/fips/180-4/upd1/final","https://kubernetes.io/docs/concepts/configuration/secret/"]},{"id":8,"num":9,"category":"Основы безопасности","text":"Как правильно хранить пароли пользователей?","answer":"<p>Пароли никогда не хранят в открытом виде и не шифруют обратимо. Их хешируют специальной медленной функцией с солью. Обычные быстрые хеши вроде SHA-256 для этого не подходят, потому что на видеокартах их перебирают миллиардами в секунду.<\/p>\n<p>OWASP Password Storage Cheat Sheet рекомендует Argon2id с минимальной конфигурацией 19 MiB памяти, 2 итерации и степень параллелизма 1. Если Argon2id недоступен, scrypt. Для унаследованных систем на bcrypt нужен work factor не меньше 10, и надо помнить, что bcrypt учитывает только первые 72 байта пароля. Если требуется соответствие FIPS-140, PBKDF2 с HMAC-SHA-256 и не меньше 600 000 итераций.<\/p>\n<p>Кроме алгоритма важна политика. NIST SP 800-63B требует для пароля как единственного фактора минимум 15 символов, запрещает навязывать правила состава (обязательные цифры и спецсимволы) и периодическую принудительную смену, но требует проверять новый пароль по списку распространённых и скомпрометированных. Смену пароля нужно требовать, только если есть признаки компрометации.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html","https://pages.nist.gov/800-63-4/sp800-63b.html"]},{"id":9,"num":10,"category":"Основы безопасности","text":"Зачем нужны соль и перец при хешировании паролей?","answer":"<p>Соль это уникальное случайное значение, которое генерируется для каждого пароля и хешируется вместе с ним. Она хранится рядом с хешем и секретом не является. Её задача в том, чтобы одинаковые пароли давали разные хеши и чтобы заранее посчитанные таблицы (rainbow tables) стали бесполезны. Атакующему приходится перебирать каждый хеш отдельно.<\/p>\n<p>Современные функции вроде Argon2id, scrypt и bcrypt генерируют и хранят соль сами, в одной строке с хешем, поэтому отдельно её изобретать не нужно.<\/p>\n<p>Перец (pepper) это дополнительный секрет, общий для всех паролей, который хранится отдельно от базы, например в HSM или хранилище секретов. Идея в том, что если утечёт только база, без перца хеши перебрать нельзя. OWASP рассматривает перец как дополнительную защиту поверх правильного хеширования, а не замену ему.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"]},{"id":10,"num":11,"category":"Основы безопасности","text":"Как устроено рукопожатие TLS 1.3?","answer":"<p>В TLS 1.3 полное рукопожатие занимает один круг обмена (1-RTT). Клиент отправляет ClientHello со списком поддерживаемых наборов шифров и сразу со своей частью обмена ключами (key share) по Диффи-Хеллману на эллиптических кривых. Сервер отвечает ServerHello со своей частью обмена, и с этого момента обе стороны уже могут вычислить общий секрет.<\/p>\n<p>Всё, что сервер отправляет дальше, уже зашифровано: EncryptedExtensions, свой сертификат, CertificateVerify (подпись, доказывающая владение закрытым ключом) и Finished. Клиент проверяет цепочку сертификата и подпись, отправляет свой Finished, и дальше идут данные приложения.<\/p>\n<p>По сравнению с TLS 1.2 из протокола убрали статический обмен ключами RSA и слабые алгоритмы, оставили только наборы с AEAD-шифрованием. Поэтому прямая секретность (forward secrecy) в TLS 1.3 есть всегда. Есть ещё режим 0-RTT при повторном подключении, но его данные не защищены от повторного воспроизведения, и включать его стоит только для идемпотентных запросов.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc8446","https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"]},{"id":11,"num":12,"category":"Основы безопасности","text":"Что такое PKI и как работает цепочка доверия сертификатов?","answer":"<p>PKI (инфраструктура открытых ключей) это набор ролей, политик и технологий, который связывает открытый ключ с конкретным владельцем. Основной элемент это сертификат X.509: в нём открытый ключ, имя владельца, срок действия, и всё это подписано удостоверяющим центром (CA).<\/p>\n<p>Цепочка доверия выглядит так. Сертификат сервера подписан промежуточным CA, промежуточный подписан корневым. Корневые сертификаты заранее лежат в хранилище доверенных у операционной системы или браузера. Клиент проверяет подпись на каждом звене, сроки действия, соответствие имени сервера и то, что сертификат не отозван (через CRL или OCSP). Правила проверки описаны в RFC 5280.<\/p>\n<p>Частые проблемы на практике: сервер не отдаёт промежуточный сертификат и часть клиентов не может построить цепочку; истёк срок и сервис упал; внутренний CA не добавлен в доверенные у контейнера. Поэтому я автоматизирую выпуск и продление сертификатов (например cert-manager в Kubernetes) и мониторю сроки их действия.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc5280","https://csrc.nist.gov/glossary/term/public_key_infrastructure"]},{"id":12,"num":13,"category":"Основы безопасности","text":"Как работает цифровая подпись?","answer":"<p>Отправитель считает хеш сообщения и подписывает его своим закрытым ключом. Получатель берёт открытый ключ отправителя, проверяет подпись и сравнивает с хешем, который посчитал сам. Если совпало, значит сообщение не изменено и подписано владельцем закрытого ключа.<\/p>\n<p>Подпись даёт три свойства: целостность (любое изменение данных ломает проверку), аутентичность источника и неотказуемость, то есть владелец ключа не может правдоподобно отрицать, что подписал. Стандарт алгоритмов подписи в США это FIPS 186-5, туда входят RSA, ECDSA и EdDSA.<\/p>\n<p>Важно понимать, что подпись доказывает владение ключом, а не личность человека. Связь ключа с конкретным лицом или организацией даёт сертификат от доверенного CA. В DevSecOps подписи применяются к коммитам, образам контейнеров и артефактам сборки, чтобы в прод попадало только то, что прошло наш пайплайн.<\/p>","sources":["https://csrc.nist.gov/pubs/fips/186-5/final","https://csrc.nist.gov/glossary/term/digital_signature"]},{"id":13,"num":14,"category":"Основы безопасности","text":"Что такое HMAC и чем он отличается от обычного хеша?","answer":"<p>HMAC это код аутентичности сообщения на основе хеш-функции и общего секретного ключа. Он описан в RFC 2104. Обычный хеш может посчитать любой, поэтому злоумышленник может изменить сообщение и пересчитать хеш. HMAC без знания ключа правильно посчитать нельзя.<\/p>\n<p>Поэтому HMAC даёт и целостность, и аутентичность: получатель, у которого тот же ключ, убеждается, что сообщение не изменено и пришло от того, кто ключ знает. Неотказуемости он не даёт, потому что ключ общий у обеих сторон, в отличие от цифровой подписи.<\/p>\n<p>Где встречается на практике: подпись вебхуков (GitHub, платёжные системы присылают HMAC тела запроса в заголовке), JWT с алгоритмом HS256, подпись запросов к API. При проверке важно сравнивать значения функцией с постоянным временем выполнения, иначе по времени ответа можно подобрать подпись.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc2104","https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries"]},{"id":14,"num":15,"category":"Основы безопасности","text":"Что такое прямая секретность (forward secrecy)?","answer":"<p>Прямая секретность означает, что компрометация долговременного закрытого ключа сервера в будущем не позволяет расшифровать ранее записанный трафик. Достигается это тем, что для каждой сессии генерируются временные (эфемерные) ключи по Диффи-Хеллману, которые после сессии уничтожаются.<\/p>\n<p>Раньше в TLS был обмен ключами RSA: клиент шифровал секрет сессии открытым ключом сервера. Если злоумышленник годами записывал трафик, а потом получил закрытый ключ, он мог расшифровать всё записанное. С эфемерным обменом ключ сервера используется только для подписи, и такая атака не работает.<\/p>\n<p>В TLS 1.3 статический RSA-обмен удалён, поэтому прямая секретность обеспечивается всегда. В TLS 1.2 её дают наборы шифров с ECDHE, и при настройке серверов я оставляю только их.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc8446","https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"]},{"id":15,"num":16,"category":"Основы безопасности","text":"Что такое MFA и какие факторы бывают?","answer":"<p>Многофакторная аутентификация требует подтвердить личность факторами разных типов. Классически их три: что-то, что ты знаешь (пароль, PIN), что-то, что у тебя есть (аппаратный ключ, телефон с приложением), и что-то, чем ты являешься (биометрия). Два пароля это не MFA, это два фактора одного типа.<\/p>\n<p>Факторы сильно различаются по стойкости. SMS-коды уязвимы к перевыпуску SIM и перехвату. Коды TOTP из приложения лучше, но их можно выманить на фишинговом сайте в реальном времени. Push-уведомления страдают от атак усталостью, когда пользователя заваливают запросами, пока он не нажмёт «одобрить».<\/p>\n<p>Устойчивыми к фишингу NIST SP 800-63B считает аутентификаторы, которые криптографически привязаны к адресу сайта, прежде всего FIDO2/WebAuthn и passkeys. Для администраторов и доступа к критичным системам я бы требовал именно их.<\/p>","sources":["https://pages.nist.gov/800-63-4/sp800-63b.html","https://cheatsheetseries.owasp.org/cheatsheets/Multifactor_Authentication_Cheat_Sheet.html"]},{"id":16,"num":17,"category":"Основы безопасности","text":"Чем отличаются OAuth 2.0, OpenID Connect и SAML?","answer":"<p>OAuth 2.0 это протокол делегирования авторизации, RFC 6749. Он отвечает на вопрос, как приложению получить ограниченный доступ к ресурсу от имени пользователя, не узнавая его пароль. Результат это access token. Кто именно пользователь, OAuth сам по себе не говорит.<\/p>\n<p>OpenID Connect это слой аутентификации поверх OAuth 2.0. Он добавляет ID token в формате JWT с информацией о пользователе и стандартный эндпоинт userinfo. Если нужен вход через внешнего провайдера в современное веб- или мобильное приложение, это OIDC.<\/p>\n<p>SAML 2.0 старше и построен на XML. Решает похожую задачу единого входа (SSO), в основном в корпоративной среде и у старых enterprise-систем. Для новых приложений обычно выбирают OIDC. Из практики безопасности: в OAuth для публичных клиентов используют authorization code flow с PKCE, а implicit flow считается устаревшим.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc6749","https://openid.net/specs/openid-connect-core-1_0.html","https://www.rfc-editor.org/rfc/rfc9700"]},{"id":17,"num":18,"category":"Основы безопасности","text":"Что такое JWT и какие у него типичные уязвимости?","answer":"<p>JWT это компактный формат токена из трёх частей в Base64url: заголовок, полезная нагрузка с утверждениями (claims) и подпись. Описан в RFC 7519. Данные в JWT не зашифрованы, а только подписаны, поэтому класть туда секреты нельзя, прочитать токен может любой.<\/p>\n<p>Типичные уязвимости связаны с проверкой. Сервер принимает токен с <code>alg: none<\/code> без подписи. Сервер доверяет алгоритму из заголовка, и атакующий подменяет RS256 на HS256, подписывая токен открытым ключом как общим секретом. Не проверяются срок действия <code>exp<\/code>, издатель <code>iss<\/code> и получатель <code>aud<\/code>. Используется слабый секрет HMAC, который подбирается перебором.<\/p>\n<p>Рекомендации собраны в RFC 8725 (JWT Best Current Practices): явно задавать допустимые алгоритмы на сервере, проверять все обязательные claims, выбирать стойкие ключи. Отдельная проблема в том, что JWT сложно отозвать до истечения, поэтому access token делают короткоживущими, а для долгой сессии используют refresh token с возможностью отзыва.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc7519","https://www.rfc-editor.org/rfc/rfc8725","https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html"]},{"id":18,"num":19,"category":"Основы безопасности","text":"Какие флаги cookie важны для безопасности сессии?","answer":"<p>Основных флагов три. <code>HttpOnly<\/code> запрещает доступ к cookie из JavaScript, и тогда XSS не может просто украсть идентификатор сессии через <code>document.cookie<\/code>. <code>Secure<\/code> означает, что cookie отправляется только по HTTPS. <code>SameSite<\/code> управляет отправкой cookie в межсайтовых запросах: <code>Strict<\/code> не отправляет никогда, <code>Lax<\/code> отправляет при переходе по ссылке верхнего уровня, <code>None<\/code> отправляет всегда и требует <code>Secure<\/code>.<\/p>\n<p>Кроме флагов важны область действия и время жизни: не ставить слишком широкий <code>Domain<\/code>, ограничивать <code>Path<\/code> и срок. Есть ещё префиксы имени <code>__Host-<\/code> и <code>__Secure-<\/code>. Cookie с <code>__Host-<\/code> браузер примет только с <code>Secure<\/code>, без <code>Domain<\/code> и с <code>Path=/<\/code>, это защищает от подмены cookie с поддомена.<\/p>\n<p>Со стороны сервера по OWASP Session Management: идентификатор сессии случайный и достаточно длинный, после логина выдаётся новый (защита от фиксации сессии), есть таймауты по бездействию и абсолютный, а при выходе сессия уничтожается на сервере, а не только в браузере.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html","https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie"]},{"id":19,"num":20,"category":"Основы безопасности","text":"Что входит в OWASP Top 10 и что изменилось в версии 2025?","answer":"<p>OWASP Top 10 это документ о самых критичных рисках безопасности веб-приложений, который выходит раз в несколько лет на основе собранных данных и опроса специалистов. Актуальная версия это Top 10:2025.<\/p>\n<p>Список 2025 года: A01 Broken Access Control, A02 Security Misconfiguration, A03 Software Supply Chain Failures, A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures, A08 Software or Data Integrity Failures, A09 Security Logging and Alerting Failures, A10 Mishandling of Exceptional Conditions.<\/p>\n<p>Что изменилось по сравнению с 2021. Сломанный контроль доступа остался на первом месте, и в него включили SSRF, который раньше был отдельной категорией. Ошибки конфигурации поднялись с пятого места на второе. Категория про уязвимые компоненты расширилась до сбоев цепочки поставок ПО. Новая категория A10 про неправильную обработку исключительных ситуаций. Важно помнить, что Top 10 это документ для повышения осведомлённости, а не полный стандарт требований. Для требований есть OWASP ASVS.<\/p>","sources":["https://top10.owasp.org/2025/","https://top10.owasp.org/2025/0x00_2025-Introduction/","https://github.com/OWASP/ASVS"]},{"id":20,"num":21,"category":"Основы безопасности","text":"Что такое IDOR и как от него защищаться?","answer":"<p>IDOR (Insecure Direct Object Reference) это частный случай сломанного контроля доступа. Приложение принимает от пользователя идентификатор объекта, например <code>/api/invoices/1042<\/code>, и отдаёт объект, не проверив, принадлежит ли он этому пользователю. Атакующий перебирает номера и получает чужие данные.<\/p>\n<p>Главная защита в проверке авторизации на сервере для каждого запроса к объекту: принадлежит ли он текущему пользователю или есть ли у пользователя роль, дающая к нему доступ. Лучше всего делать это централизованно, например выбирать объект сразу с условием по владельцу, а не проверять вручную в каждом обработчике.<\/p>\n<p>Случайные идентификаторы вроде UUID вместо последовательных номеров усложняют перебор, но проверку прав не заменяют: идентификатор может утечь в логах, ссылках или ответах других API. В тестах я добавляю автоматические проверки, что пользователь A не может получить объект пользователя B через каждый эндпоинт.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html","https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/"]},{"id":21,"num":22,"category":"Основы безопасности","text":"Что такое SQL-инъекция и как от неё защититься?","answer":"<p>SQL-инъекция возникает, когда пользовательский ввод склеивается со строкой запроса и интерпретируется как часть SQL. Классический пример: в поле логина вводят <code>' OR '1'='1<\/code>, и условие <code>WHERE<\/code> становится всегда истинным. Через инъекцию можно читать чужие данные, менять их, а в худшем случае выполнять команды на сервере базы.<\/p>\n<p>Основная защита по OWASP это параметризованные запросы (prepared statements): структура запроса задаётся заранее, а ввод передаётся отдельно как данные и никогда не становится кодом. ORM дают это по умолчанию, пока не начинаешь собирать сырые запросы строками. Для частей запроса, которые нельзя параметризовать, например имя столбца для сортировки, используют белый список допустимых значений.<\/p>\n<p>Дополнительные слои: учётка приложения в базе с минимальными правами, чтобы инъекция не давала удалить таблицы; обработка ошибок без вывода текста ошибки базы пользователю; SAST в пайплайне, который ловит склейку строк в запросах. WAF может снизить поток атак, но не заменяет исправления кода.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html","https://top10.owasp.org/2025/A05_2025-Injection/"]},{"id":22,"num":23,"category":"Основы безопасности","text":"Какие бывают виды XSS и как от них защищаться?","answer":"<p>XSS (межсайтовый скриптинг) это внедрение скрипта, который выполняется в браузере жертвы в контексте уязвимого сайта. Выделяют три вида. Отражённый: вредный код приходит в параметре запроса и сразу возвращается в ответе. Хранимый: код сохраняется на сервере, например в комментарии, и выполняется у каждого, кто открыл страницу. DOM-based: уязвимость целиком на клиенте, когда JavaScript берёт данные из URL и вставляет их в страницу через опасные методы вроде <code>innerHTML<\/code>.<\/p>\n<p>Основная защита это кодирование вывода с учётом контекста: в HTML, в атрибуте, в JavaScript, в URL правила экранирования разные. Современные фреймворки (React, Angular) экранируют по умолчанию, и уязвимости чаще появляются там, где это обходят, например через <code>dangerouslySetInnerHTML<\/code>. Если нужно выводить HTML от пользователя, его пропускают через проверенный санитайзер вроде DOMPurify.<\/p>\n<p>Дополнительный слой это Content Security Policy, которая запрещает встроенные скрипты и загрузку с непредусмотренных источников. Плюс флаг <code>HttpOnly<\/code> на cookie сессии, чтобы даже успешный XSS не уносил её напрямую.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html","https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html","https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html"]},{"id":23,"num":24,"category":"Основы безопасности","text":"Что такое CSRF и как от него защищаются?","answer":"<p>CSRF (подделка межсайтового запроса) это атака, при которой сайт злоумышленника заставляет браузер жертвы отправить запрос на другой сайт, где жертва залогинена. Браузер автоматически прикладывает cookie сессии, и сервер считает запрос легитимным. Так можно, например, сменить email или перевести деньги от имени пользователя.<\/p>\n<p>Основные защиты по OWASP. Синхронизированный CSRF-токен: сервер выдаёт случайный токен, привязанный к сессии, и проверяет его в каждом изменяющем запросе. Атакующий не может его прочитать из-за политики одного источника. Для приложений без серверного состояния используется вариант double submit cookie с подписанным токеном. Встроенная защита есть в большинстве фреймворков, её нужно просто не отключать.<\/p>\n<p>Дополнительные слои: cookie с <code>SameSite=Lax<\/code> или <code>Strict<\/code>, проверка заголовков <code>Origin<\/code> и <code>Sec-Fetch-Site<\/code>, и правило, что GET-запросы ничего не изменяют. API, которые принимают токен только в заголовке <code>Authorization<\/code>, а не из cookie, к классическому CSRF не уязвимы.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"]},{"id":24,"num":25,"category":"Основы безопасности","text":"Что такое SSRF и почему он опасен в облаке?","answer":"<p>SSRF (подделка запроса на стороне сервера) это уязвимость, при которой атакующий заставляет сервер отправить запрос по адресу, который выбрал атакующий. Типичный случай: функция «загрузить картинку по ссылке» или вебхук, куда можно подставить внутренний адрес. Сервер находится внутри сети и видит то, что снаружи недоступно.<\/p>\n<p>В облаке SSRF особенно опасен из-за сервиса метаданных инстанса по адресу <code>169.254.169.254<\/code>. Через него можно получить временные учётные данные IAM-роли машины и дальше работать с облачным API от её имени. Поэтому AWS ввёл IMDSv2, который требует предварительного PUT-запроса за токеном сессии, и это сильно усложняет эксплуатацию через простой SSRF. Включать IMDSv2 обязательным я считаю базовой настройкой.<\/p>\n<p>Защита в приложении по OWASP: белый список разрешённых адресов и схем, если набор известен; проверка итогового IP после разрешения DNS с запретом внутренних и служебных диапазонов; отключение перехода по редиректам. На уровне сети исходящий трафик от приложения ограничивают только нужными направлениями. В OWASP Top 10:2025 SSRF включён в категорию A01.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html","https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/configuring-instance-metadata-service.html","https://top10.owasp.org/2025/A01_2025-Broken_Access_Control/"]},{"id":25,"num":26,"category":"Основы безопасности","text":"Что такое Same-Origin Policy и CORS?","answer":"<p>Same-Origin Policy это базовое правило браузера: скрипт со страницы одного источника не может читать ответы от другого источника. Источник (origin) определяется тройкой схема, хост и порт. <code>https://app.example.com<\/code> и <code>https://api.example.com<\/code> это разные источники.<\/p>\n<p>CORS это механизм, которым сервер явно разрешает определённым источникам читать свои ответы. Сервер возвращает заголовок <code>Access-Control-Allow-Origin<\/code>, а для непростых запросов браузер сначала отправляет предварительный запрос OPTIONS и проверяет разрешённые методы и заголовки.<\/p>\n<p>Важно понимать, что CORS ослабляет защиту, а не усиливает её. Частые ошибки конфигурации: сервер отражает любой <code>Origin<\/code> из запроса в ответ вместе с <code>Access-Control-Allow-Credentials: true<\/code>, и тогда любой сайт может читать данные пользователя; разрешается <code>null<\/code> как источник; проверка домена по подстроке, которую обходит <code>example.com.evil.com<\/code>. Правильно держать явный список разрешённых источников.<\/p>","sources":["https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"]},{"id":26,"num":27,"category":"Основы безопасности","text":"Какие HTTP-заголовки безопасности стоит включать?","answer":"<p>Базовый набор по OWASP HTTP Headers Cheat Sheet. <code>Strict-Transport-Security<\/code> (HSTS, RFC 6797) заставляет браузер ходить на сайт только по HTTPS и защищает от понижения до HTTP. <code>Content-Security-Policy<\/code> ограничивает, откуда можно загружать скрипты, стили и фреймы, и это сильный слой против XSS. <code>X-Content-Type-Options: nosniff<\/code> запрещает браузеру угадывать тип содержимого.<\/p>\n<p>Для защиты от кликджекинга используется директива CSP <code>frame-ancestors<\/code>, а для старых браузеров ещё <code>X-Frame-Options<\/code>. <code>Referrer-Policy<\/code> ограничивает, какой адрес страницы уходит на внешние сайты, чтобы в нём не утекали токены из URL. <code>Permissions-Policy<\/code> отключает ненужные функции браузера вроде камеры и геолокации.<\/p>\n<p>Отдельно стоит убирать заголовки, которые раскрывают версию сервера и фреймворка, вроде <code>Server<\/code> с номером версии и <code>X-Powered-By<\/code>. Проверять настройку удобно автоматически в пайплайне, чтобы после очередного изменения конфигурации прокси заголовки не пропали молча.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html","https://www.rfc-editor.org/rfc/rfc6797"]},{"id":27,"num":28,"category":"Основы безопасности","text":"Что такое SYN flood и как от него защищаются?","answer":"<p>TCP-соединение открывается тройным рукопожатием: клиент отправляет SYN, сервер отвечает SYN-ACK и держит полуоткрытое соединение, клиент подтверждает ACK. При SYN flood атакующий шлёт огромное количество SYN, часто с поддельных адресов, и не завершает рукопожатие. Очередь полуоткрытых соединений на сервере заполняется, и легитимные клиенты не могут подключиться.<\/p>\n<p>Классическая защита это SYN cookies, описанные в RFC 4987. Сервер не хранит состояние полуоткрытого соединения, а кодирует нужную информацию в начальном номере последовательности своего SYN-ACK. Если клиент реальный и вернул ACK, сервер восстанавливает из него данные и открывает соединение. В Linux это параметр <code>net.ipv4.tcp_syncookies<\/code>.<\/p>\n<p>Кроме этого используют увеличение очереди, уменьшение числа повторов SYN-ACK, ограничение частоты на границе сети. Против объёмных атак, которые просто забивают канал, настройками сервера не помочь, нужна фильтрация у провайдера или в облачном сервисе защиты от DDoS.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc4987","https://www.kernel.org/doc/html/latest/networking/ip-sysctl.html"]},{"id":28,"num":29,"category":"Основы безопасности","text":"Чем IDS отличается от IPS?","answer":"<p>IDS (система обнаружения вторжений) анализирует трафик или события и сообщает о подозрительной активности, но сама трафик не блокирует. Обычно она получает копию трафика со SPAN-порта или TAP. IPS (система предотвращения вторжений) стоит в разрыве потока и может сразу отбросить пакет или разорвать соединение.<\/p>\n<p>По способу обнаружения обе бывают сигнатурные, которые ищут известные шаблоны атак, и основанные на аномалиях, которые сравнивают поведение с нормальным профилем. По месту установки различают сетевые (NIDS, например Suricata или Snort) и хостовые (HIDS, например Wazuh на сервере). Классификация подробно описана в NIST SP 800-94.<\/p>\n<p>Выбор между ними это компромисс. IPS даёт автоматическую защиту, но ложное срабатывание в блокирующем режиме рвёт легитимный трафик и может положить сервис. Поэтому новые правила я обычно сначала запускаю в режиме обнаружения, смотрю на ложные срабатывания и только потом перевожу в блокировку. Ещё одно ограничение в том, что зашифрованный трафик без его расшифровки сетевая система видит только по метаданным.<\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/94/final","https://docs.suricata.io/en/latest/what-is-suricata.html"]},{"id":29,"num":30,"category":"Основы безопасности","text":"Чем stateful firewall отличается от stateless и от WAF?","answer":"<p>Stateless-фильтр смотрит на каждый пакет отдельно по заголовкам: адреса, порты, протокол. Он не знает, является ли пакет частью разрешённого соединения, поэтому для ответного трафика приходится явно открывать обратное направление. Пример это сетевые ACL в AWS.<\/p>\n<p>Stateful-межсетевой экран отслеживает состояние соединений. Если исходящее соединение разрешено, ответные пакеты пропускаются автоматически. Это проще в настройке и безопаснее. Примеры это security groups в AWS и <code>nftables<\/code> с conntrack в Linux. Типы межсетевых экранов и политика их настройки описаны в NIST SP 800-41.<\/p>\n<p>WAF работает на уровне приложения, на HTTP. Он разбирает запрос и ищет в нём признаки атак: SQL-инъекции, XSS, обход путей. Он не заменяет сетевой экран и не заменяет исправление кода, это дополнительный слой, который выигрывает время, например для виртуального патча до выхода исправления. Популярный открытый набор правил это OWASP Core Rule Set.<\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/41/r1/final","https://docs.aws.amazon.com/vpc/latest/userguide/infrastructure-security.html","https://coreruleset.org/"]},{"id":30,"num":31,"category":"Основы безопасности","text":"Какие атаки на DNS вы знаете и как от них защищаются?","answer":"<p>Подмена ответов и отравление кеша: атакующий подсовывает резолверу поддельный ответ, и пользователи отправляются на его сервер. Защитой служит DNSSEC, который добавляет цифровые подписи к записям, и резолвер проверяет цепочку подписей от корневой зоны (RFC 4033). Также помогает случайность исходного порта и идентификатора запроса на резолвере.<\/p>\n<p>Перехват зоны и подмена записей через компрометацию регистратора или DNS-провайдера: здесь нужна MFA на аккаунте регистратора, блокировка домена от переноса и мониторинг изменений записей. Отдельный случай это захват поддомена (subdomain takeover), когда CNAME указывает на удалённый облачный ресурс, и атакующий регистрирует ресурс с этим именем у себя.<\/p>\n<p>DNS также используют для туннелирования и вывода данных, потому что DNS-трафик редко блокируют. Против этого помогает принудительное использование своих резолверов, логирование DNS-запросов и поиск аномалий: очень длинные поддомены, высокая энтропия имён, большое число запросов к одному домену. DoH и DoT шифруют запросы от клиента до резолвера и защищают от прослушивания в пути.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc4033","https://attack.mitre.org/techniques/T1071/004/"]},{"id":31,"num":32,"category":"Основы безопасности","text":"Как работает атака «человек посередине» через ARP spoofing?","answer":"<p>ARP сопоставляет IP-адреса с MAC-адресами в локальной сети и не имеет никакой аутентификации. Атакующий в том же сегменте рассылает поддельные ARP-ответы: «IP шлюза находится на моём MAC». Хосты обновляют свой ARP-кеш и начинают слать трафик через машину атакующего, который может его читать, менять или обрывать.<\/p>\n<p>В MITRE ATT&amp;CK это техника Adversary-in-the-Middle, подтехника ARP Cache Poisoning. Шифрование трафика (TLS с проверкой сертификата) сильно снижает ущерб: атакующий видит только зашифрованные данные и не может подменить сервер без ошибки сертификата. Поэтому незашифрованные протоколы внутри сети опасны даже при защищённом периметре.<\/p>\n<p>Сетевые защиты: Dynamic ARP Inspection на управляемых коммутаторах, которая сверяет ARP-пакеты с таблицей DHCP snooping; сегментация, чтобы в одном широковещательном домене было меньше хостов; мониторинг изменений MAC-адреса у шлюза. На критичных серверах иногда задают статические ARP-записи для шлюза.<\/p>","sources":["https://attack.mitre.org/techniques/T1557/002/","https://capec.mitre.org/data/definitions/94.html"]},{"id":32,"num":33,"category":"Основы безопасности","text":"Чем DoS отличается от DDoS и как защищаться?","answer":"<p>DoS это атака на доступность из одного источника, DDoS из множества источников одновременно, обычно из ботнета. DDoS сложнее отразить, потому что источник нельзя просто заблокировать по одному адресу, а суммарный объём может превышать пропускную способность канала.<\/p>\n<p>Атаки делят на три типа. Объёмные забивают канал, часто через усиление с помощью открытых DNS, NTP или memcached серверов, которые отвечают большим пакетом на маленький запрос с поддельным адресом жертвы. Протокольные исчерпывают ресурсы сетевого стека или оборудования, например SYN flood. Атаки на уровне приложения шлют правдоподобные, но тяжёлые HTTP-запросы, например к поиску или генерации отчётов.<\/p>\n<p>Защита многоуровневая. От объёмных атак спасает только фильтрация до вашего канала: у провайдера, в CDN или облачном сервисе защиты. На уровне приложения помогают ограничение частоты запросов, кеширование, WAF-правила, лимиты на тяжёлые операции и автомасштабирование. И нужен заранее подготовленный план: кому звонить, как переключить трафик на защиту.<\/p>","sources":["https://www.cisa.gov/news-events/news/understanding-denial-service-attacks","https://cheatsheetseries.owasp.org/cheatsheets/Denial_of_Service_Cheat_Sheet.html"]},{"id":33,"num":34,"category":"Основы безопасности","text":"Что такое CVE, CWE и CVSS?","answer":"<p>CVE это каталог публично известных уязвимостей в конкретных продуктах. У каждой уязвимости свой идентификатор вида <code>CVE-2021-44228<\/code>, что позволяет разным сканерам, вендорам и командам говорить об одном и том же. Программой управляет MITRE при поддержке CISA.<\/p>\n<p>CWE это каталог типов слабостей, то есть классов ошибок, а не конкретных случаев. Например CWE-89 это SQL-инъекция. Одна CVE обычно ссылается на одну или несколько CWE. CWE полезен разработчикам и в SAST: инструменты сообщают, какой класс ошибки нашли.<\/p>\n<p>CVSS это открытая система оценки тяжести уязвимости от FIRST, актуальная версия 4.0. Оценка от 0 до 10 считается по метрикам вектора атаки, сложности, требуемых привилегий, влияния на конфиденциальность, целостность и доступность. Важно, что базовая оценка описывает тяжесть, а не риск для конкретной организации. Для приоритизации её дополняют данными об эксплуатации, например каталогом CISA KEV или оценкой EPSS, и своим контекстом.<\/p>","sources":["https://www.cve.org/About/Overview","https://cwe.mitre.org/about/index.html","https://www.first.org/cvss/v4-0/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog"]},{"id":34,"num":35,"category":"Основы безопасности","text":"Что такое моделирование угроз и как работает STRIDE?","answer":"<p>Моделирование угроз это структурированный разбор системы на этапе проектирования: что мы строим, что может пойти не так, что мы с этим делаем, и хорошо ли мы справились. Эти четыре вопроса лежат в основе OWASP Threat Modeling Cheat Sheet. Обычно начинают с диаграммы потоков данных с границами доверия.<\/p>\n<p>STRIDE это классификация угроз от Microsoft, которая помогает ничего не забыть. Spoofing, подмена личности, нарушает аутентификацию. Tampering, изменение данных, нарушает целостность. Repudiation, отказ от действия, возникает при отсутствии журналов. Information disclosure, раскрытие информации, нарушает конфиденциальность. Denial of service бьёт по доступности. Elevation of privilege, повышение привилегий, нарушает авторизацию.<\/p>\n<p>На практике я прохожу по каждому элементу диаграммы и каждой границе доверия и спрашиваю, какие из шести категорий к ним применимы. Для каждой найденной угрозы записываю контроль или принятый риск. Главное, что моделирование делается до кода, когда исправление дешёвое, и обновляется при изменении архитектуры.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html","https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats"]},{"id":35,"num":36,"category":"Основы безопасности","text":"Что такое социальная инженерия и фишинг, как с ними бороться?","answer":"<p>Социальная инженерия это манипуляция людьми, чтобы они сами раскрыли информацию или выполнили действие в интересах атакующего. Фишинг это её самая массовая форма: письмо или сообщение от имени доверенной стороны с вредоносной ссылкой или вложением. Есть целевой фишинг (spear phishing) против конкретных людей, звонки (вишинг), SMS (смишинг).<\/p>\n<p>Технические меры снижают поток: фильтрация почты, проверка отправителя через SPF, DKIM и DMARC, песочница для вложений, пометка внешних писем. Но главное это ограничение ущерба, если человек всё же поддался. Устойчивая к фишингу MFA (FIDO2) делает украденный пароль бесполезным, а принцип наименьших привилегий и контроль исполняемых файлов на рабочих станциях не дают вложению развернуться.<\/p>\n<p>Со стороны людей работают обучение на реальных примерах, учебные фишинговые рассылки и, что особенно важно, простой способ сообщить о подозрительном письме без страха наказания. Для платежей и смены реквизитов нужен процесс подтверждения по независимому каналу, это закрывает атаки с подменой руководителя.<\/p>","sources":["https://www.cisa.gov/news-events/news/avoiding-social-engineering-and-phishing-attacks","https://attack.mitre.org/techniques/T1566/"]},{"id":36,"num":37,"category":"Основы безопасности","text":"Зачем нужна сегментация сети?","answer":"<p>Сегментация делит сеть на зоны с контролируемыми переходами между ними. Без неё сеть плоская: скомпрометировав одну рабочую станцию, атакующий напрямую достаёт до серверов баз данных, контроллеров домена и систем управления. Сегментация ограничивает горизонтальное перемещение и сужает ущерб от одного взлома.<\/p>\n<p>Типичное разделение: пользовательские рабочие места, серверы по уровням (веб, приложения, базы), зона управления инфраструктурой, DMZ для публичных сервисов, отдельные сегменты для гостей и IoT. Между зонами трафик разрешается по явным правилам, по умолчанию запрещено. Для платёжных данных PCI DSS прямо использует сегментацию, чтобы сузить область, на которую распространяются требования.<\/p>\n<p>Следующий шаг это микросегментация, когда правила задаются на уровне отдельных нагрузок, а не подсетей. В Kubernetes это NetworkPolicy: по умолчанию все поды видят друг друга, и нужно явно ввести политику запрета по умолчанию и разрешать только нужные связи. Сегментацию важно проверять, а не только нарисовать, например периодическим сканированием из каждой зоны.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Network_Segmentation_Cheat_Sheet.html","https://kubernetes.io/docs/concepts/services-networking/network-policies/"]},{"id":37,"num":38,"category":"Основы безопасности","text":"Как работает Kerberos?","answer":"<p>Kerberos это протокол аутентификации по билетам с доверенной третьей стороной, центром распределения ключей (KDC). В Active Directory роль KDC выполняет контроллер домена. Пароль пользователя по сети не передаётся.<\/p>\n<p>Порядок такой. Пользователь при входе запрашивает у службы аутентификации (AS) билет на получение билетов (TGT). Запрос подтверждается ключом, производным от пароля. Затем с этим TGT он обращается в службу выдачи билетов (TGS) за билетом к конкретному сервису. Этот сервисный билет зашифрован ключом учётной записи сервиса, и сервис проверяет его сам, не обращаясь к KDC. Протокол описан в RFC 4120.<\/p>\n<p>Для специалиста по безопасности важны атаки на Kerberos в AD. Kerberoasting: любой пользователь домена запрашивает сервисный билет и перебирает пароль сервисной учётки офлайн, поэтому у сервисных учёток должны быть длинные пароли или управляемые учётные записи (gMSA). AS-REP roasting против учёток без предварительной аутентификации. Golden ticket: при краже хеша учётки <code>krbtgt<\/code> атакующий подделывает любые TGT, и восстановление требует двойной смены её пароля.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc4120","https://learn.microsoft.com/en-us/windows-server/security/kerberos/kerberos-authentication-overview","https://attack.mitre.org/techniques/T1558/003/"]},{"id":38,"num":39,"category":"Основы безопасности","text":"Что такое поверхность атаки и как её уменьшают?","answer":"<p>Поверхность атаки это совокупность всех точек, через которые атакующий может взаимодействовать с системой и пытаться в неё проникнуть или извлечь данные: открытые порты и сервисы, API, формы ввода, учётные записи, сторонние компоненты, даже люди с доступом.<\/p>\n<p>Уменьшают её в основном удалением лишнего. Отключить неиспользуемые сервисы и порты, убрать панели управления из публичного доступа за VPN или прокси с проверкой личности, удалить неиспользуемые учётки и ключи, использовать минимальные базовые образы контейнеров без оболочки и пакетного менеджера, выкинуть неиспользуемые зависимости. Каждый удалённый компонент это на одну вещь меньше, которую нужно патчить и мониторить.<\/p>\n<p>Отдельная задача в том, чтобы знать свою внешнюю поверхность. На практике всегда находятся забытые тестовые стенды, старые поддомены и бакеты, о которых никто не помнит. Поэтому нужен инвентарь активов и регулярное внешнее сканирование своих диапазонов и доменов, включая данные из журналов прозрачности сертификатов.<\/p>","sources":["https://csrc.nist.gov/glossary/term/attack_surface","https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html"]},{"id":39,"num":40,"category":"Основы безопасности","text":"Что такое Secure by Design и shift left?","answer":"<p>Secure by Design это подход, при котором безопасность закладывается в продукт на этапе проектирования, а не добавляется потом. CISA продвигает его как принцип для производителей ПО: безопасные настройки по умолчанию, отказ от целых классов уязвимостей за счёт выбора технологий (например языков с безопасной работой с памятью), MFA по умолчанию, прозрачность по уязвимостям.<\/p>\n<p>Shift left означает перенос проверок безопасности на более ранние этапы жизненного цикла разработки. Вместо пентеста за неделю до релиза мы делаем моделирование угроз при проектировании, проверки в IDE и pre-commit, SAST, анализ зависимостей и сканирование секретов в каждом пул-реквесте, сканирование образов и IaC в пайплайне. Ошибка, найденная до мержа, стоит в разы дешевле, чем в проде.<\/p>\n<p>Важная оговорка: shift left не значит «переложить всё на разработчиков». Если завалить их сотнями находок с ложными срабатываниями, проверки начнут отключать. Задача команды безопасности в том, чтобы дать удобные инструменты с настроенными правилами, понятные исправления и блокировать сборку только по действительно критичным находкам.<\/p>","sources":["https://www.cisa.gov/securebydesign","https://csrc.nist.gov/pubs/sp/800/218/final"]},{"id":40,"num":41,"category":"Основы безопасности","text":"Чем отличаются IPsec, WireGuard и TLS VPN?","answer":"<p>IPsec работает на сетевом уровне и защищает IP-пакеты. Архитектура описана в RFC 4301, ключи согласуются протоколом IKEv2. Это стандарт для туннелей между площадками (site-to-site) и поддерживается почти любым сетевым оборудованием. Минус в сложности настройки и большом числе опций, где легко ошибиться.<\/p>\n<p>WireGuard тоже работает на сетевом уровне, но спроектирован минималистично: фиксированный современный набор криптографии без согласования алгоритмов, небольшая кодовая база, идентификация пиров по открытым ключам. Он реализован как сетевой туннель в ядре Linux и прост в настройке. Из-за отсутствия выбора алгоритмов нет и атак на понижение версии.<\/p>\n<p>TLS VPN (например OpenVPN или клиентские VPN на базе TLS) работают поверх TLS и легче проходят через межсетевые экраны и прокси, поэтому их часто используют для удалённого доступа сотрудников. Независимо от технологии важно, что VPN сам по себе даёт доступ в сеть, а не к конкретному приложению. Поэтому в модели Zero Trust его дополняют или заменяют доступом к отдельным приложениям с проверкой пользователя и устройства.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc4301","https://www.ndss-symposium.org/ndss2017/ndss-2017-programme/wireguard-next-generation-kernel-network-tunnel/","https://csrc.nist.gov/pubs/sp/800/77/r1/final"]},{"id":41,"num":42,"category":"Основы безопасности","text":"Что происходит, когда вы вводите адрес сайта в браузере, с точки зрения безопасности?","answer":"<p>Браузер сначала проверяет список HSTS: если домен в нём, запрос сразу пойдёт по HTTPS. Затем разрешение имени через DNS. Здесь возможна подмена ответа, защитой служат DNSSEC на стороне резолвера и DoH или DoT между клиентом и резолвером.<\/p>\n<p>Дальше TCP-соединение и TLS-рукопожатие. Браузер проверяет цепочку сертификата до доверенного корня, срок действия, соответствие имени и отзыв. На этом этапе отсекается «человек посередине» с поддельным сертификатом. Согласуются эфемерные ключи, поэтому трафик защищён с прямой секретностью.<\/p>\n<p>Потом HTTP-запрос с cookie для этого источника с учётом флагов <code>Secure<\/code> и <code>SameSite<\/code>. Сервер отвечает, и вместе с содержимым приходят заголовки безопасности: CSP ограничивает источники скриптов, HSTS обновляет политику, <code>X-Content-Type-Options<\/code> запрещает угадывание типов. При загрузке ресурсов с других доменов работают Same-Origin Policy и CORS. Этот вопрос удобен тем, что позволяет последовательно показать знание сетей, криптографии и веб-безопасности.<\/p>","sources":["https://www.rfc-editor.org/rfc/rfc6797","https://www.rfc-editor.org/rfc/rfc8446","https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy"]},{"id":42,"num":43,"category":"DevSecOps и AppSec","text":"Что такое DevSecOps и чем он отличается от классической безопасности?","answer":"<p>DevSecOps это встраивание безопасности в процесс разработки и эксплуатации так же, как DevOps встроил туда тестирование и деплой. Безопасность перестаёт быть отдельным этапом в конце, когда команда безопасности за неделю до релиза приносит отчёт пентеста, а становится частью каждого шага: проектирование, код, сборка, деплой, работа в проде.<\/p>\n<p>В классической модели безопасность часто работает как шлагбаум: проверили, нашли, вернули. При частых релизах это не масштабируется, команда безопасности становится узким местом, и её начинают обходить. В DevSecOps проверки автоматизированы в пайплайне, разработчик получает обратную связь в пул-реквесте за минуты, а специалисты по безопасности занимаются инструментами, правилами, моделированием угроз и сложными случаями.<\/p>\n<p>Для меня как для человека из DevOps главное здесь в том, что безопасность должна быть удобной. Если сканер даёт сотни ложных срабатываний и блокирует сборку по пустякам, его отключат. Поэтому ключевая работа не в том, чтобы поставить инструменты, а в том, чтобы настроить их так, чтобы разработчики им доверяли. Методическая основа здесь NIST SSDF (SP 800-218).<\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/218/final","https://owasp.org/www-project-devsecops-guideline/"]},{"id":43,"num":44,"category":"DevSecOps и AppSec","text":"Чем отличаются SAST, DAST, IAST и RASP?","answer":"<p>SAST (статический анализ) проверяет исходный код без запуска и ищет опасные шаблоны: склейку строк в SQL-запросах, небезопасную десериализацию, захардкоженные секреты. Работает рано, прямо в пул-реквесте, и показывает конкретную строку. Минусы в ложных срабатываниях и в том, что он не видит проблемы конфигурации и окружения. Примеры: Semgrep, CodeQL, SonarQube.<\/p>\n<p>DAST (динамический анализ) атакует работающее приложение снаружи, как это делал бы злоумышленник, не зная кода. Находит то, что проявляется только в рантайме: ошибки конфигурации, заголовки, реальные инъекции. Минусы в том, что нужен развёрнутый стенд, прогон дольше и сложно указать строку кода. Пример OWASP ZAP.<\/p>\n<p>IAST ставит агент внутрь работающего приложения во время тестов и видит, как данные проходят от входа до опасной функции. Точнее обоих, но привязан к языку и требует хорошего покрытия тестами. RASP похож технически, но работает в проде и не просто сообщает, а блокирует атаку в момент выполнения. На практике базовый набор это SAST и SCA в каждом пул-реквесте и DAST на стенде перед релизом.<\/p>","sources":["https://owasp.org/www-community/Source_Code_Analysis_Tools","https://owasp.org/www-project-devsecops-guideline/","https://www.zaproxy.org/getting-started/"]},{"id":44,"num":45,"category":"DevSecOps и AppSec","text":"Что такое SCA и зачем проверять зависимости?","answer":"<p>SCA (анализ состава ПО) определяет, из каких сторонних компонентов собрано приложение, включая транзитивные зависимости, и сверяет их версии с базами известных уязвимостей и лицензий. Своего кода в современном приложении обычно намного меньше, чем чужого, поэтому большая часть уязвимостей приходит именно через зависимости.<\/p>\n<p>В OWASP Top 10:2025 это отдельная категория A03 Software Supply Chain Failures, которая выросла из прежней категории про уязвимые и устаревшие компоненты. Классический пример Log4Shell (CVE-2021-44228): многие компании несколько дней выясняли, где у них вообще используется log4j, потому что он приходил транзитивно.<\/p>\n<p>На практике SCA ставится в пайплайн и в репозиторий: Dependabot или Renovate создают пул-реквесты с обновлениями, а сканер (Trivy, Grype, OWASP Dependency-Check) блокирует сборку при критичной уязвимости с доступным исправлением. Важно смотреть не только на наличие CVE, но и на то, вызывается ли уязвимая функция и есть ли эксплуатация в реальных атаках, иначе команда утонет в обновлениях.<\/p>","sources":["https://top10.owasp.org/2025/A03_2025-Software_Supply_Chain_Failures/","https://owasp.org/www-project-dependency-check/","https://nvd.nist.gov/vuln/detail/CVE-2021-44228"]},{"id":45,"num":46,"category":"DevSecOps и AppSec","text":"Что такое SBOM и какие форматы бывают?","answer":"<p>SBOM (Software Bill of Materials) это машиночитаемый перечень всех компонентов, из которых собран продукт: имена, версии, поставщики, лицензии, связи между компонентами. По сути это список ингредиентов на упаковке. Главная польза проявляется в момент, когда выходит новая критичная уязвимость: вместо недели поиска вы за минуты отвечаете, в каких продуктах и версиях есть уязвимый компонент.<\/p>\n<p>Два основных формата. SPDX от Linux Foundation, признан международным стандартом ISO/IEC 5962:2021, исторически сильнее в лицензионном комплаенсе. CycloneDX от OWASP, стандартизирован как ECMA-424, изначально ориентирован на безопасность и поддерживает также описание сервисов и данные VEX.<\/p>\n<p>На практике SBOM генерируют автоматически при сборке (Syft, Trivy, плагины сборщиков), прикладывают к артефакту и подписывают. Отдельно ценен VEX, документ, который говорит, затрагивает ли конкретная уязвимость компонента ваш продукт. Он снимает поток вопросов от клиентов по CVE, которые у вас не эксплуатируются.<\/p>","sources":["https://spdx.dev/about/overview/","https://cyclonedx.org/specification/overview/","https://www.cisa.gov/sbom"]},{"id":46,"num":47,"category":"DevSecOps и AppSec","text":"Что такое SLSA?","answer":"<p>SLSA (Supply-chain Levels for Software Artifacts) это фреймворк от OpenSSF для защиты целостности сборки. Он отвечает на вопрос, можно ли доверять тому, что артефакт собран именно из этого исходного кода, этим процессом, и никто не подменил его по дороге.<\/p>\n<p>В версии 1.0 определены уровни трека сборки. Build L0 означает отсутствие гарантий. Build L1: есть provenance, то есть метаданные о том, как собран пакет. Build L2: сборка идёт на размещённой платформе сборки, а не на машине разработчика, и provenance подписан этой платформой, что защищает от подмены после сборки. Build L3: платформа усилена так, что отдельные запуски не влияют друг на друга, а секреты подписи недоступны пользовательским шагам сборки.<\/p>\n<p>На практике для GitHub Actions есть генераторы provenance, а при деплое можно проверять provenance и подпись артефакта через политику допуска в кластер. Я бы шёл по уровням постепенно: сначала сборка только в CI и provenance, потом проверка подписи перед деплоем.<\/p>","sources":["https://slsa.dev/spec/v1.0/levels","https://slsa.dev/spec/v1.0/about"]},{"id":47,"num":48,"category":"DevSecOps и AppSec","text":"Какие атаки на цепочку поставок ПО вы знаете?","answer":"<p>Компрометация процесса сборки поставщика: злоумышленник внедряет код в легитимную сборку, и заражённое обновление подписывается и распространяется как настоящее. Самый известный пример это SolarWinds Orion в 2020 году.<\/p>\n<p>Компрометация зависимости: бэкдор в популярной библиотеке. Показательный случай xz utils (CVE-2024-3094): вредоносный код обнаружили в архивах исходников xz начиная с версии 5.6.0, процесс сборки liblzma извлекал заранее подготовленный объектный файл, замаскированный под тестовый, и модифицировал функции библиотеки. Также сюда относятся тайпсквоттинг, dependency confusion и захват аккаунта мейнтейнера в реестре пакетов.<\/p>\n<p>Компрометация CI/CD: утечка токенов из пайплайна, выполнение кода из пул-реквеста с доступом к секретам, подмена стороннего action. В MITRE ATT&amp;CK всё это относится к технике Supply Chain Compromise. Защита многоуровневая: SCA и фиксация версий, lock-файлы, проверка подписей и provenance, минимальные права у токенов CI, изолированная сборка по SLSA, SBOM для быстрого ответа при инциденте.<\/p>","sources":["https://nvd.nist.gov/vuln/detail/CVE-2024-3094","https://attack.mitre.org/techniques/T1195/","https://www.cisa.gov/news-events/directives/ed-21-01-mitigate-solarwinds-orion-code-compromise-closed"]},{"id":48,"num":49,"category":"DevSecOps и AppSec","text":"Как и зачем подписывать артефакты сборки?","answer":"<p>Подпись артефакта, например образа контейнера, доказывает, что он создан доверенным процессом и не изменён после этого. Без проверки подписи в кластер можно задеплоить что угодно, что лежит в реестре, включая образ, который туда подложил атакующий с украденным токеном.<\/p>\n<p>Стандартный инструмент сейчас это Sigstore и его утилита cosign. Интересная часть в keyless-подписи: вместо долгоживущего ключа, который нужно хранить и ротировать, CI получает короткоживущий сертификат, привязанный к OIDC-личности (например к конкретному репозиторию и workflow в GitHub Actions). Факт подписи записывается в публичный журнал прозрачности Rekor, поэтому подпись можно проверить и потом проаудировать.<\/p>\n<p>Подписывать без проверки бессмысленно. Вторая половина это политика на стороне кластера: admission controller (Kyverno, Sigstore policy-controller) пропускает только образы с валидной подписью от ожидаемой личности. Туда же можно прикладывать и проверять аттестации: SBOM, provenance по SLSA, результаты сканирования.<\/p>","sources":["https://docs.sigstore.dev/about/overview/","https://docs.sigstore.dev/cosign/signing/overview/","https://kyverno.io/docs/policy-types/cluster-policy/verify-images/overview/"]},{"id":49,"num":50,"category":"DevSecOps и AppSec","text":"Как искать секреты в коде и не допустить их попадания в репозиторий?","answer":"<p>Защиту строят в несколько точек. Первая на машине разработчика: pre-commit хук со сканером секретов, например gitleaks, который ловит ключ до того, как он попал в историю. Вторая на стороне платформы: в GitHub есть secret scanning и push protection, которые блокируют push с распознанным секретом известного формата. Третья в пайплайне: сканирование каждого пул-реквеста и периодическое сканирование всей истории, включая старые коммиты.<\/p>\n<p>Сканеры работают по регулярным выражениям для известных форматов ключей (AWS, GitHub, Slack) и по энтропии строк. Часть инструментов, например TruffleHog, умеет проверять, действителен ли найденный ключ, что сильно помогает приоритизировать.<\/p>\n<p>Но главная мера не в поиске, а в том, чтобы секретам незачем было появляться в коде. Приложение получает секреты из хранилища (Vault, облачный Secrets Manager) или через переменные окружения из оркестратора, а CI получает облачный доступ через OIDC-федерацию без статических ключей. Тогда разработчику просто нечего вставить в код.<\/p>","sources":["https://docs.github.com/en/code-security/secret-scanning/introduction/about-push-protection","https://github.com/gitleaks/gitleaks","https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"]},{"id":50,"num":51,"category":"DevSecOps и AppSec","text":"Что делать, если секрет попал в git-репозиторий?","answer":"<p>Первое и главное действие это отозвать и перевыпустить секрет. Считать его скомпрометированным нужно с момента push, особенно если репозиторий публичный: боты сканируют GitHub на ключи в реальном времени. Удаление коммита или переписывание истории без ротации ничего не даёт, копии уже могут быть в форках, клонах, кешах и CI.<\/p>\n<p>Второе действие это проверить, использовался ли секрет. Смотрим журналы провайдера (CloudTrail для AWS-ключей, журнал аудита сервиса) за период с момента утечки: были ли вызовы с незнакомых адресов, создание ресурсов, чтение данных. Если были, это уже инцидент, и дальше работаем по процессу реагирования.<\/p>\n<p>Третье, по желанию и после ротации, очистить историю (git filter-repo) и попросить платформу очистить кеши, чтобы секрет не продолжал светиться в сканерах. И обязательно разобрать причину: почему секрет оказался в коде, почему не сработал pre-commit или push protection, и закрыть этот путь, иначе ситуация повторится.<\/p>","sources":["https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository","https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"]},{"id":51,"num":52,"category":"DevSecOps и AppSec","text":"Как устроено управление секретами, что такое динамические секреты?","answer":"<p>Централизованное управление секретами означает, что пароли, ключи и токены хранятся в одном защищённом хранилище (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault), выдаются по политике доступа, каждое обращение журналируется, а ротация автоматизирована. По OWASP Secrets Management к этому добавляются шифрование, минимальные права и жизненный цикл секрета от создания до уничтожения.<\/p>\n<p>Динамические секреты это учётные данные, которые генерируются по запросу под конкретного клиента и живут ограниченное время. Например, Vault по запросу приложения создаёт в базе данных отдельного пользователя с нужными правами и сроком жизни в час, а по истечении срока сам его удаляет. Если такой секрет утёк, он скоро перестанет работать, а по журналу видно, кому он был выдан.<\/p>\n<p>Отдельный вопрос это «секрет нулевого уровня»: как приложение аутентифицируется в самом хранилище. Правильный ответ через идентичность платформы, а не через ещё один статический пароль: ServiceAccount в Kubernetes, IAM-роль в облаке, OIDC-токен в CI. В Kubernetes для доставки секретов в поды часто используют External Secrets Operator или CSI-драйвер хранилища.<\/p>","sources":["https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html","https://developer.hashicorp.com/vault/docs/secrets/databases","https://developer.hashicorp.com/vault/docs/auth/kubernetes"]},{"id":52,"num":53,"category":"DevSecOps и AppSec","text":"Какие основные риски безопасности CI/CD?","answer":"<p>Хороший ориентир это OWASP Top 10 CI/CD Security Risks. Туда входят: недостаточный контроль потока (код попадает в прод без обязательного ревью), слабое управление доступом и личностями, злоупотребление цепочкой зависимостей, отравленное выполнение пайплайна (Poisoned Pipeline Execution), недостаточное разграничение прав пайплайнов, плохая гигиена учётных данных, небезопасная конфигурация систем CI, бесконтрольное использование сторонних сервисов, отсутствие проверки целостности артефактов, недостаточное логирование.<\/p>\n<p>Отдельно выделю Poisoned Pipeline Execution. Атакующий, у которого есть право открыть пул-реквест, меняет файл пайплайна, Makefile или скрипт тестов, и CI выполняет его код с доступом к секретам. Поэтому пайплайны для кода из форков должны запускаться без секретов и с минимальными правами.<\/p>\n<p>Почему это важно: система CI/CD имеет доступ и к коду, и к секретам, и к проду. Скомпрометировав её, атакующий получает всё сразу, и его изменения выглядят как обычный деплой. Поэтому CI я защищаю как продовую систему: MFA, минимальные права, изолированные раннеры, журналы аудита.<\/p>","sources":["https://github.com/OWASP/www-project-top-10-ci-cd-security-risks"]},{"id":53,"num":54,"category":"DevSecOps и AppSec","text":"Как защитить GitHub Actions?","answer":"<p>Первое это права токена. <code>GITHUB_TOKEN<\/code> нужно ограничивать явным блоком <code>permissions<\/code> в workflow, по умолчанию только чтение, и выдавать запись только тем задачам, которым она нужна.<\/p>\n<p>Второе это сторонние actions. GitHub в документации по безопасному использованию прямо пишет, что закрепление action за полным SHA коммита сейчас единственный способ использовать его как неизменяемый релиз. Тег вроде <code>v4<\/code> владелец или атакующий с доступом к репозиторию может перенаправить на другой код. Для автоматического обновления закреплённых SHA подходит Dependabot.<\/p>\n<p>Третье это недоверенный ввод. Опасный триггер <code>pull_request_target<\/code> выполняется в контексте базового репозитория с доступом к секретам, и если в нём сделать checkout кода из пул-реквеста и запустить его, это прямое выполнение чужого кода с секретами. Ещё одна частая ошибка это подстановка <code>${{ github.event.pull_request.title }}<\/code> прямо в <code>run:<\/code>, что даёт инъекцию команд через заголовок пул-реквеста. Правильно передавать такие значения через переменные окружения. И наконец, для доступа в облако использовать OIDC вместо сохранённых ключей, а self-hosted раннеры не использовать для публичных репозиториев.<\/p>","sources":["https://docs.github.com/en/actions/reference/security/secure-use","https://docs.github.com/en/actions/concepts/security/openid-connect"]},{"id":54,"num":55,"category":"DevSecOps и AppSec","text":"Как CI получает доступ к облаку без статических ключей?","answer":"<p>Через OIDC-федерацию. Платформа CI, например GitHub Actions или GitLab CI, выступает провайдером идентификации и выдаёт каждому запуску подписанный короткоживущий JWT. В нём указано, из какого репозитория, ветки, окружения и workflow идёт запуск.<\/p>\n<p>В облаке настраивается доверие к этому провайдеру и роль с условием на claims токена, например разрешить принимать роль только для репозитория <code>org/app<\/code> и ветки <code>main<\/code>. Во время запуска CI обменивает свой токен на временные учётные данные облака (в AWS это <code>AssumeRoleWithWebIdentity<\/code>), которые живут минуты или часы.<\/p>\n<p>Выигрыш в том, что в CI нет ни одного долгоживущего ключа, который можно украсть из переменных или логов, и не нужно ротировать ключи. Главное место, где ошибаются, это слишком широкое условие доверия: если не ограничить <code>sub<\/code> конкретным репозиторием и веткой, роль сможет принять любой репозиторий, который использует тот же провайдер.<\/p>","sources":["https://docs.github.com/en/actions/concepts/security/openid-connect","https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html"]},{"id":55,"num":56,"category":"DevSecOps и AppSec","text":"Как защищают ветки и процесс ревью кода?","answer":"<p>Основа это правила защиты основной ветки: изменения только через пул-реквест, обязательное одобрение как минимум одного ревьюера, который не является автором, обязательное прохождение статусных проверок (тесты, SAST, SCA), запрет force-push и удаления ветки. В GitHub это branch protection rules или rulesets, в GitLab protected branches.<\/p>\n<p>Дополнительно: CODEOWNERS назначает обязательных ревьюеров для чувствительных путей, например файлов пайплайна, инфраструктурного кода и модулей аутентификации. Сброс одобрений при новых коммитах не даёт протащить изменение после ревью. Требование подписанных коммитов позволяет проверить, что автор коммита действительно тот, за кого себя выдаёт, потому что имя и email в git задаются произвольно.<\/p>\n<p>Важно, чтобы правила распространялись и на администраторов, иначе это не контроль, а рекомендация. С точки зрения OWASP CI/CD это закрывает первый риск, недостаточный контроль потока: ни один человек в одиночку не может довести изменение до прода.<\/p>","sources":["https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches","https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"]},{"id":56,"num":57,"category":"DevSecOps и AppSec","text":"Что такое dependency confusion и тайпсквоттинг?","answer":"<p>Dependency confusion возникает, когда у компании есть внутренний пакет, например <code>acme-utils<\/code> во внутреннем реестре, а менеджер пакетов настроен искать и во внутреннем, и в публичном реестре. Атакующий публикует в публичный реестр пакет с тем же именем и большей версией, и менеджер пакетов выбирает его. Код атакующего выполняется при установке на машинах разработчиков и в CI.<\/p>\n<p>Тайпсквоттинг это публикация пакета с именем, похожим на популярный: опечатка, перестановка букв, лишний дефис. Разработчик ошибается при вводе имени и ставит вредоносный пакет.<\/p>\n<p>Защита: зарезервировать имена и пространства имён своей организации в публичных реестрах (scope в npm), настроить менеджер пакетов так, чтобы внутренние имена брались только из внутреннего реестра, использовать прокси-реестр с белым списком, фиксировать версии и хеши в lock-файлах, проверять новые зависимости перед добавлением. В MITRE ATT&amp;CK это подтехника компрометации зависимостей и инструментов разработки.<\/p>","sources":["https://attack.mitre.org/techniques/T1195/001/","https://docs.npmjs.com/cli/v10/using-npm/scope"]},{"id":57,"num":58,"category":"DevSecOps и AppSec","text":"Зачем нужны lock-файлы и фиксация версий зависимостей?","answer":"<p>Lock-файл (<code>package-lock.json<\/code>, <code>poetry.lock<\/code>, <code>go.sum<\/code>) фиксирует точные версии всех зависимостей, включая транзитивные, и обычно их хеши. Без него каждая установка может подтянуть новую версию в пределах разрешённого диапазона, и сборка в CI будет отличаться от того, что проверял разработчик.<\/p>\n<p>С точки зрения безопасности это даёт две вещи. Воспроизводимость: мы точно знаем, что попало в сборку, и можем это проверить сканером. Защиту от внезапной подмены: если мейнтейнера взломали и опубликовали вредоносную версию, она не приедет автоматически. Хеши дополнительно защищают от подмены содержимого пакета с той же версией.<\/p>\n<p>Обратная сторона в том, что зафиксированные версии сами не обновляются, и уязвимости накапливаются. Поэтому фиксацию всегда сочетают с автоматическими пул-реквестами на обновление через Dependabot или Renovate и с SCA. В CI устанавливать зависимости нужно строго по lock-файлу, например <code>npm ci<\/code>, а не <code>npm install<\/code>.<\/p>","sources":["https://docs.npmjs.com/cli/v10/commands/npm-ci","https://go.dev/ref/mod#go-sum-files","https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/about-dependabot-version-updates"]},{"id":58,"num":59,"category":"DevSecOps и AppSec","text":"Какие проверки безопасности и где вы бы поставили в пайплайн?","answer":"<p>До коммита, на машине разработчика: сканер секретов в pre-commit и плагины SAST в IDE. Это самая дешёвая точка, но она не обязательная, поэтому всё повторяется дальше.<\/p>\n<p>В пул-реквесте: SAST по изменённому коду, SCA по зависимостям, сканирование секретов, проверка IaC (Terraform, манифесты Kubernetes) на ошибки конфигурации, линтер Dockerfile. Результаты показываются прямо в пул-реквесте комментариями. При сборке: сканирование образа контейнера на уязвимости, генерация SBOM, подпись образа и provenance.<\/p>\n<p>На стенде: DAST, например ZAP в режиме базового сканирования. При деплое: admission-политики в кластере проверяют подпись образа и базовые требования к подам. В проде: мониторинг, периодическое повторное сканирование образов, потому что новые CVE появляются в уже задеплоенных версиях. Принцип блокировки такой: сборку останавливают только критичные находки с доступным исправлением и найденные секреты, всё остальное уходит в бэклог с SLA, иначе пайплайн будет постоянно красным.<\/p>","sources":["https://owasp.org/www-project-devsecops-guideline/","https://csrc.nist.gov/pubs/sp/800/218/final"]},{"id":59,"num":60,"category":"DevSecOps и AppSec","text":"Как бороться с ложными срабатываниями сканеров?","answer":"<p>Первое это настройка правил под свой стек. Из коробки SAST включает всё подряд, и значительная часть правил к вашему коду не относится. Я начинаю с небольшого набора правил с высокой точностью по самым опасным классам (инъекции, секреты, небезопасная десериализация) и расширяю постепенно.<\/p>\n<p>Второе это управляемое подавление. Ложное срабатывание помечается прямо в коде или в конфигурации сканера с обязательным комментарием, почему это не уязвимость, и это подавление проходит ревью. Бесконтрольные <code>nosec<\/code> по всему коду хуже, чем отсутствие сканера.<\/p>\n<p>Третье это контекст при приоритизации. Для зависимостей это достижимость уязвимой функции и данные об эксплуатации: CISA KEV и EPSS, который оценивает вероятность эксплуатации CVE в ближайшие 30 дней. Для образов это VEX-заявления о том, что уязвимость в вашем продукте не эксплуатируется. Метрика, которую стоит отслеживать, это доля находок, которые разработчики помечают как ложные. Если она высокая, доверие к инструменту падает, и это надо чинить в первую очередь.<\/p>","sources":["https://www.first.org/epss/","https://www.cisa.gov/known-exploited-vulnerabilities-catalog","https://semgrep.dev/docs/ignoring-files-folders-code"]},{"id":60,"num":61,"category":"DevSecOps и AppSec","text":"Как проверять безопасность инфраструктурного кода (IaC)?"
