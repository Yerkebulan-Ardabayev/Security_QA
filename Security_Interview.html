оянии безопасности: если одно и то же требование постоянно нарушается, возможно, проблема в самом требовании, и его стоит пересмотреть. Аудиторы всегда смотрят на исключения: есть ли они в реестре, утверждены ли, не просрочены ли.<\/p>","sources":["https://csrc.nist.gov/pubs/sp/800/39/final","https://csrc.nist.gov/pubs/sp/800/37/r2/final"]},{"id":176,"num":177,"category":"GRC и compliance","text":"Как вы будете готовить компанию к внешнему аудиту?","answer":"<p>Сначала определяю критерии и область: по какому стандарту или требованиям аудит, какие подразделения, системы и процессы в области, какой период проверяется. Затем провожу собственную оценку по тем же критериям, как это сделал бы аудитор: по каждому требованию есть ли политика или процедура, внедрена ли она, и главное, есть ли свидетельства того, что она работает (журналы, заявки, протоколы, отчёты, скриншоты настроек).<\/p>\n<p>Найденные несоответствия закрываю по приоритету, а то, что закрыть до аудита невозможно, честно оформляю: план устранения со сроками и ответственными. Аудиторы гораздо лучше относятся к известной и управляемой проблеме, чем к проблеме, которую пытались скрыть. Параллельно внутренний аудит, если его требует стандарт, как ISO 27001.<\/p>\n<p>Перед аудитом готовлю людей: кто будет отвечать на вопросы по каждой области, чтобы ответы были точными и подкреплены документами. Во время аудита веду журнал запросов аудитора и выданных материалов. После аудита работа не заканчивается: несоответствия закрываются корректирующими действиями с анализом причин, и лучше, чтобы сбор свидетельств был автоматизирован и шёл постоянно, а не авралом раз в год.<\/p>","sources":["https://www.iso.org/standard/27001","https://www.iso.org/standard/77802.html"]},{"id":177,"num":178,"category":"GRC и compliance","text":"Какие законы Казахстана регулируют информационную безопасность и персональные данные?","answer":"<p>Основные акты. Закон РК «О персональных данных и их защите» от 21 мая 2013 года № 94-V: сбор, обработка, хранение и защита персональных данных, права субъектов, обязанности собственников и операторов. В 2026 году в него внесены существенные изменения законом от 24 июня 2026 года № 326-VIII: уведомление о начале обработки, классификация операторов по объёму данных, реестр нарушений безопасности персональных данных.<\/p>\n<p>Закон РК от 24 ноября 2015 года № 418-V, который раньше назывался «Об информатизации». В действующей редакции на adilet.zan.kz он называется «О кибербезопасности»: заголовок изменён законом от 9 января 2026 года № 256-VIII. Он регулирует защиту цифровых объектов, критически важные цифровые объекты, центры обеспечения кибербезопасности, единые требования в сферах цифровизации и обеспечения кибербезопасности. Это важная деталь: многие материалы и вакансии ещё используют старые названия.<\/p>\n<p>Ответственность устанавливает Кодекс РК об административных правонарушениях, статья 79 «Нарушение законодательства Республики Казахстан о персональных данных и их защите», а в тяжёлых случаях Уголовный кодекс. Для отдельных отраслей есть свои требования, например для банков, на которые закон о кибербезопасности прямо ссылается в части аудита.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://adilet.zan.kz/rus/docs/Z1500000418","https://adilet.zan.kz/rus/docs/K1400000235"]},{"id":178,"num":179,"category":"GRC и compliance","text":"Кто такие субъект, собственник, оператор и третье лицо по закону РК о персональных данных?","answer":"<p>Определения даны в статье 1 закона «О персональных данных и их защите». Субъект это «физическое лицо, к которому относятся персональные данные». Персональные данные это «сведения или совокупность сведений о субъекте персональных данных, дополненные одним или несколькими идентификаторами персональных данных».<\/p>\n<p>Собственник базы и (или) цифрового объекта, содержащего персональные данные, это государственный орган, физическое или юридическое лицо, которые реализуют право владения, пользования и распоряжения базой или цифровым объектом с персональными данными. Оператор это лицо, которое осуществляет «сбор, обработку и защиту персональных данных». Третье лицо это лицо, не являющееся субъектом, собственником или оператором, но связанное с ними обстоятельствами или правоотношениями по сбору, обработке и защите персональных данных, например подрядчик или облачный провайдер.<\/p>\n<p>Практически важно, что обязанности по защите закон возлагает и на собственника, и на оператора, и на третье лицо. Статья 22 прямо называет их всех, поэтому передача обработки подрядчику не снимает ответственности, а договор с ним должен описывать меры защиты. Обратите внимание, что в определениях закона теперь используется термин «цифровой объект».<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":179,"num":180,"category":"GRC и compliance","text":"Какие требования к согласию на обработку персональных данных в РК?","answer":"<p>Порядок согласия установлен статьёй 8 закона «О персональных данных и их защите». Субъект или его законный представитель даёт и отзывает согласие «письменно, посредством государственного сервиса, негосударственного сервиса либо иным способом, позволяющим подтвердить получение согласия». Для данных в цифровых объектах государственных органов согласие предоставляется через государственный сервис.<\/p>\n<p>Пункт 4 статьи 8 перечисляет, что включает согласие: наименование и БИН (ИИН) собственника или оператора, ФИО субъекта, срок действия согласия, сведения о возможности передачи третьим лицам, о наличии или отсутствии трансграничной передачи, о возможности распространения в общедоступных источниках, перечень собираемых данных и иные сведения. Срок действия согласия не может превышать срок, необходимый для достижения целей обработки.<\/p>\n<p>Субъект вправе отозвать согласие, и тогда, по пункту 7, «в течение пятнадцати рабочих дней» собственник, оператор или третье лицо обязаны прекратить обработку, если её не требует законодательство, либо дать мотивированный отказ. Отозвать согласие нельзя, если это противоречит законам или есть неисполненное обязательство. Для специалиста по безопасности отсюда следует требование к системам: согласие должно храниться с доказательством его получения, а отзыв должен реально останавливать обработку во всех системах.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":180,"num":181,"category":"GRC и compliance","text":"Что требует закон РК о месте хранения персональных данных?","answer":"<p>Пункт 2 статьи 12 закона «О персональных данных и их защите» устанавливает: «Хранение персональных данных осуществляется собственником и (или) оператором, а также третьим лицом в базе и (или) цифровом объекте, которые находятся на территории Республики Казахстан». Это требование локализации: база с персональными данными должна физически находиться в Казахстане.<\/p>\n<p>Тот же пункт определяет срок хранения: он определяется датой достижения целей сбора и обработки, если иное не предусмотрено законодательством. То есть хранить данные «на всякий случай» бессрочно закон не позволяет.<\/p>\n<p>Для архитектуры это означает, что основная база персональных данных казахстанских клиентов должна размещаться в ЦОДе или облачном регионе на территории РК, и это нужно учитывать при выборе облачного провайдера и SaaS-сервисов, включая бэкапы, реплики и журналы с персональными данными. Трансграничная передача регулируется отдельно статьёй 16, и её допустимость не отменяет требования хранить базу в РК. В уведомлении о начале обработки по статье 10-1 оператор тоже указывает место нахождения базы.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":181,"num":182,"category":"GRC и compliance","text":"Когда в Казахстане допускается трансграничная передача персональных данных?","answer":"<p>Статья 16 закона «О персональных данных и их защите» определяет трансграничную передачу как «передача персональных данных на территорию иностранных государств». По пункту 2 она осуществляется только в случае обеспечения этими государствами защиты персональных данных.<\/p>\n<p>В государства, не обеспечивающие защиту, передача по пункту 3 возможна в случаях: согласия субъекта или его законного представителя на трансграничную передачу; если это предусмотрено ратифицированными Казахстаном международными договорами; если это предусмотрено законами и необходимо для защиты конституционного строя, общественного порядка, прав и свобод граждан, здоровья и нравственности населения; для защиты конституционных прав и свобод, если получить согласие невозможно. Пункт 4 допускает, что передача может быть запрещена или ограничена законами.<\/p>\n<p>Практически для компании самый частый путь это согласие, поэтому сведения о наличии или отсутствии трансграничной передачи обязательно включаются в согласие по пункту 4 статьи 8. При использовании зарубежных SaaS-сервисов (почта, CRM, аналитика, поддержка) нужно проверить, какие персональные данные туда уходят, и помнить, что это не отменяет требования статьи 12 о хранении базы в РК.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":182,"num":183,"category":"GRC и compliance","text":"Что делать при утечке персональных данных по закону РК?","answer":"<p>Подпункт 8 пункта 2 статьи 25 закона «О персональных данных и их защите» обязывает собственника или оператора в течение одного рабочего дня «c момента обнаружения нарушения безопасности персональных данных уведомить уполномоченный орган о таком нарушении с указанием контактных данных лица, ответственного за организацию обработки персональных данных (при наличии)». Это намного жёстче, чем 72 часа в GDPR.<\/p>\n<p>Само нарушение безопасности персональных данных определено в статье 1 как нарушение защиты, повлёкшее незаконное распространение, изменение, уничтожение и удаление, несанкционированное распространение данных или несанкционированный доступ к ним. С 2026 года статья 23-2 предусматривает реестр нарушений безопасности персональных данных, который ведёт уполномоченный орган, в том числе на основе информации от центров кибербезопасности.<\/p>\n<p>Для процесса реагирования это значит, что в плане реагирования на инциденты заранее должны быть: критерии, когда инцидент считается нарушением безопасности персональных данных, ответственный за уведомление, шаблон уведомления и контакт уполномоченного органа. За один рабочий день провести полное расследование невозможно, поэтому уведомление подаётся по первичным данным и дополняется позже. Статья 22 также требует мер по своевременному обнаружению несанкционированного доступа и минимизации его последствий.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":183,"num":184,"category":"GRC и compliance","text":"Что изменилось в законе РК о персональных данных в 2026 году?","answer":"<p>Законом от 24 июня 2026 года № 326-VIII в закон «О персональных данных и их защите» внесён ряд новых статей. Статья 10-1: собственник, оператор и третье лицо до начала и прекращения обработки обязаны уведомить уполномоченный орган, за исключением малых и средних. Уведомление содержит, среди прочего, применяемые меры защиты, сведения о трансграничной передаче, перечень данных и место нахождения базы, и эти сведения вносятся в реестр лиц, осуществляющих сбор и обработку персональных данных.<\/p>\n<p>Статья 25-1 вводит классификацию по объёму: малые обрабатывают данные не более десяти тысяч уникальных субъектов, средние от десяти до пятисот тысяч, крупные от пятисот тысяч. При обработке персональных данных ограниченного доступа категория повышается на один уровень, а меры защиты по категориям определяет уполномоченный орган. Статья 23-2 вводит реестр нарушений безопасности персональных данных, статья 23-1 добровольное киберстрахование.<\/p>\n<p>Для компании практический вывод: посчитать число уникальных субъектов во всех своих системах, определить категорию, понять, нужно ли уведомление, и следить за подзаконными актами уполномоченного органа, где будут конкретные меры по категориям.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":184,"num":185,"category":"GRC и compliance","text":"Какая ответственность предусмотрена в РК за нарушения в сфере персональных данных?","answer":"<p>Статья 29 закона «О персональных данных и их защите» отсылает к другим законам, а конкретные санкции установлены статьёй 79 Кодекса РК об административных правонарушениях. Штрафы исчисляются в месячных расчётных показателях (МРП) и зависят от субъекта: физическое лицо, должностное лицо, малый, средний или крупный бизнес.<\/p>\n<p>По частям статьи 79: часть 1 это незаконные сбор и (или) обработка персональных данных, для субъектов крупного предпринимательства штраф двести МРП. Часть 2 те же деяния с использованием служебного положения, для крупного бизнеса шестьсот МРП. Часть 3 это «несоблюдение собственником, оператором или третьим лицом мер по защите персональных данных», для крупного бизнеса шестьсот МРП. Часть 4 то же деяние, повлёкшее утерю, незаконный сбор или обработку персональных данных, для крупного бизнеса две тысячи МРП.<\/p>\n<p>Для специалиста по безопасности важна часть 3: штраф возможен за само несоблюдение мер защиты, даже без доказанной утечки, а если утечка произошла, санкция резко растёт. Если деяние содержит признаки уголовного правонарушения, применяется Уголовный кодекс. Это хороший аргумент в разговоре с руководством о бюджете на защиту персональных данных.<\/p>","sources":["https://adilet.zan.kz/rus/docs/K1400000235","https://adilet.zan.kz/rus/docs/Z1300000094"]},{"id":185,"num":186,"category":"GRC и compliance","text":"Какие обязанности у владельцев критически важных цифровых объектов в РК?","answer":"<p>Статья 18 закона РК № 418-V «О кибербезопасности» (прежнее название «Об информатизации») перечисляет обязанности собственника или владельца критически важных цифровых объектов. Он обязан создать собственный центр обеспечения кибербезопасности или приобрести его услуги у третьих лиц в установленном объёме; для объектов «цифрового правительства» подключить журналирование к системе мониторинга Национального координационного центра кибербезопасности; оповещать Национальный координационный центр кибербезопасности и свой центр обеспечения кибербезопасности о самостоятельно выявленных инцидентах; передавать резервные копии на единую национальную резервную платформу; ежегодно проводить обучение по кибербезопасности и киберкультуре для работников.<\/p>\n<p>Пункт 2 той же статьи: владельцы критически важных цифровых объектов, обрабатывающие данные с охраняемой законом тайной, проводят аудит кибербезопасности не реже одного раза в год, а для банков второго уровня аудит проводится по требованиям банковского законодательства.<\/p>\n<p>Кроме этого статья 54-1 устанавливает единые требования в сферах цифровизации и обеспечения кибербезопасности, которые утверждаются постановлением Правительства. Их положения о кибербезопасности обязательны для госорганов, квазигосударственного сектора, владельцев негосударственных цифровых объектов, интегрируемых с государственными, и владельцев критически важных цифровых объектов. На собеседовании в банк или госсектор РК эти понятия почти наверняка всплывут.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1500000418"]},{"id":186,"num":187,"category":"GRC и compliance","text":"Компания запускает SaaS для казахстанских клиентов в зарубежном облаке. Что вы проверите?","answer":"<p>Первое это персональные данные. Какие данные казахстанских субъектов будет обрабатывать сервис и где будет храниться база. Пункт 2 статьи 12 закона «О персональных данных и их защите» требует хранить базу и цифровой объект с персональными данными на территории РК, поэтому основную базу нужно размещать в казахстанском ЦОДе или облачном регионе, а в зарубежное облако выносить только то, что не содержит персональных данных, или обосновывать трансграничную передачу по статье 16, обычно через согласие.<\/p>\n<p>Второе это процессы по закону: форма согласия со всеми сведениями из пункта 4 статьи 8, включая трансграничную передачу; подсчёт уникальных субъектов для категории по статье 25-1 и, если компания крупная, уведомление уполномоченного органа по статье 10-1; процесс уведомления об утечке в течение одного рабочего дня по статье 25; назначение лица, ответственного за организацию обработки. Если клиенты сервиса банки или госорганы, добавляются отраслевые требования и, возможно, единые требования по статье 54-1 закона о кибербезопасности.<\/p>\n<p>Третье это техника и договоры: шифрование, управление доступом, журналирование, резервирование, договоры с облачным провайдером и субподрядчиками как с третьими лицами с описанием мер защиты. Результат я бы оформил как карту требований с владельцами и сроками и отдельно список решений, которые должно принять руководство, например выбор региона и бюджет. По юридической квалификации конкретных случаев, конечно, нужна консультация юриста, и здесь мой юридический опыт помогает говорить с ним на одном языке.<\/p>","sources":["https://adilet.zan.kz/rus/docs/Z1300000094","https://adilet.zan.kz/rus/docs/Z1500000418"]}]};
